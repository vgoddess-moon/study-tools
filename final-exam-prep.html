<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0f14;color:#e2e8f0;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;padding:20px 16px 80px}
.wrap{max-width:640px;margin:0 auto}
h1{font-family:'DM Serif Display',serif;font-size:1.8rem;background:linear-gradient(135deg,#f87171,#fb923c,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.sub{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:#64748b;letter-spacing:.15em;text-transform:uppercase;margin-bottom:24px}
.progress-bar{background:#1e293b;border-radius:99px;height:6px;margin-bottom:24px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#f87171,#fbbf24);height:100%;border-radius:99px;transition:width .4s}
.q-card{background:#13181f;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:16px;transition:.2s}
.q-card.correct{border-color:#22c55e;background:#0d1f14}
.q-card.incorrect{border-color:#ef4444;background:#1f0d0d}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.q-num{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;letter-spacing:.1em}
.topic-badge{font-family:'IBM Plex Mono',monospace;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:8px;white-space:nowrap}
.hot{background:#3b1515;color:#f87171}
.cold{background:#0f1e3b;color:#7dd3fc}
.electro{background:#1a1040;color:#a78bfa}

.q-text{font-size:.95rem;line-height:1.6;color:#f1f5f9;margin-bottom:16px;font-weight:500}

.options{display:flex;flex-direction:column;gap:8px}
.option{background:#0c1420;border:1.5px solid #1e293b;border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s;display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%}
.option:hover:not(:disabled){border-color:#334155;background:#111827}
.option.selected{border-color:#6366f1;background:#1a1f3a}
.option.correct-ans{border-color:#22c55e !important;background:#0d1f14 !important}
.option.wrong-ans{border-color:#ef4444 !important;background:#1f0d0d !important}

.option-text{font-size:.85rem;color:#cbd5e1;line-height:1.5}
.check-btn{background:#6366f1;color:#fff;border:none;border-radius:12px;padding:12px 24px;font-size:.85rem;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;width:100%;margin-top:12px;transition:.15s}
.check-btn:hover{background:#4f46e5}
.check-btn:disabled{background:#1e293b;color:#475569;cursor:default}
.rationale{margin-top:14px;padding:14px;background:#0c1420;border-radius:12px;border-left:3px solid #6366f1}
.rationale-header{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#6366f1;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.rationale-text{font-size:.82rem;color:#94a3b8;line-height:1.6}

.option-rationale.r-correct{background:#0d1f14;border-left:2px solid #22c55e;color:#86efac}
.option-rationale.r-wrong{background:#1f0d0d;border-left:2px solid #ef4444;color:#fca5a5}
.trap-call{background:#2a1f00;border:1px solid #3d2e00;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.78rem;color:#fbbf24;line-height:1.5}
.trap-icon{font-size:.9rem;margin-right:4px}
.score-card{background:#13181f;border:1px solid #1e293b;border-radius:20px;padding:28px;text-align:center;margin-top:20px;display:none}
.score-big{font-family:'DM Serif Display',serif;font-size:3.5rem;margin-bottom:4px}
.score-pct{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:#64748b;margin-bottom:20px}
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.score-cell{background:#0c0f14;border-radius:12px;padding:12px}
.score-cell-label{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.score-cell-val{font-size:1.1rem;font-weight:700;color:#f1f5f9}
.weak-list{text-align:left;background:#0c0f14;border-radius:12px;padding:16px;margin-bottom:16px}
.weak-item{font-size:.82rem;color:#94a3b8;padding:5px 0;border-bottom:1px solid #1e293b;line-height:1.5}
.weak-item:last-child{border-bottom:none}
.weak-item .w-topic{font-weight:700;color:#f87171}
.restart-btn{background:#13181f;border:1.5px solid #334155;color:#cbd5e1;border-radius:12px;padding:12px 24px;font-size:.85rem;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;width:100%;transition:.15s}
.restart-btn:hover{border-color:#6366f1;color:#818cf8}
.nav-row{display:flex;gap:10px;margin-top:16px}
.nav-btn{flex:1;background:#13181f;border:1.5px solid #1e293b;color:#94a3b8;border-radius:12px;padding:10px;font-size:.82rem;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:.15s}
.nav-btn:hover{border-color:#334155;color:#cbd5e1}
.nav-btn.primary{background:#6366f1;border-color:#6366f1;color:#fff}
.nav-btn.primary:hover{background:#4f46e5}
.sticky-bar{position:fixed;bottom:0;left:0;right:0;background:#0c0f14;border-top:1px solid #1e293b;padding:12px 16px;display:flex;gap:10px;justify-content:center}
.sticky-inner{max-width:640px;width:100%;display:flex;gap:10px}

<script>
const QUESTIONS = [
  // ============ HEAT-RELATED ILLNESS (recurring miss) ============
  {
    id:1, topic:'Heat-Related Illness', badge:'hot', type:'single',
    trap:true, trapNote:'Heat STROKE = emergency. The temp cutoff is ≥104°F (40°C). No sweating ≠ required for stroke — professor trap.',
    text:'A nurse is caring for a patient brought in from an outdoor concert. Temperature is 105.2°F (40.7°C), skin is hot and dry, and the patient is confused and unresponsive to commands. Which is the priority nursing action?',
    options:[
      {l:'A', t:'Administer 1 L of normal saline IV bolus immediately', correct:false, rationale:'Fluid resuscitation is important but NOT the first priority. Cooling takes precedence — every minute of hyperthermia causes more brain damage.'},
      {l:'B', t:'Remove clothing and apply ice packs to the neck, axilla, and groin', correct:true, rationale:'CORRECT. Heat stroke is a life-threatening emergency. Immediate aggressive cooling is the priority. Ice packs to high-blood-flow areas (neck, axilla, groin) is the fastest initial cooling method.'},
      {l:'C', t:'Move the patient to a cool environment and encourage oral fluids', correct:false, rationale:'This is appropriate for heat EXHAUSTION (conscious, diaphoretic). This patient has heat STROKE — altered LOC and hot dry skin. Oral fluids are contraindicated with altered consciousness.'},
      {l:'D', t:'Place the patient in the Trendelenburg position to improve cerebral perfusion', correct:false, rationale:'Trendelenburg is NOT indicated for heat stroke and would impair breathing. Do not do this.'},
    ]
  },
  {
    id:2, topic:'Heat-Related Illness', badge:'hot', type:'sata',
    trap:true, trapNote:'Heat exhaustion vs stroke distinction is a classic SATA trap. Stroke = high temp + neuro changes. Exhaustion = normal/mild temp + intact neuro.',
    text:'A nurse is triaging patients at an outdoor event. Which findings indicate heat EXHAUSTION rather than heat stroke? Select all that apply.',
    options:[
      {l:'A', t:'Core temperature of 99.8°F (37.7°C)', correct:true, rationale:'CORRECT. Heat exhaustion typically has normal to mildly elevated temp (up to 104°F). Below 104°F points toward exhaustion.'},
      {l:'B', t:'Profuse diaphoresis with cool, clammy skin', correct:true, rationale:'CORRECT. Heat exhaustion — the sweating mechanism is still working. Heat stroke = hot, DRY skin (sweating fails).'},
      {l:'C', t:'Alert and oriented, complaining of dizziness and nausea', correct:true, rationale:'CORRECT. Heat exhaustion preserves neuro status. Altered LOC = heat stroke.'},
      {l:'D', t:'Confusion and inability to follow commands', correct:false, rationale:'WRONG. This is heat STROKE. Neuro changes (confusion, altered LOC) = stroke, not exhaustion.'},
      {l:'E', t:'Core temperature of 105°F (40.6°C) with hot, dry skin', correct:false, rationale:'WRONG. This is heat STROKE. ≥104°F + hot dry skin + neuro changes = stroke emergency.'},
    ]
  },
  // ============ COLD-RELATED INJURY (Claude exam miss) ============
  {
    id:3, topic:'Cold-Related Injury', badge:'cold', type:'sata',
    trap:true, trapNote:'Cold-related SATA trap: Do NOT rub frostbitten tissue (causes more damage). Do NOT rewarm if refreezing is possible. Passive rewarming is for mild hypothermia only.',
    text:'A patient presents with frostbitten fingers after being stranded outdoors. Which nursing interventions are appropriate? Select all that apply.',
    options:[
      {l:'A', t:'Rewarm affected fingers in warm water 99–104°F (37–40°C)', correct:true, rationale:'CORRECT. Rapid rewarming in warm water (NOT hot) is the treatment. 99–104°F is the professor-specified range.'},
      {l:'B', t:'Gently rub the fingers to stimulate circulation', correct:false, rationale:'WRONG. Never rub frostbitten tissue. Rubbing causes ice crystal formation to damage cells further. This is a classic professor trap.'},
      {l:'C', t:'Administer analgesics before rewarming procedure', correct:true, rationale:'CORRECT. Rewarming is extremely painful. Pre-medicate with analgesics before starting.'},
      {l:'D', t:'Apply dry, loose sterile dressings after rewarming', correct:true, rationale:'CORRECT. After rewarming, protect the tissue with dry, loose (not tight) sterile dressings. Do not compress.'},
      {l:'E', t:'Rewarm immediately even if the patient may be re-exposed to cold', correct:false, rationale:'WRONG. Do NOT rewarm if refreezing is possible. Freeze-thaw-refreeze cycle causes far more tissue damage than keeping it frozen.'},
    ]
  },
  {
    id:4, topic:'Cold-Related Injury', badge:'cold', type:'single',
    trap:true, trapNote:'Hypothermia temperature staging: Mild 32–35°C / 89.6–95°F, Moderate 28–32°C, Severe <28°C. At <30°C (86°F) the heart is at risk for V-fib.',
    text:'A patient is brought in with a core temperature of 29°C (84.2°F). He is unconscious and has a weak, irregular pulse. Which action is the priority?',
    options:[
      {l:'A', t:'Apply warm blankets and heating pads to the skin', correct:false, rationale:'Passive rewarming is for MILD hypothermia only. This patient is severely hypothermic (29°C). Passive rewarming is insufficient and wastes time.'},
      {l:'B', t:'Initiate active internal rewarming and continuous cardiac monitoring', correct:true, rationale:'CORRECT. Severe hypothermia (<30°C) requires active internal rewarming (warmed IV fluids, warmed humidified O2). Cardiac monitoring is critical — at this temp, V-fib is the primary risk.'},
      {l:'C', t:'Rub the extremities vigorously to generate heat', correct:false, rationale:'WRONG. Never rub a hypothermic patient — same as frostbite. Cold blood from extremities rushes to the core and can worsen cardiac status (afterdrop).'},
      {l:'D', t:'Give hot beverages and encourage movement to generate body heat', correct:false, rationale:'This is for MILD, conscious hypothermia. An unconscious patient with 29°C temp cannot protect the airway. No oral intake.'},
    ]
  },
  // ============ POTASSIUM / HYPOKALEMIA (Claude exam miss) ============
  {
    id:5, topic:'Potassium / Hypokalemia', badge:'electro', type:'sata',
    trap:true, trapNote:'Hypokalemia SATA: Remember the ECG changes (flat T waves, U waves) AND the nursing rules (never IV push, never bolus). Also: hypokalemia worsens digoxin toxicity.',
    text:'A patient has a potassium level of 2.8 mEq/L. Which nursing interventions are appropriate? Select all that apply.',
    options:[
      {l:'A', t:'Administer IV potassium chloride via slow infusion (no faster than 10 mEq/hr peripherally)', correct:true, rationale:'CORRECT. IV KCl must never be given as an IV push or bolus. Max peripheral rate is 10 mEq/hr. Central line allows up to 20 mEq/hr.'},
      {l:'B', t:'Place the patient on continuous cardiac monitoring', correct:true, rationale:'CORRECT. Hypokalemia causes dysrhythmias. Flat/inverted T waves and U waves on ECG. Continuous monitoring is essential.'},
      {l:'C', t:'Administer the IV potassium undiluted as a direct IV push', correct:false, rationale:'WRONG — and deadly. IV potassium NEVER undiluted, NEVER IV push. This can cause cardiac arrest. Professor will test this.'},
      {l:'D', t:'Encourage foods high in potassium (bananas, oranges, potatoes)', correct:true, rationale:'CORRECT. Dietary potassium supplementation is appropriate for mild-moderate hypokalemia as an adjunct to IV replacement.'},
      {l:'E', t:'Assess for muscle weakness and diminished deep tendon reflexes', correct:true, rationale:'CORRECT. Hypokalemia causes muscle weakness, cramps, fatigue, and decreased DTRs. Assessment is a key nursing action.'},
    ]
  },
  {
    id:6, topic:'Potassium / ECG Changes', badge:'electro', type:'single',
    trap:false,
    text:'A nurse reviews an ECG for a patient with a potassium level of 2.6 mEq/L. Which ECG finding is most consistent with this value?',
    options:[
      {l:'A', t:'Peaked, tall T waves', correct:false, rationale:'Peaked T waves = HYPERkalemia (too much K). Think: peaked = too high.'},
      {l:'B', t:'Widened QRS complex with sine wave pattern', correct:false, rationale:'Widened QRS/sine wave = severe HYPERkalemia (K > 7.0). Life-threatening — but this is hypo, not hyper.'},
      {l:'C', t:'Flat or inverted T waves with prominent U waves', correct:true, rationale:'CORRECT. HYPOkalemia = flat/inverted T waves + U waves (a bump after the T wave). Low K = low flat T. This is the classic ECG pattern.'},
      {l:'D', t:'Prolonged PR interval with dropped QRS complexes', correct:false, rationale:'This describes heart block — not directly caused by hypokalemia alone. Don\'t confuse with potassium ECG changes.'},
    ]
  },
  // ============ ALTITUDE ILLNESS (Claude exam miss) ============
  {
    id:7, topic:'Altitude Illness', badge:'hot', type:'sata',
    trap:true, trapNote:'HACE vs HAPE vs AMS: AMS = headache + GI. HACE = severe AMS + ataxia + altered LOC. HAPE = crackles + hypoxia + pink frothy sputum. Treatment priority = DESCEND first.',
    text:'A climber at 14,000 feet develops severe headache, ataxia, and becomes confused. Which actions are priority? Select all that apply.',
    options:[
      {l:'A', t:'Descend immediately to lower altitude', correct:true, rationale:'CORRECT. Immediate descent is the definitive treatment for HACE (High-Altitude Cerebral Edema). This takes priority over all other interventions.'},
      {l:'B', t:'Administer supplemental oxygen', correct:true, rationale:'CORRECT. Supplemental O2 reduces hypoxia and buys time during descent. Give it while preparing to descend.'},
      {l:'C', t:'Administer dexamethasone (Decadron)', correct:true, rationale:'CORRECT. Dexamethasone reduces cerebral edema in HACE. Used as an adjunct when descent is delayed. Professor-tested drug.'},
      {l:'D', t:'Keep the patient at current altitude and increase oral fluid intake', correct:false, rationale:'WRONG. Never stay at altitude with HACE. Staying causes progressive cerebral edema and death. Hydration alone cannot treat HACE.'},
      {l:'E', t:'Administer acetazolamide (Diamox) as the primary treatment for HACE', correct:false, rationale:'WRONG. Acetazolamide is for PREVENTION of AMS or mild AMS treatment — NOT for severe HACE. Dexamethasone is the drug for HACE.'},
    ]
  },
  {
    id:8, topic:'Altitude Illness', badge:'hot', type:'single',
    trap:true, trapNote:'HAPE = pulmonary issue. Pink frothy sputum = blood-tinged pulmonary edema. Key drug: nifedipine (reduces pulmonary arterial pressure).',
    text:'A mountain climber at high altitude develops increasing dyspnea, a productive cough with pink frothy sputum, crackles in bilateral lung fields, and O2 sat of 78%. Which medication is most appropriate?',
    options:[
      {l:'A', t:'Dexamethasone', correct:false, rationale:'Dexamethasone is for HACE (cerebral edema). This patient has HAPE (pulmonary edema) — different condition, different drug.'},
      {l:'B', t:'Acetazolamide (Diamox)', correct:false, rationale:'Acetazolamide prevents/treats AMS. Not the primary agent for HAPE. Don\'t confuse these.'},
      {l:'C', t:'Nifedipine', correct:true, rationale:'CORRECT. Nifedipine (calcium channel blocker) reduces pulmonary artery pressure in HAPE. Used with descent and supplemental O2. This is the professor-specific drug for HAPE.'},
      {l:'D', t:'Furosemide', correct:false, rationale:'Furosemide is a diuretic — it may seem logical for pulmonary edema, but HAPE fluid is from hypoxic vasoconstriction, not fluid overload. Nifedipine targets the cause. Descent + O2 + nifedipine = correct.'},
    ]
  },
  // ============ INFUSION THERAPY CH15 (weakest score today — 70%) ============
  {
    id:9, topic:'Infusion Therapy', badge:'infusion', type:'single',
    trap:true, trapNote:'Blood products require 18-gauge or larger. 20-gauge is too small and will lyse RBCs. This is one of the most commonly tested professor traps in Chapter 15.',
    text:'A nurse is preparing to transfuse packed red blood cells. The patient has a 20-gauge peripheral IV catheter in place. What is the correct action?',
    options:[
      {l:'A', t:'Use the existing 20-gauge catheter — it is adequate for blood transfusion', correct:false, rationale:'WRONG. 20-gauge is too small for blood. RBCs will lyse (break apart) as they are forced through the small lumen under pressure. This is a professor trap.'},
      {l:'B', t:'Establish a new IV site with an 18-gauge or larger catheter before transfusing', correct:true, rationale:'CORRECT. Blood products require 18-gauge or larger. 18G minimum = the rule. Anything smaller risks hemolysis.'},
      {l:'C', t:'Dilute the blood product with normal saline to allow infusion through the 20-gauge', correct:false, rationale:'You can use NS as a flush/co-infusion, but diluting the blood to get through a smaller catheter is not the answer. Get the right gauge first.'},
      {l:'D', t:'Warm the blood to 40°C before infusing to reduce viscosity', correct:false, rationale:'Blood warmers (37°C max) are used for rapid transfusions or cold agglutinin issues — not routinely, and certainly not to work around a wrong gauge catheter.'},
    ]
  },
  {
    id:10, topic:'Infusion Therapy', badge:'infusion', type:'sata',
    trap:true, trapNote:'Extravasation = vesicant leaks into tissue → necrosis. Infiltration = non-vesicant leaks → swelling only. Stop infusion first, THEN act.',
    text:'A nurse assesses a patient\'s IV site and notes swelling, redness, and the patient reports severe burning pain at the insertion site. The patient is receiving a vesicant chemotherapy drug. Which actions are correct? Select all that apply.',
    options:[
      {l:'A', t:'Stop the infusion immediately', correct:true, rationale:'CORRECT. Stop the infusion FIRST before anything else. This is the universal first step for any IV complication.'},
      {l:'B', t:'Aspirate any residual drug from the catheter before removing it', correct:true, rationale:'CORRECT. With vesicant extravasation, aspirate as much drug back as possible before catheter removal to minimize tissue damage.'},
      {l:'C', t:'Apply warm compresses to the site to increase blood flow', correct:false, rationale:'WRONG for vesicants. Cold compresses are typically used for most vesicants to limit spread. Warm compresses may spread the vesicant further. Exception: vinca alkaloids use warm.'},
      {l:'D', t:'Document the site, notify the provider, and apply appropriate antidote per protocol', correct:true, rationale:'CORRECT. All three: document, notify MD, apply vesicant-specific antidote (e.g., hyaluronidase, DMSO). Follow facility protocol.'},
      {l:'E', t:'Restart the infusion in the same extremity distal to the extravasation site', correct:false, rationale:'WRONG. Never restart a vesicant infusion distal to an extravasation site in the same extremity. The already-compromised vasculature increases re-extravasation risk.'},
    ]
  },
  {
    id:11, topic:'Infusion Therapy', badge:'infusion', type:'single',
    trap:true, trapNote:'PICC vs Midline: PICC tip = superior vena cava. Midline = axillary vein (no further than 5cm past antecubital). Midline is NOT for vesicants, TPN, or continuous infusions of irritants.',
    text:'A patient requires long-term antibiotic therapy for osteomyelitis. The provider orders a midline catheter. Which assessment finding would require the nurse to question this order?',
    options:[
      {l:'A', t:'The patient\'s antecubital veins are difficult to visualize', correct:false, rationale:'Midline catheters are placed with ultrasound guidance — this is a normal indication for a midline. Not a reason to question the order.'},
      {l:'B', t:'The antibiotic ordered is known to be a vesicant', correct:true, rationale:'CORRECT. Midline catheters terminate in the axillary or basilic vein — a peripheral vessel. Vesicants should only go into central veins (PICC to SVC). Using a midline for a vesicant risks severe tissue necrosis.'},
      {l:'C', t:'The patient has a latex allergy', correct:false, rationale:'Latex-free catheters are available. This requires using appropriate supplies, not questioning the type of access. Not a midline-specific issue.'},
      {l:'D', t:'The prescribed therapy is expected to last 3 weeks', correct:false, rationale:'Midlines are appropriate for 1–4 weeks of therapy. 3 weeks is within the acceptable range. PICC is preferred for longer duration.'},
    ]
  },
  {
    id:12, topic:'Infusion Therapy', badge:'infusion', type:'single',
    trap:true, trapNote:'CRBSI prevention bundle: hand hygiene, maximal barrier precautions, chlorhexidine skin prep, avoid femoral site, remove when no longer needed.',
    text:'A nurse is inserting a central venous catheter. Which action is MOST important to prevent catheter-related bloodstream infection (CRBSI)?',
    options:[
      {l:'A', t:'Use a 2% chlorhexidine gluconate solution for skin preparation', correct:true, rationale:'CORRECT. Chlorhexidine 2% is the preferred antiseptic for central line insertion. It has a longer residual effect than povidone-iodine. This is the professor-emphasized CRBSI prevention agent.'},
      {l:'B', t:'Change the central line every 72 hours to prevent infection', correct:false, rationale:'Routine central line changes are NOT recommended and actually increase infection risk (each insertion is a new opportunity for contamination). Remove only when clinically indicated.'},
      {l:'C', t:'Apply an antibiotic ointment at the insertion site with each dressing change', correct:false, rationale:'Antibiotic ointments are NOT recommended for central lines. They can promote fungal infection and antibiotic resistance.'},
      {l:'D', t:'Choose the femoral vein for insertion to allow easy monitoring', correct:false, rationale:'The femoral site has the HIGHEST infection rate and should be AVOIDED unless no other site is available. Subclavian preferred, then internal jugular.'},
    ]
  },
  // ============ FLUID TONICITY (most tested area) ============
  {
    id:13, topic:'IV Fluid Tonicity', badge:'electro', type:'single',
    trap:true, trapNote:'Isotonic = cells stay same size. Hypotonic = cells SWELL (water goes in). Hypertonic = cells SHRINK (water goes out). D5W is isotonic in the bag but acts as hypotonic in the body.',
    text:'A patient with cerebral edema after a traumatic brain injury is prescribed 3% NaCl IV. What is the rationale for this order?',
    options:[
      {l:'A', t:'To replace lost isotonic fluid and restore circulating volume', correct:false, rationale:'3% NaCl is HYPERTONIC — not isotonic. Isotonic fluids (0.9% NS, LR) replace volume. Hypertonic has a different mechanism.'},
      {l:'B', t:'To draw water OUT of brain cells into the vasculature by osmosis', correct:true, rationale:'CORRECT. 3% NaCl is hypertonic. Higher osmolarity in the blood draws water from swollen brain cells into the bloodstream, reducing cerebral edema. Hypertonic = cells shrink.'},
      {l:'C', t:'To provide free water to dilute serum sodium', correct:false, rationale:'Free water dilutes sodium — that\'s what HYPOTONIC solutions do. 3% NaCl INCREASES serum sodium. Opposite effect.'},
      {l:'D', t:'To expand the interstitial fluid space and reduce intracellular pressure', correct:false, rationale:'Hypertonic saline pulls fluid FROM the interstitium/intracellular into the vascular space. It does not expand the interstitium.'},
    ]
  },
  {
    id:14, topic:'IV Fluid Tonicity', badge:'electro', type:'sata',
    trap:true, trapNote:'D5W trap: isotonic in bag → hypotonic in body. Never give to patients with increased ICP or hyponatremia — worsens cerebral edema.',
    text:'A nurse is reviewing IV fluid orders. Which statements about D5W (5% dextrose in water) are correct? Select all that apply.',

let state = { answers: {}, submitted: {}, score: 0, total: QUESTIONS.length };

function isSATA(q) { return q.type === 'sata'; }

function getSelected(qid) {
  return state.answers[qid] || [];
}

function toggleAnswer(qid, optIdx) {
  if (state.submitted[qid]) return;
  const q = QUESTIONS.find(q => q.id === qid);
  if (!isSATA(q)) {
    state.answers[qid] = [optIdx];
  } else {
    const cur = getSelected(qid);
    if (cur.includes(optIdx)) {
      state.answers[qid] = cur.filter(x => x !== optIdx);
    } else {
      state.answers[qid] = [...cur, optIdx];
    }
  }
  renderQuestion(qid);
}

function submitQuestion(qid) {
  if (state.submitted[qid]) return;
  const q = QUESTIONS.find(q => q.id === qid);
  const selected = getSelected(qid);
  if (selected.length === 0) return;
  const correctIdxs = q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0);
  const isCorrect = isSATA(q)
    ? correctIdxs.length === selected.length && correctIdxs.every(i => selected.includes(i))
    : selected.length === 1 && q.options[selected[0]].correct;
  state.submitted[qid] = { correct: isCorrect };
  if (isCorrect) state.score++;
  renderQuestion(qid);
  updateProgress();
  if (Object.keys(state.submitted).length === QUESTIONS.length) {
    setTimeout(showScore, 600);
  }
}

function renderQuestion(qid) {
  const q = QUESTIONS.find(q => q.id === qid);
  const el = document.getElementById('q-' + qid);
  if (!el) return;
  const sub = state.submitted[qid];
  const selected = getSelected(qid);
  const correctIdxs = q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0);

  if (sub) {
    el.classList.remove('correct', 'incorrect');
    el.classList.add(sub.correct ? 'correct' : 'incorrect');
  }

  const optionsEl = el.querySelector('.options');
  optionsEl.innerHTML = q.options.map((opt, i) => {
    let cls = 'option';
    if (selected.includes(i)) cls += ' selected';
    if (sub) {
      if (opt.correct) cls += ' correct-ans';
      else if (selected.includes(i) && !opt.correct) cls += ' wrong-ans';
    }
    const rationalePart = sub ? `<div class="option-rationale ${opt.correct ? 'r-correct' : 'r-wrong'}">${opt.correct ? '✓' : '✗'} ${opt.rationale}</div>` : '';
    return `<button class="${cls}" onclick="toggleAnswer(${qid}, ${i})" ${sub ? 'disabled' : ''}><span class="option-letter">${opt.l}</span><div><span class="option-text">${opt.t}</span>${rationalePart}</div></button>`;
  }).join('');

  const btnEl = el.querySelector('.check-btn');
  if (btnEl) {
    btnEl.disabled = selected.length === 0 || !!sub;
    btnEl.textContent = sub ? (sub.correct ? '✓ Correct' : '✗ Incorrect') : (isSATA(q) ? 'Submit Selections' : 'Check Answer');
  }

  if (sub && q.trap) {
    const existing = el.querySelector('.trap-call');
    if (!existing) {
      const rat = el.querySelector('.rationale');
      if (rat) {
        const trapEl = document.createElement('div');
        trapEl.className = 'trap-call';
        trapEl.innerHTML = `<span class="trap-icon">⚠️</span><strong>Professor Trap:</strong> ${q.trapNote}`;
        rat.after(trapEl);
      }
    }
  }
}

function buildQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = QUESTIONS.map(q => `
    <div class="q-card" id="q-${q.id}">
      <div class="q-meta">
        <span class="q-num">Q${q.id} of ${QUESTIONS.length}</span>
        <span class="topic-badge ${q.badge}">${q.topic}</span>
        ${q.trap ? '<span class="trap-badge">⚠ Trap</span>' : ''}
        ${isSATA(q) ? '<span class="trap-badge" style="background:#1a1040;border-color:#3d2e6b;color:#a78bfa">SATA</span>' : ''}
      </div>
      <p class="q-text">${q.text}</p>
      ${isSATA(q) ? '<span class="sata-label">SELECT ALL THAT APPLY</span>' : ''}
      <div class="options"></div>
      <button class="check-btn" onclick="submitQuestion(${q.id})" disabled>${isSATA(q) ? 'Submit Selections' : 'Check Answer'}</button>
      <div class="rationale" style="display:none"></div>
    </div>
  `).join('');
  QUESTIONS.forEach(q => renderQuestion(q.id));
}

function updateProgress() {
  const done = Object.keys(state.submitted).length;
  document.getElementById('progressFill').style.width = (done / QUESTIONS.length * 100) + '%';
}

function showScore() {
  const sc = document.getElementById('scoreCard');
  sc.style.display = 'block';
  const pct = Math.round(state.score / QUESTIONS.length * 100);
  const grade = pct >= 90 ? '#22c55e' : pct >= 78 ? '#fbbf24' : '#ef4444';
  const msg = pct >= 90 ? 'Ready for tomorrow 🔥' : pct >= 78 ? 'Strong — review missed topics' : 'Focus review needed — see weak areas below';

  const topicScores = {};
  QUESTIONS.forEach(q => {
    if (!topicScores[q.topic]) topicScores[q.topic] = { c: 0, t: 0 };
    topicScores[q.topic].t++;
    if (state.submitted[q.id]?.correct) topicScores[q.topic].c++;
  });

  const weakTopics = Object.entries(topicScores)
    .filter(([_, v]) => v.c < v.t)
    .sort((a, b) => (a[1].c / a[1].t) - (b[1].c / b[1].t));

  sc.innerHTML = `
    <div class="score-big" style="color:${grade}">${state.score}/${QUESTIONS.length}</div>
    <div class="score-pct">${pct}% · ${msg}</div>
    <div class="score-grid">
      ${Object.entries(topicScores).map(([topic, v]) => `
        <div class="score-cell">
          <div class="score-cell-label">${topic}</div>
          <div class="score-cell-val" style="color:${v.c===v.t?'#22c55e':v.c/v.t>=.5?'#fbbf24':'#ef4444'}">${v.c}/${v.t}</div>
        </div>`).join('')}
    </div>
    ${weakTopics.length > 0 ? `<div class="weak-list"><div style="font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Review before exam</div>${weakTopics.map(([topic, v]) => `<div class="weak-item"><span class="w-topic">${topic}</span> — ${v.c}/${v.t} correct</div>`).join('')}</div>` : ''}
    <button class="restart-btn" onclick="restartQuiz()">Retake Exam</button>
  `;
  sc.scrollIntoView({ behavior: 'smooth' });
}

function restartQuiz() {
  state = { answers: {}, submitted: {}, score: 0, total: QUESTIONS.length };
  updateProgress();
  document.getElementById('scoreCard').style.display = 'none';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
updateProgress();
</script>
