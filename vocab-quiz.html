(function(){
  function _seedHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
  Object.keys(VOCAB_DATA).forEach(function(tier){
    VOCAB_DATA[tier].forEach(function(q,qi){
      if(!q.options||q.options.length<2)return;
      var a=q.options.slice();
      var rnd=mulberry32(_seedHash('ms1-vocab-quiz#'+tier+'#'+qi));
      for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
      q.options=a;
    });
  });
})();

let state = {
prof: {answers:{},submitted:{}},
hesi: {answers:{},submitted:{}},
nclex: {answers:{},submitted:{}}
};

const STORAGE_KEY = 'ms1e2_vocab_scores';

function loadState(){
try{const s=localStorage.getItem(STORAGE_KEY);if(s)state=JSON.parse(s);}catch(e){}
}
function saveState(){
try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}

function switchPanel(id){
document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById('panel-'+id).classList.add('active');
document.querySelector('.tab-'+id).classList.add('active');
if(id==='analytics')renderAnalytics();
}

function selectOption(tier,qi,oi){
if(state[tier].submitted[qi])return;
state[tier].answers[qi]=oi;
saveState();
renderTier(tier);
}

function submitAnswer(tier,qi){
if(state[tier].answers[qi]===undefined||state[tier].submitted[qi])return;
state[tier].submitted[qi]=true;
saveState();
renderTier(tier);
}

function renderTier(tier){
const panel=document.getElementById('panel-'+tier);
const data=VOCAB_DATA[tier];
const tierLabel=tier==='prof'?'Tier 1 — Professor Terms':tier==='hesi'?'Tier 2 — HESI / Class Exam':'Tier 3 — NCLEX-Level';
const tierClass=tier==='prof'?'tier-1':tier==='hesi'?'tier-2':'tier-3';

const answered=Object.keys(state[tier].submitted).length;
const correct=Object.keys(state[tier].submitted).filter(qi=>{
const q=data[qi];
return q.options[state[tier].answers[qi]]?.correct;
}).length;
const pct=data.length>0?Math.round((answered/data.length)*100):0;

let html=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
if(answered>0){
html+=`<div class="score-display"><div class="big">${correct}/${answered}</div><div class="label">${tierLabel} — ${Math.round(correct/answered*100)}% correct</div></div>`;
}

data.forEach((q,qi)=>{
const selected=state[tier].answers[qi];
const submitted=state[tier].submitted[qi];
const isCorrect=submitted&&q.options[selected]?.correct;

html+=`<div class="card">`;
html+=`<div class="q-num">Question ${qi+1} of ${data.length} <span class="chapter-tag">${q.chapter}</span></div>`;
html+=`<span class="tier-badge ${tierClass}">${tierLabel}</span>`;
html+=`<div class="term-display">${q.term}</div>`;
if(q.pronunciation)html+=`<div class="pronunciation">${q.pronunciation}</div>`;
html+=`<div class="word-breakdown"><div class="label">Word Breakdown</div><div class="parts">${q.breakdown.meaning}</div></div>`;
html+=`<div class="prompt">${q.prompt}</div>`;
html+=`<div class="options">`;
q.options.forEach((opt,oi)=>{
let cls='opt';
if(submitted){
cls+=' disabled show-rat';
if(opt.correct)cls+=' correct';
else if(oi===selected&&!opt.correct)cls+=' wrong';
}else if(oi===selected){
cls+=' selected';
}
html+=`<div class="${cls}" onclick="selectOption('${tier}',${qi},${oi})">`;
html+=`<strong>${String.fromCharCode(65+oi)}.</strong> ${opt.text}`;
html+=`<div class="opt-rat">${opt.correct?'✅':'❌'} ${opt.rationale}</div>`;
html+=`</div>`;
});
html+=`</div>`;

if(!submitted){
const ready=selected!==undefined;
html+=`<button class="submit-btn ${ready?'ready':''}" ${ready?'':'disabled'} onclick="submitAnswer('${tier}',${qi})">Submit Answer</button>`;
}

if(submitted&&q.mnemonic){
html+=`<div class="mnemonic-box show"><div class="label">🧠 Mnemonic</div><div class="content">${q.mnemonic}</div></div>`;
}
if(submitted&&q.clinical){
html+=`<div class="clinical-box show"><div class="label">🏥 Clinical Connection</div><div class="content">${q.clinical}</div></div>`;
}
if(submitted&&q.profNote){
html+=`<div class="prof-box show"><div class="label">👨‍🏫 Professor's Emphasis</div><div class="content">${q.profNote}</div></div>`;
}
html+=`</div>`;
});

html+=`<button class="retake-btn" onclick="retakeTier('${tier}')">🔄 Retake ${tierLabel}</button>`;
panel.innerHTML=html;
}

function retakeTier(tier){
state[tier]={answers:{},submitted:{}};
saveState();
renderTier(tier);
window.scrollTo(0,0);
}

function renderAnalytics(){
const panel=document.getElementById('panel-analytics');
let html='';

const tiers=[
{key:'prof',label:'Tier 1 — Professor Terms',color:'#818cf8'},
{key:'hesi',label:'Tier 2 — HESI / Class Exam',color:'#f59e0b'},
{key:'nclex',label:'Tier 3 — NCLEX-Level',color:'#ef4444'}
];

let totalCorrect=0,totalAnswered=0;
tiers.forEach(t=>{
const data=VOCAB_DATA[t.key];
const answered=Object.keys(state[t.key].submitted).length;
const correct=Object.keys(state[t.key].submitted).filter(qi=>data[qi].options[state[t.key].answers[qi]]?.correct).length;
totalCorrect+=correct;
totalAnswered+=answered;
});

html+=`<div class="score-display"><div class="big">${totalCorrect}/${totalAnswered}</div><div class="label">Overall Vocabulary Score${totalAnswered>0?' — '+Math.round(totalCorrect/totalAnswered*100)+'%':''}</div></div>`;

html+=`<div class="analytics-section"><h3>Performance by Tier</h3>`;
tiers.forEach(t=>{
const data=VOCAB_DATA[t.key];
const answered=Object.keys(state[t.key].submitted).length;
const correct=Object.keys(state[t.key].submitted).filter(qi=>data[qi].options[state[t.key].answers[qi]]?.correct).length;
const pct=answered>0?Math.round(correct/answered*100):0;
html+=`<div class="stat-row">
<span class="stat-label">${t.label}</span>
<div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%;background:${t.color}"></div></div>
<span class="stat-value" style="color:${t.color}">${correct}/${answered} (${pct}%)</span>
</div>`;
});
html+=`</div>`;

html+=`<div class="analytics-section"><h3>Chapter Breakdown</h3>`;
const chapterScores={};
['prof','hesi','nclex'].forEach(tier=>{
const data=VOCAB_DATA[tier];
Object.keys(state[tier].submitted).forEach(qi=>{
const ch=data[qi].chapter;
if(!chapterScores[ch])chapterScores[ch]={correct:0,total:0};
chapterScores[ch].total++;
if(data[qi].options[state[tier].answers[qi]]?.correct)chapterScores[ch].correct++;
});
});
const chapters=Object.keys(chapterScores).sort();
if(chapters.length===0){
html+=`<div class="stat-row"><span class="stat-label" style="color:#64748b">Complete some questions to see chapter analytics</span></div>`;
}else{
chapters.forEach(ch=>{
const s=chapterScores[ch];
const pct=Math.round(s.correct/s.total*100);
const color=pct>=80?'#22c55e':pct>=60?'#f59e0b':'#ef4444';
html+=`<div class="stat-row">
<span class="stat-label">${ch}</span>
<div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%;background:${color}"></div></div>
<span class="stat-value" style="color:${color}">${s.correct}/${s.total} (${pct}%)</span>
</div>`;
});
}
html+=`</div>`;

html+=`<div class="analytics-section"><h3>Missed Terms — Review These</h3>`;
let missedAny=false;
['prof','hesi','nclex'].forEach(tier=>{
const data=VOCAB_DATA[tier];
Object.keys(state[tier].submitted).forEach(qi=>{
if(!data[qi].options[state[tier].answers[qi]]?.correct){
missedAny=true;
html+=`<div class="stat-row">
<span class="stat-label">❌ <strong>${data[qi].term}</strong> <span class="chapter-tag">${data[qi].chapter}</span></span>
<span class="stat-value" style="color:#94a3b8">Review in ${tier.toUpperCase()} tier</span>
</div>`;
}
});
});
if(!missedAny){
html+=`<div class="stat-row"><span class="stat-label" style="color:#22c55e">No missed terms yet — keep going!</span></div>`;
}
html+=`</div>`;

html+=`<button class="retake-btn" onclick="retakeAll()">🔄 Reset All Tiers</button>`;
panel.innerHTML=html;
}

function retakeAll(){
state={prof:{answers:{},submitted:{}},hesi:{answers:{},submitted:{}},nclex:{answers:{},submitted:{}}};
saveState();
['prof','hesi','nclex'].forEach(t=>renderTier(t));
renderAnalytics();
}

loadState();
renderTier('prof');
renderTier('hesi');
renderTier('nclex');
</script>
</body>
</html>
