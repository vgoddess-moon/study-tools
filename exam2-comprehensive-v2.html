</div>
<div class="exam-info">This exam matches your professor's format: ~5 questions from EACH chapter (10-15), 30 total.</div>
<div class="last-attempt" id="lastAttempt">

<script>
const EXAM_ID='ms1-exam2-comprehensive-v2';
const EXAM_LABEL='MS1 Exam 2 — Comprehensive v2 (30Q)';
const questions=[
// ===== CHAPTER 10: Environmental Emergencies =====
{id:1,chapter:10,difficulty:'easy',type:'single',stem:'A construction worker is brought to the ED after collapsing on a 105°F day. His skin is hot, dry, and flushed. Rectal temperature is 106.2°F. Which intervention takes PRIORITY?',options:[
{letter:'A',text:'Administer oral rehydration fluids',correct:false,rationale:'Oral fluids are inappropriate in heat stroke because the patient may have altered consciousness and is at risk for aspiration. IV fluids are preferred.'},
{letter:'B',text:'Apply ice packs to the groin, axillae, and neck',correct:true,rationale:'Rapid cooling is the PRIORITY in heat stroke. Ice packs to areas with large blood vessels (groin, axillae, neck) rapidly lower core temperature.'},
{letter:'C',text:'Obtain a 12-lead ECG',correct:false,rationale:'While cardiac monitoring is important, it does not take priority over immediate cooling in heat stroke where every minute of hyperthermia causes organ damage.'},
{letter:'D',text:'Administer antipyretics (acetaminophen)',correct:false,rationale:'Antipyretics work on the hypothalamic set point and are INEFFECTIVE in heat stroke because the problem is environmental heat overload, not infection.'}
],vocabTip:'Heat stroke is like your body\'s AC breaking on the hottest day ever. Your internal temp shoots WAY up (over 104°F) and your brain starts malfunctioning. The #1 thing to do is COOL THEM DOWN fast — ice packs on spots where big blood vessels are close to the skin.',trap:false},

{id:2,chapter:10,difficulty:'easy',type:'single',stem:'A hiker presents with white, waxy skin on her toes that is hard and numb. She reports she was lost in below-freezing temperatures overnight. The nurse identifies this as which stage of frostbite?',options:[
{letter:'A',text:'Frostnip (superficial, reversible)',correct:false,rationale:'Frostnip causes redness, tingling, and numbness but the skin remains soft and pliable. It does not become white and waxy.'},
{letter:'B',text:'Superficial frostbite',correct:false,rationale:'Superficial frostbite affects the epidermis and part of the dermis. Skin is white and waxy but still has some give/pliability when pressed.'},
{letter:'C',text:'Deep frostbite',correct:true,rationale:'Deep frostbite presents with white/waxy skin that is HARD and numb. The tissue is frozen through to muscles and bones. The "hard" quality distinguishes it from superficial frostbite.'},
{letter:'D',text:'Trench foot',correct:false,rationale:'Trench foot (immersion foot) results from prolonged exposure to wet, cold conditions (not freezing). Presents with tingling, swelling, and pale/mottled skin.'}
],vocabTip:'Think of frostbite in layers like freezing a chicken: Frostnip = the outside got a little frosty but is still soft. Superficial = the top layers froze (white and waxy but still squishy). Deep = frozen solid like a rock all the way through.',trap:false},

{id:3,chapter:10,difficulty:'medium',type:'sata',stem:'A patient is admitted after a rattlesnake bite to the right forearm 45 minutes ago. Which nursing interventions are appropriate? (Select all that apply.)',options:[
{letter:'A',text:'Remove jewelry and constrictive clothing from the affected extremity',correct:true,rationale:'Swelling progresses rapidly after a pit viper bite. Removing constrictive items prevents compartment syndrome and vascular compromise.'},
{letter:'B',text:'Apply a tourniquet proximal to the bite',correct:false,rationale:'Tourniquets concentrate venom in one area, increasing local tissue damage. They are NOT recommended for snakebites.'},
{letter:'C',text:'Mark the leading edge of swelling with time noted',correct:true,rationale:'Marking and timing the leading edge of edema helps track the progression of envenomation and guides antivenom dosing decisions.'},
{letter:'D',text:'Apply ice directly to the bite site',correct:false,rationale:'Ice causes vasoconstriction which concentrates venom locally and can worsen tissue necrosis. It is contraindicated.'},
{letter:'E',text:'Immobilize the extremity and keep it at or below heart level',correct:true,rationale:'Immobilization slows lymphatic spread of venom. Keeping at/below heart level prevents rapid systemic absorption while not concentrating venom.'}
],vocabTip:'For snakebites, think "DON\'T squeeze, freeze, or tourniquet." Instead: take off rings/watches (swelling is coming), draw a line around the swelling with the time, keep the arm still and low. The antivenom is the real treatment.',trap:false},

{id:4,chapter:10,difficulty:'medium',type:'single',stem:'A mountain climber at 12,000 feet reports a severe headache, confusion, and ataxia (stumbling gait) that developed over 6 hours. The nurse suspects:',options:[
{letter:'A',text:'Acute mountain sickness (AMS)',correct:false,rationale:'AMS presents with headache, nausea, fatigue, and dizziness but does NOT include ataxia or confusion. Those neurological signs indicate progression to HACE.'},
{letter:'B',text:'High-altitude cerebral edema (HACE)',correct:true,rationale:'HACE presents with AMS symptoms PLUS ataxia and altered mental status (confusion). Ataxia is the hallmark sign that distinguishes HACE from AMS.'},
{letter:'C',text:'High-altitude pulmonary edema (HAPE)',correct:false,rationale:'HAPE presents with dyspnea at rest, cough (possibly productive with pink/frothy sputum), and crackles. It is a pulmonary, not neurological, condition.'},
{letter:'D',text:'Decompression sickness',correct:false,rationale:'Decompression sickness (the bends) occurs in divers ascending too quickly, not in mountain climbers. It involves joint pain and neurological symptoms from nitrogen bubbles.'}
],vocabTip:'At high altitude, your brain or lungs can swell from lack of oxygen. HACE = brain swelling (headache + confusion + can\'t walk straight). HAPE = lung swelling (can\'t breathe + coughing pink foam). The stumbling/confusion combo = HACE.',trap:false},

{id:5,chapter:10,difficulty:'hard',type:'sata',stem:'A near-drowning victim is pulled from a cold lake. Water temperature was approximately 40°F and submersion time is estimated at 8 minutes. Which statements by the nurse demonstrate correct understanding of cold-water drowning? (Select all that apply.)',options:[
{letter:'A',text:'"We should not begin rewarming until the patient reaches the hospital."',correct:false,rationale:'Passive rewarming (removing wet clothes, warm blankets) should begin immediately in the field. Active rewarming strategies can begin in the ED.'},
{letter:'B',text:'"The diving reflex may have provided some neuroprotection during submersion."',correct:true,rationale:'The mammalian diving reflex (triggered by cold water on the face) causes bradycardia and shunts blood to vital organs, potentially providing neuroprotection.'},
{letter:'C',text:'"We should continue resuscitation efforts until the patient is rewarmed."',correct:true,rationale:'The principle "no one is dead until they are warm and dead" applies. Hypothermia provides neuroprotection and patients have survived after prolonged submersion in cold water.'},
{letter:'D',text:'"Cold water drowning has a worse prognosis than warm water drowning."',correct:false,rationale:'Cold water submersion actually has a BETTER prognosis than warm water because hypothermia slows metabolism and reduces oxygen demand, protecting the brain.'},
{letter:'E',text:'"Core temperature must be at least 86°F (30°C) before declaring death."',correct:true,rationale:'Resuscitation guidelines state patients should be rewarmed to at least 86-89.6°F (30-32°C) before terminating efforts, as hypothermia mimics death.'}
],vocabTip:'Cold water drowning is weird because cold = protective here. Cold water slows everything down (like putting your brain in a freezer — it needs less oxygen). The rule is: "You\'re not dead until you\'re WARM and dead." Keep doing CPR until they\'re warmed up.',trap:false},

// ===== CHAPTER 11: Burns =====
{id:6,chapter:11,difficulty:'easy',type:'single',stem:'Two drowning victims are brought to the ED after aspiration incidents at the beach. Patient A aspirated fresh water from a lake; Patient B aspirated salt water from the ocean. How does fresh water aspiration affect the lungs differently from salt water aspiration?',options:[
{letter:'A',text:'Fresh water causes pulmonary edema by pulling fluid into alveoli; salt water is rapidly absorbed into circulation',correct:false,rationale:'This is reversed. It is SALT water (hypertonic) that pulls fluid INTO the alveoli via osmosis. Fresh water is hypotonic and is absorbed INTO the circulation, diluting electrolytes.'},
{letter:'B',text:'Fresh water is absorbed into the bloodstream and dilutes electrolytes; salt water pulls fluid into the alveoli causing pulmonary edema',correct:true,rationale:'CORRECT. Fresh water is hypotonic — it crosses the alveolar membrane into the circulation, diluting serum electrolytes (especially sodium). Salt water is hypertonic — it draws fluid from the pulmonary capillaries into the alveoli by osmosis, causing pulmonary edema. Both mechanisms result in hypoxia but through opposite pathways.'},
{letter:'C',text:'Both fresh and salt water cause identical lung damage through the same mechanism',correct:false,rationale:'The mechanisms are different. Fresh water dilutes electrolytes by entering the bloodstream; salt water draws fluid into alveoli. Both cause hypoxia but by opposing osmotic mechanisms.'},
{letter:'D',text:'Salt water is safer because the high sodium content prevents alveolar flooding',correct:false,rationale:'TRAP. Salt water is actually MORE likely to cause rapid pulmonary edema because its hypertonic nature actively pulls fluid into the alveoli. Neither type is "safe" — both cause hypoxia through different pathways.'}
],vocabTip:'Think osmosis: fresh water (hypotonic) = less salty than blood, so it gets SUCKED into the blood vessels, diluting everything. Salt water (hypertonic) = saltier than blood, so fluid gets PULLED out of vessels INTO the alveoli. Fresh water = electrolyte problem. Salt water = pulmonary edema problem. Both = hypoxia.',trap:false},

{id:7,chapter:11,difficulty:'easy',type:'single',stem:'A patient is brought to the ED after a lightning strike at a campground. Witnesses report he was unconscious for a few minutes. On arrival, the patient is alert but has complete paralysis and numbness in both legs. The nurse reassesses 45 minutes later and the patient reports tingling returning to both feet and is able to flex both ankles. What is the most likely explanation for this presentation?',options:[
{letter:'A',text:'The patient has an incomplete spinal cord injury that is spontaneously recovering',correct:false,rationale:'While an incomplete spinal cord injury can partially recover, this rapid bilateral improvement within 45 minutes in the specific context of a lightning strike points to keraunoparalysis rather than traumatic cord injury.'},
{letter:'B',text:'Keraunoparalysis — a transient paralysis unique to lightning strike that typically resolves within hours',correct:true,rationale:'CORRECT. Keraunoparalysis is a temporary lower extremity paralysis caused by lightning. It develops immediately after the strike and typically resolves within minutes to hours. The key features: bilateral lower limb involvement, context of lightning strike, and spontaneous resolution. Do not assume permanent spinal cord injury.'},
{letter:'C',text:'The patient was not actually paralyzed — this is a psychological response to trauma',correct:false,rationale:'Keraunoparalysis is a real physiological phenomenon, not a psychological response. The mechanism involves the massive electrical discharge disrupting peripheral nerve conduction transiently. Dismissing it as psychological would delay appropriate assessment and care.'},
{letter:'D',text:'Hypovolemic shock is causing peripheral vasoconstriction and sensory loss',correct:false,rationale:'Hypovolemic shock would cause diffuse hypoperfusion with altered mental status, tachycardia, and hypotension — not isolated bilateral lower extremity paralysis and sensory loss. The clinical picture here is specific to keraunoparalysis.'}
],vocabTip:'"Kerauno" is Greek for thunderbolt — keraunoparalysis literally means thunderbolt paralysis. It is TEMPORARY. The lightning disrupts peripheral nerve function briefly, like a circuit breaker tripping. Clue on the exam: bilateral lower extremity paralysis + lightning strike + improves on its own = keraunoparalysis. Do not treat as permanent spinal cord injury.',trap:false},

{id:8,chapter:11,difficulty:'medium',type:'single',stem:'During the emergent (resuscitative) phase of burn care, the nurse notes the patient\'s urine output has been 15 mL/hr for the past 2 hours. The appropriate nursing action is to:',options:[
{letter:'A',text:'Document the finding and continue monitoring',correct:false,rationale:'Urine output of 15 mL/hr is BELOW the acceptable minimum (30-50 mL/hr for adults). This indicates inadequate fluid resuscitation and requires intervention.'},
{letter:'B',text:'Notify the provider and anticipate increasing the IV fluid rate',correct:true,rationale:'Urine output is the BEST indicator of adequate fluid resuscitation in burns. Target is 30-50 mL/hr (0.5-1 mL/kg/hr). Below 30 mL/hr signals hypovolemia; the IV rate needs to be increased.'},
{letter:'C',text:'Administer a bolus of 0.45% normal saline',correct:false,rationale:'Half-normal saline (hypotonic) is not used for burn resuscitation. Lactated Ringer\'s is the standard. Also, a bolus should not be given without a provider order.'},
{letter:'D',text:'Insert a second peripheral IV and begin colloid infusion',correct:false,rationale:'Colloids are generally avoided in the first 24 hours of burn resuscitation because increased capillary permeability allows proteins to leak into interstitial space, worsening edema.'}
],vocabTip:'In burns, we use pee output as our "gas gauge" for whether enough fluid is going in. Goal: 30-50 mL per hour for adults. Less than 30 = they need MORE fluid. More than 50 = they might be getting TOO MUCH (risk of edema). Adjust the IV drip accordingly.',trap:false},

{id:9,chapter:11,difficulty:'medium',type:'sata',stem:'A patient presents after being struck by lightning. Which assessment findings does the nurse anticipate? (Select all that apply.)',options:[
{letter:'A',text:'Fern-like (Lichtenberg) skin markings',correct:true,rationale:'Lichtenberg figures are pathognomonic (unique to) lightning strikes. They appear as fern-like or feathery red marks on the skin from electrical discharge through superficial blood vessels.'},
{letter:'B',text:'Cardiac dysrhythmias',correct:true,rationale:'Lightning acts as a massive DC countershock that can cause asystole, ventricular fibrillation, or other dysrhythmias. Cardiac monitoring is essential.'},
{letter:'C',text:'Deep, full-thickness burns along current pathway',correct:false,rationale:'Lightning typically causes SUPERFICIAL burns, not deep ones. Unlike industrial electrical injuries, lightning has a very short duration of contact (milliseconds), producing flash burns.'},
{letter:'D',text:'Tympanic membrane rupture',correct:true,rationale:'The massive pressure wave (thunder/blast effect) from lightning frequently ruptures the tympanic membrane. Up to 50% of lightning strike survivors have hearing damage.'},
{letter:'E',text:'Fixed, dilated pupils that do NOT indicate brain death',correct:true,rationale:'Lightning can cause temporary autonomic dysfunction leading to fixed, dilated pupils WITHOUT brain death. This is unique to lightning — do not use pupil response to determine prognosis.'}
],vocabTip:'Lightning strikes are WEIRD because they\'re super fast (milliseconds), so burns are usually shallow, not deep. But the electricity scrambles your heart rhythm and the thunder-boom can burst your eardrums. Also, the eyes can look "dead" (big pupils) but that\'s temporary — keep treating them!',trap:false},

{id:10,chapter:11,difficulty:'hard',type:'single',stem:'A construction worker is brought to the ED after working outdoors in extreme heat. His coworkers say he suddenly became confused and stopped sweating. His core temperature is 106.2°F (41.2°C). He is disoriented and unable to follow commands. Which cooling intervention is the PRIORITY?',options:[
{letter:'A',text:'Administer acetaminophen 650 mg PO to reduce the fever',correct:false,rationale:'TRAP. Acetaminophen works by blocking prostaglandins that cause true fever. Heat stroke is NOT a fever — the hypothalamus has lost the ability to regulate temperature entirely, not because of a pyrogen. Antipyretics are completely ineffective and should not be given.'},
{letter:'B',text:'Place ice packs in the axilla and groin only',correct:false,rationale:'Axillary and groin ice packs are helpful adjuncts but are insufficient as the primary cooling method for a temperature of 106°F. They do not provide the surface area coverage needed for rapid core temperature reduction.'},
{letter:'C',text:'Ice-water immersion — immerse the patient up to the neck in ice water',correct:true,rationale:'CORRECT. Ice-water immersion is the fastest and most effective cooling method for heat stroke, capable of reducing core temperature by approximately 0.2°C per minute. Rapid cooling is the #1 determinant of survival and neurological outcome. This is the priority intervention.'},
{letter:'D',text:'Apply cooling blankets and direct fans at the patient for evaporative cooling',correct:false,rationale:'Cooling blankets and fans are too slow for confirmed heat stroke at 106°F. Evaporative cooling is less effective, particularly in high-humidity environments, and cannot match the rate of temperature reduction achieved by ice-water immersion.'}
],vocabTip:'Heat stroke = the body\'s thermostat (hypothalamus) is completely broken — not just miscalibrated like in a fever. Antipyretics fix a miscalibrated thermostat (block prostaglandins) but CANNOT fix a broken one. The only fix is rapid external cooling. Ice-water immersion is the fastest method. Mantra: "Cool first, transport second." Temperature must come down below 102°F ASAP.',trap:true},

// ===== CHAPTER 12: Trauma =====
{id:11,chapter:12,difficulty:'easy',type:'single',stem:'During the primary survey of a trauma patient, the nurse assesses the patient in which correct sequence?',options:[
{letter:'A',text:'Breathing, Airway, Circulation, Disability, Exposure',correct:false,rationale:'This reverses A and B. Airway ALWAYS comes first because if the airway is blocked, breathing assessment is pointless.'},
{letter:'B',text:'Airway, Breathing, Circulation, Disability, Exposure',correct:true,rationale:'ABCDE is the correct sequence: Airway (with c-spine protection), Breathing, Circulation, Disability (neurological), Exposure (undress/environment). Life threats are addressed in order of what kills fastest.'},
{letter:'C',text:'Airway, Circulation, Breathing, Disability, Exposure',correct:false,rationale:'Circulation comes AFTER breathing. The logic: if you can\'t breathe, circulation of deoxygenated blood is futile.'},
{letter:'D',text:'Circulation, Airway, Breathing, Disability, Exposure',correct:false,rationale:'This is incorrect. Even in massive hemorrhage, a blocked airway kills faster. Airway is always first in the primary survey.'}
],vocabTip:'ABCDE is the "order of what kills you fastest." A blocked Airway kills in seconds. No Breathing kills in minutes. No Circulation (bleeding out) kills in minutes-hours. Disability (brain) and Exposure (hypothermia) kill later. Fix the fastest killer first!',trap:false},

{id:12,chapter:12,difficulty:'easy',type:'single',stem:'A trauma patient has an estimated blood loss of 1,800 mL. Heart rate is 128 bpm, blood pressure is 90/60 mmHg, and the patient is anxious and confused. This presentation is consistent with which class of hemorrhage?',options:[
{letter:'A',text:'Class I (up to 750 mL)',correct:false,rationale:'Class I hemorrhage shows minimal signs: HR slightly elevated, normal BP, normal mental status. Blood loss is <15% of total volume.'},
{letter:'B',text:'Class II (750-1500 mL)',correct:false,rationale:'Class II shows tachycardia and narrowed pulse pressure but BP is generally maintained and mental status is anxious (not confused).'},
{letter:'C',text:'Class III (1500-2000 mL)',correct:true,rationale:'Class III hemorrhage (30-40% volume loss): tachycardia >120, hypotension (systolic drops), confused/anxious. Blood loss 1500-2000 mL. Requires blood transfusion.'},
{letter:'D',text:'Class IV (>2000 mL)',correct:false,rationale:'Class IV is >40% loss (>2000 mL): HR >140, profound hypotension (systolic <70), lethargic/obtunded. This patient is confused but not lethargic.'}
],vocabTip:'Hemorrhage classes are like a gas tank emptying: Class I = lost a little (you feel fine). Class II = getting low (heart speeds up, you\'re anxious). Class III = almost empty (heart is RACING, BP drops, brain gets confused). Class IV = running on fumes (barely conscious, could die).',trap:false},

{id:13,chapter:12,difficulty:'medium',type:'sata',stem:'A mass casualty incident (MCI) has occurred. The triage nurse is using the START triage system. Which patients would be tagged BLACK (expectant/deceased)? (Select all that apply.)',options:[
{letter:'A',text:'Patient with respiratory rate of 8 after repositioning the airway',correct:false,rationale:'If the patient IS breathing (even slowly) after airway repositioning, they are tagged RED (immediate), not black. Any spontaneous breathing = alive and treatable.'},
{letter:'B',text:'Patient who is not breathing even after opening the airway',correct:true,rationale:'In START triage, if a patient is NOT breathing after one attempt to open the airway, they are tagged BLACK (expectant/dead). Resources go to salvageable patients.'},
{letter:'C',text:'Patient with burns over 90% TBSA and no spontaneous breathing',correct:true,rationale:'Not breathing after airway opening = BLACK. Additionally, in MCI triage, massive burns with no airway would be expectant even if resources were available.'},
{letter:'D',text:'Patient with a femur fracture who can follow commands',correct:false,rationale:'This patient is tagged YELLOW (delayed). They have a serious injury but are stable, following commands, and can wait for treatment.'},
{letter:'E',text:'Patient with a respiratory rate of 32 and no radial pulse',correct:false,rationale:'This patient IS breathing, so they move to the circulation check. No radial pulse = RED (immediate). They are treatable and salvageable, not expectant.'}
],vocabTip:'MCI triage is harsh but necessary. BLACK tag = dead or will die no matter what (no breathing after you open their airway = black tag immediately). RED = dying but SAVEABLE if treated NOW. YELLOW = hurt but can wait. GREEN = walking wounded ("minor"). In MCI, you skip people you can\'t save to save more lives.',trap:true},

{id:14,chapter:12,difficulty:'medium',type:'single',stem:'A patient in hemorrhagic shock demonstrates a narrowing pulse pressure, cool extremities, and tachycardia but is still alert. The nurse recognizes this as which stage of shock?',options:[
{letter:'A',text:'Initial (early) stage',correct:false,rationale:'The initial stage has minimal clinical signs — compensatory mechanisms are just beginning. Vital sign changes are not yet detectable at the bedside.'},
{letter:'B',text:'Compensatory stage',correct:true,rationale:'Compensatory shock: the body activates SNS response (tachycardia, vasoconstriction causing cool extremities and narrowed pulse pressure) to maintain perfusion. Patient is still alert because brain is still perfused.'},
{letter:'C',text:'Progressive stage',correct:false,rationale:'Progressive shock shows failing compensation: hypotension, altered mental status, oliguria, metabolic acidosis. The patient would NOT be fully alert.'},
{letter:'D',text:'Refractory (irreversible) stage',correct:false,rationale:'Refractory shock is end-stage: multi-organ failure, unresponsive to treatment, death is imminent. Completely inconsistent with an alert patient.'}
],vocabTip:'Shock stages are like a car running out of gas: Initial = gas light just came on (you can\'t tell yet). Compensatory = car is working HARDER to keep going (engine revving = tachycardia, but still driving = still alert). Progressive = engine sputtering (things are failing). Refractory = engine died (game over).',trap:false},

{id:15,chapter:12,difficulty:'hard',type:'sata',stem:'A nurse is applying a commercial tourniquet to a patient with uncontrollable arterial bleeding from the left thigh after a motorcycle accident. Which actions are correct? (Select all that apply.)',options:[
{letter:'A',text:'Place the tourniquet 2-3 inches proximal to the wound',correct:true,rationale:'The tourniquet should be placed 2-3 inches (5-7 cm) above the wound (between the wound and the heart) to occlude arterial flow proximal to the injury.'},
{letter:'B',text:'Write the time of application on the tourniquet or patient\'s forehead',correct:true,rationale:'Time of application MUST be documented (written on tourniquet, forehead, or taped note). This guides surgical decisions about limb viability (ischemia time).'},
{letter:'C',text:'Loosen the tourniquet every 15-20 minutes to allow some perfusion',correct:false,rationale:'NEVER loosen a tourniquet once applied. This was old practice — current evidence shows loosening causes reperfusion injury and resumes hemorrhage. Leave it until surgical control.'},
{letter:'D',text:'Tighten until distal pulses are no longer palpable',correct:true,rationale:'The tourniquet must be tight enough to completely occlude arterial flow. Verify by checking that distal pulses are absent. If bleeding continues or pulses remain, tighten further.'},
{letter:'E',text:'Place padding under the tourniquet to protect the skin',correct:false,rationale:'While padding can be used if available, it should NOT delay application. The priority is hemorrhage control. Padding is not a required step and can waste critical time.'}
],vocabTip:'Modern tourniquet rules: Put it ABOVE the bleeding, tighten it until the bleeding STOPS and you can\'t feel a pulse below it, write down the TIME you put it on, and NEVER loosen it. The old advice about "loosen every 15 min" is WRONG — it causes more harm.',trap:false},

// ===== CHAPTER 13: Fluid & Electrolyte Balance =====
{id:16,chapter:13,difficulty:'easy',type:'single',stem:'A patient\'s lab results show a serum sodium level of 128 mEq/L. The nurse identifies this as:',options:[
{letter:'A',text:'Normal sodium level',correct:false,rationale:'Normal sodium is 136-145 mEq/L. 128 is well below the normal range.'},
{letter:'B',text:'Hyponatremia',correct:true,rationale:'Hyponatremia is serum sodium <136 mEq/L. At 128, this patient has significant hyponatremia which requires assessment for fluid status and underlying cause.'},
{letter:'C',text:'Hypernatremia',correct:false,rationale:'Hypernatremia is sodium >145 mEq/L. 128 is below normal, not above.'},
{letter:'D',text:'Hyperkalemia',correct:false,rationale:'Hyperkalemia refers to elevated potassium (K+), not sodium (Na+). These are different electrolytes.'}
],vocabTip:'Sodium (Na+) normal = 136-145. HYPO means LOW (below 136) — think "hypo = hippo sinking low." HYPER means HIGH (above 145) — think "hyper kid bouncing high." Low sodium makes your brain swell (confusion, seizures). High sodium dries cells out (thirsty, dry, agitated).',trap:false},

{id:17,chapter:13,difficulty:'easy',type:'single',stem:'The provider orders 0.9% Normal Saline for a patient with fluid volume deficit. The nurse understands this solution is classified as:',options:[
{letter:'A',text:'Hypotonic — will move water into cells',correct:false,rationale:'0.9% NS is NOT hypotonic. Hypotonic solutions (like 0.45% NS) have lower osmolarity than blood and cause water to shift into cells.'},
{letter:'B',text:'Isotonic — will expand intravascular volume',correct:true,rationale:'0.9% NS is isotonic (same osmolarity as blood ~308 mOsm/L). It stays primarily in the intravascular space, making it ideal for volume replacement in FVD.'},
{letter:'C',text:'Hypertonic — will pull water from cells',correct:false,rationale:'Hypertonic solutions (like 3% NS) have higher osmolarity than blood and pull water out of cells. 0.9% NS is not hypertonic.'},
{letter:'D',text:'Colloid — will increase oncotic pressure',correct:false,rationale:'Colloids contain proteins/large molecules (albumin, dextran). 0.9% NS is a crystalloid solution containing only water and sodium chloride.'}
],vocabTip:'Isotonic (like 0.9% NS) = same saltiness as your blood. It stays IN the pipes (blood vessels) to fill them up. Hypotonic (like 0.45% NS) = less salty — water leaves the pipes and goes INTO cells. Hypertonic (like 3% NS) = extra salty — pulls water OUT of cells and into the pipes.',trap:false},

{id:18,chapter:13,difficulty:'medium',type:'sata',stem:'A patient diagnosed with SIADH (Syndrome of Inappropriate Antidiuretic Hormone) is admitted. Which findings does the nurse expect? (Select all that apply.)',options:[
{letter:'A',text:'Serum sodium 124 mEq/L',correct:true,rationale:'SIADH causes water retention (dilutional hyponatremia). Excess ADH = excess water reabsorption = diluted sodium levels.'},
{letter:'B',text:'Concentrated urine (high specific gravity)',correct:true,rationale:'Too much ADH means the kidneys are concentrating urine maximally — holding onto water. Urine will be dark and have high specific gravity.'},
{letter:'C',text:'Excessive thirst and dry mucous membranes',correct:false,rationale:'These are signs of DEHYDRATION/fluid deficit. SIADH causes fluid EXCESS (water retention). Patient would NOT be thirsty — they have too much water.'},
{letter:'D',text:'Decreased urine output',correct:true,rationale:'ADH tells kidneys to RETAIN water, producing less (but more concentrated) urine. Decreased output is expected.'},
{letter:'E',text:'Weight gain without peripheral edema',correct:true,rationale:'SIADH causes water retention (weight gain) but the excess water distributes intracellularly and in the vascular space — NOT typically in peripheral tissues (no pitting edema).'}
],vocabTip:'SIADH = your body makes TOO MUCH of the "hold onto water" hormone. Result: you retain tons of water, your sodium gets diluted (low Na+), you pee less but it\'s super concentrated, and you gain water weight. Opposite = Diabetes Insipidus (DI) where you pee out ALL your water.',trap:false},

{id:19,chapter:13,difficulty:'medium',type:'single',stem:'A patient\'s lab work shows potassium of 6.2 mEq/L. The nurse would FIRST:',options:[
{letter:'A',text:'Administer oral kayexalate (sodium polystyrene sulfonate)',correct:false,rationale:'Kayexalate removes potassium from the body but takes hours to work. With K+ at 6.2 (dangerously high), the immediate concern is cardiac arrest — assess the heart first.'},
{letter:'B',text:'Obtain a stat 12-lead ECG',correct:true,rationale:'Hyperkalemia >6.0 mEq/L is a cardiac emergency. Peaked T waves, widened QRS, and sine waves can precede fatal arrhythmias. ECG assessment is the FIRST priority to determine cardiac risk.'},
{letter:'C',text:'Encourage high-potassium foods to improve absorption',correct:false,rationale:'This is DANGEROUS. The potassium is already critically HIGH (normal 3.5-5.0). Adding more potassium could cause cardiac arrest.'},
{letter:'D',text:'Prepare IV calcium gluconate for immediate administration',correct:false,rationale:'Calcium gluconate is appropriate treatment (stabilizes cardiac membrane) but the nurse must FIRST assess the cardiac status with ECG before administering. Assessment before intervention.'}
],vocabTip:'Potassium (K+) is the "heart stopper" electrolyte. Normal = 3.5-5.0. Above 6.0 = EMERGENCY because it can make your heart go into a fatal rhythm. First thing: check the ECG (heart tracing) to see if the heart is being affected. Look for tall, pointy "peaked T waves" — that\'s the danger sign.',trap:true},

{id:20,chapter:13,difficulty:'hard',type:'sata',stem:'A patient with Diabetes Insipidus (DI) is admitted. Which assessment findings support this diagnosis? (Select all that apply.)',options:[
{letter:'A',text:'Urine output of 350-500 mL/hr',correct:true,rationale:'DI causes massive water loss through dilute urine. Output can reach 5-20 L/day (200-800 mL/hr). The kidneys cannot concentrate urine without ADH.'},
{letter:'B',text:'Serum sodium 152 mEq/L',correct:true,rationale:'As the body loses pure water (not sodium), the remaining sodium becomes concentrated. Hypernatremia is a hallmark of DI.'},
{letter:'C',text:'Urine specific gravity 1.001',correct:true,rationale:'Without ADH, kidneys cannot concentrate urine. Very dilute urine = very low specific gravity (normal 1.005-1.030). This is essentially water being excreted.'},
{letter:'D',text:'Weight gain of 3 kg over 24 hours',correct:false,rationale:'DI causes massive WATER LOSS, so patients would show weight LOSS, not gain. Weight gain suggests fluid retention (SIADH is the opposite problem).'},
{letter:'E',text:'Intense thirst (polydipsia)',correct:true,rationale:'Massive water loss triggers extreme thirst as the body tries to compensate. Patients may drink 4-20 L/day. If they cannot access water, severe dehydration occurs rapidly.'}
],vocabTip:'DI = Diabetes Insipidus = "tasteless diabetes" (the pee is dilute/tasteless unlike sugar diabetes). Your brain stops making ADH (the "hold onto water" hormone) so your kidneys dump ALL the water. You pee LITERS, get super thirsty, sodium goes up (concentrated), and you lose weight fast. Basically the opposite of SIADH.',trap:false},

// ===== CHAPTER 14: Acid-Base Balance =====
{id:21,chapter:14,difficulty:'easy',type:'single',stem:'A patient\'s ABG results show: pH 7.28, PaCO2 55 mmHg, HCO3- 24 mEq/L. The nurse interprets this as:',options:[
{letter:'A',text:'Respiratory alkalosis, uncompensated',correct:false,rationale:'Respiratory alkalosis would show HIGH pH (>7.45) and LOW PaCO2 (<35). This patient has low pH and high CO2.'},
{letter:'B',text:'Metabolic acidosis, partially compensated',correct:false,rationale:'Metabolic acidosis would show low HCO3- (<22) as the PRIMARY cause. This patient\'s HCO3- is normal (22-26), and CO2 is elevated.'},
{letter:'C',text:'Respiratory acidosis, uncompensated',correct:true,rationale:'pH is low (acidosis). PaCO2 is high (respiratory cause — lungs retaining CO2). HCO3- is normal (kidneys have NOT compensated yet). Uncompensated respiratory acidosis.'},
{letter:'D',text:'Metabolic alkalosis, fully compensated',correct:false,rationale:'Metabolic alkalosis would have high HCO3- (>26) and high pH. This patient has acidosis (low pH), not alkalosis.'}
],vocabTip:'Use ROME: Respiratory = Opposite (when pH goes down, CO2 goes UP). Metabolic = Equal (when pH goes down, HCO3 goes DOWN too). This patient: pH DOWN + CO2 UP = respiratory acidosis. HCO3 is normal = kidneys haven\'t tried to fix it yet = uncompensated.',trap:false},

{id:22,chapter:14,difficulty:'easy',type:'single',stem:'A patient with uncontrolled type 1 diabetes presents with Kussmaul respirations (deep, rapid breathing). The nurse understands this respiratory pattern represents:',options:[
{letter:'A',text:'The cause of the patient\'s metabolic acidosis',correct:false,rationale:'Kussmaul respirations are not the CAUSE — DKA (ketoacid accumulation) causes the metabolic acidosis. The breathing is a compensatory response.'},
{letter:'B',text:'Respiratory compensation for metabolic acidosis',correct:true,rationale:'In DKA, ketoacids accumulate causing metabolic acidosis. The lungs compensate by blowing off CO2 (an acid) through deep, rapid breathing (Kussmaul respirations) to raise pH.'},
{letter:'C',text:'A sign of impending respiratory failure',correct:false,rationale:'Kussmaul breathing is a COMPENSATORY mechanism, not failure. It shows the respiratory system is working hard to correct acidosis. Failure would show slow, shallow breathing.'},
{letter:'D',text:'Respiratory acidosis from diabetic neuropathy',correct:false,rationale:'This is respiratory COMPENSATION (alkalosis response), not acidosis. The patient is breathing MORE to blow off CO2, not less.'}
],vocabTip:'DKA makes your blood super acidic (from ketones). Your lungs try to help by breathing FAST and DEEP to blow off CO2 (which is also an acid). It\'s like opening all the windows when the house is smoky — the lungs are trying to "ventilate" the acid out. This deep/fast pattern = Kussmaul breathing.',trap:false},

{id:23,chapter:14,difficulty:'medium',type:'single',stem:'ABG results: pH 7.48, PaCO2 30 mmHg, HCO3- 22 mEq/L. A nursing student asks what condition causes this. The nurse\'s BEST response is:',options:[
{letter:'A',text:'"This is caused by hyperventilation — the patient is blowing off too much CO2."',correct:true,rationale:'pH is HIGH (alkalosis). PaCO2 is LOW (respiratory cause — too much CO2 blown off). HCO3- is normal (no metabolic compensation). Uncompensated respiratory alkalosis, caused by hyperventilation.'},
{letter:'B',text:'"This is caused by excessive vomiting losing stomach acid."',correct:false,rationale:'Vomiting causes metabolic alkalosis (high HCO3-). This patient\'s HCO3 is normal — the cause is respiratory (low CO2).'},
{letter:'C',text:'"This is caused by chronic kidney disease retaining bicarbonate."',correct:false,rationale:'Renal bicarbonate retention would show elevated HCO3- (metabolic alkalosis). This patient\'s HCO3 is normal.'},
{letter:'D',text:'"This is caused by hypoventilation from opioid overdose."',correct:false,rationale:'Hypoventilation RETAINS CO2, causing respiratory ACIDOSIS (low pH, high CO2). This patient has the opposite — low CO2 and high pH.'}
],vocabTip:'Respiratory alkalosis = breathing TOO FAST/DEEP and blowing off too much CO2. CO2 is an acid, so losing it makes blood more alkaline (pH goes UP). Common causes: panic attacks, anxiety, pain, being on a ventilator set too high. Fix: slow the breathing down or rebreathe into a bag.',trap:false},

{id:24,chapter:14,difficulty:'medium',type:'sata',stem:'ABG results show: pH 7.32, PaCO2 40 mmHg, HCO3- 17 mEq/L. Which conditions could cause these findings? (Select all that apply.)',options:[
{letter:'A',text:'Diabetic ketoacidosis',correct:true,rationale:'DKA produces ketoacids that consume bicarbonate (HCO3- drops). pH drops from metabolic acid accumulation. CO2 is normal here suggesting early/uncompensated metabolic acidosis.'},
{letter:'B',text:'Severe diarrhea',correct:true,rationale:'Diarrhea causes direct loss of bicarbonate (HCO3-) from the GI tract, leading to metabolic acidosis with low bicarb. This matches the ABG pattern.'},
{letter:'C',text:'Persistent vomiting',correct:false,rationale:'Vomiting loses HCl (stomach acid), leading to metabolic ALKALOSIS (high pH, high HCO3-). This is the opposite of what the ABG shows.'},
{letter:'D',text:'Chronic kidney disease',correct:true,rationale:'Failing kidneys cannot excrete hydrogen ions or regenerate bicarbonate. Acid accumulates and HCO3- drops, causing metabolic acidosis.'},
{letter:'E',text:'Anxiety-induced hyperventilation',correct:false,rationale:'Hyperventilation causes respiratory ALKALOSIS (high pH, low CO2). This patient has acidosis with normal CO2 — a metabolic problem.'}
],vocabTip:'This ABG: pH LOW (acidosis) + CO2 NORMAL + HCO3 LOW = metabolic acidosis (uncompensated). Using ROME: pH and HCO3 both going down = EQUAL = metabolic. Causes of metabolic acidosis: DKA (ketones), diarrhea (losing bicarb in poop), kidney failure (can\'t get rid of acid). Memory trick: "DKD" — DKA, Kidney failure, Diarrhea.',trap:false},

{id:25,chapter:14,difficulty:'hard',type:'single',stem:'A COPD patient in the ED has ABG results: pH 7.35, PaCO2 58 mmHg, HCO3- 32 mEq/L. The nurse correctly interprets these results as:',options:[
{letter:'A',text:'Respiratory acidosis, uncompensated — intervene immediately',correct:false,rationale:'If this were uncompensated, HCO3- would be normal (22-26) and pH would be much lower. The elevated HCO3- shows the kidneys HAVE compensated.'},
{letter:'B',text:'Respiratory acidosis, fully compensated — this is the patient\'s baseline',correct:true,rationale:'pH is in normal range (7.35-7.45, at the low end = acidosis tendency). CO2 is HIGH (chronic retention in COPD). HCO3- is HIGH (kidneys compensated by retaining bicarb). FULLY compensated because pH returned to normal. This is typical chronic COPD baseline.'},
{letter:'C',text:'Mixed respiratory and metabolic alkalosis',correct:false,rationale:'There is no alkalosis here. The pH is at the low end of normal (acid side). High CO2 is acidosis, not alkalosis. High bicarb is compensatory.'},
{letter:'D',text:'Metabolic alkalosis, partially compensated by hypoventilation',correct:false,rationale:'The PRIMARY problem is respiratory (chronically high CO2 from COPD). The elevated HCO3- is the compensatory response, not the primary disorder.'}
],vocabTip:'COPD patients live with high CO2 because their lungs can\'t blow it off well. Over time (days-weeks), their kidneys adapt by holding onto extra bicarbonate to balance the acid. Result: pH comes back to normal even though CO2 and HCO3 are both high. This is their "new normal." Fully compensated = pH is back in the 7.35-7.45 range.',trap:false},

// ===== CHAPTER 15: Infusion Therapy =====
{id:26,chapter:15,difficulty:'easy',type:'single',stem:'The nurse needs to infuse packed red blood cells (PRBCs). Which IV catheter gauge is MOST appropriate?',options:[
{letter:'A',text:'24 gauge',correct:false,rationale:'24 gauge is very small (used for neonates/elderly with fragile veins). It is too narrow for blood products, which could hemolyze (break apart) going through this tiny opening.'},
{letter:'B',text:'22 gauge',correct:false,rationale:'While 22 gauge CAN be used for blood in an emergency, it is not the most appropriate choice. The narrow bore increases risk of hemolysis and slows transfusion time.'},
{letter:'C',text:'18 gauge',correct:true,rationale:'18 gauge (or larger: 16, 14) is recommended for blood product administration. The larger bore prevents mechanical hemolysis of red blood cells and allows adequate flow rate.'},
{letter:'D',text:'The gauge does not matter for blood products',correct:false,rationale:'Gauge absolutely matters. Small-bore catheters damage red blood cells through mechanical shearing (hemolysis) and increase transfusion time, potentially delaying treatment.'}
],vocabTip:'IV gauge numbers are BACKWARDS: smaller number = BIGGER needle. 14G = garden hose (trauma). 18G = good for blood. 22G = regular IV meds. 24G = tiny baby veins. Blood cells are big and fragile — they need a wide road (18G+) or they get crushed going through a narrow straw.',trap:false},

{id:27,chapter:15,difficulty:'easy',type:'single',stem:'A patient with a peripheral IV in the right forearm develops redness, warmth, and a palpable cord along the vein above the insertion site. The nurse identifies this complication as:',options:[
{letter:'A',text:'Infiltration',correct:false,rationale:'Infiltration presents with swelling, pallor, coolness, and decreased/absent blood return. It occurs when fluid leaks INTO surrounding tissue, not inflammation of the vein.'},
{letter:'B',text:'Phlebitis',correct:true,rationale:'Phlebitis is inflammation of the vein presenting with redness, warmth, tenderness, and a palpable hard cord (thrombosed/inflamed vein). It develops above/along the insertion site following the vein path.'},
{letter:'C',text:'Extravasation',correct:false,rationale:'Extravasation is leakage of VESICANT medication into tissue causing necrosis. While similar to infiltration, it specifically involves caustic/damaging drugs.'},
{letter:'D',text:'Air embolism',correct:false,rationale:'Air embolism presents with sudden dyspnea, chest pain, hypotension, and altered mental status — not local vein inflammation. It is a systemic emergency.'}
],vocabTip:'IV complications: Infiltration = fluid leaks OUT of vein into tissue (puffy, cool, pale). Phlebitis = vein gets INFLAMED (red, warm, hard "cord" you can feel). Extravasation = a HARSH drug leaks out and burns the tissue. Remember: phlebitis has a red streak following the vein path like a hot wire under the skin.',trap:false},

{id:28,chapter:15,difficulty:'medium',type:'sata',stem:'A nurse is caring for a patient with a PICC (Peripherally Inserted Central Catheter) line. Which nursing interventions are appropriate? (Select all that apply.)',options:[
{letter:'A',text:'Measure arm circumference daily to monitor for swelling',correct:true,rationale:'PICC lines increase risk of deep vein thrombosis (DVT) in the arm. Daily arm circumference measurement detects early swelling that may indicate clot formation.'},
{letter:'B',text:'Use a blood pressure cuff on the arm with the PICC line to save time',correct:false,rationale:'NEVER take BP on the arm with a PICC. The cuff compression can damage the catheter, occlude it, or dislodge it. Use the opposite arm.'},
{letter:'C',text:'Flush with heparin or normal saline per facility protocol',correct:true,rationale:'PICC lines require regular flushing to maintain patency. Protocol varies — some use heparin locks, others use normal saline flushes. Follow facility policy.'},
{letter:'D',text:'Change the dressing using sterile technique when soiled or per schedule',correct:true,rationale:'PICC dressings require sterile technique (it is a central line access). Change per schedule (typically q7 days for transparent dressings) or when loose/soiled/damp.'},
{letter:'E',text:'Position the tip of the PICC in a peripheral vein for safety',correct:false,rationale:'PICC tip should be in the superior vena cava (SVC) near the heart, NOT in a peripheral vein. Peripheral tip placement increases risk of phlebitis and thrombosis.'}
],vocabTip:'A PICC is a long, thin catheter inserted in your arm vein that threads all the way to the big vein near your heart (SVC). Even though it goes IN through the arm, it\'s treated like a central line because the TIP is central. Care: sterile dressing changes, flush it regularly, measure the arm for swelling (blood clots), and NEVER use that arm for BP.',trap:false},

{id:29,chapter:15,difficulty:'medium',type:'single',stem:'During a blood transfusion, the patient develops fever (temp increase of 1.8°F), chills, and headache 30 minutes into the infusion. There is no hypotension, hemoglobinuria, or back pain. The nurse suspects:',options:[
{letter:'A',text:'Acute hemolytic transfusion reaction',correct:false,rationale:'Acute hemolytic reactions present with fever PLUS hemoglobinuria (dark/red urine), flank/back pain, hypotension, and DIC. The ABSENCE of these severe signs rules it out here.'},
{letter:'B',text:'Febrile non-hemolytic transfusion reaction (FNHTR)',correct:true,rationale:'FNHTR is the MOST COMMON transfusion reaction. It presents with fever (temp rise >1°C/1.8°F), chills, and headache WITHOUT hemolysis signs. Caused by recipient antibodies reacting to donor white blood cells.'},
{letter:'C',text:'Transfusion-related acute lung injury (TRALI)',correct:false,rationale:'TRALI presents with acute respiratory distress, bilateral pulmonary infiltrates, and hypoxemia within 6 hours. This patient has no respiratory symptoms.'},
{letter:'D',text:'Anaphylactic reaction',correct:false,rationale:'Anaphylaxis presents with urticaria, bronchospasm, angioedema, and hypotension — typically in IgA-deficient patients. This patient has no allergic or hemodynamic symptoms.'}
],vocabTip:'Blood transfusion reactions: FNHTR (most common) = just fever + chills, not dangerous. Hemolytic = the blood is being DESTROYED (fever + dark urine + back pain + BP drops — EMERGENCY). TRALI = lungs fill with fluid (can\'t breathe). Anaphylaxis = severe allergic reaction (hives, throat swelling). For ANY reaction: STOP the blood first, then figure out which type.',trap:false},

{id:30,chapter:15,difficulty:'hard',type:'sata',stem:'A nurse is admitting a patient with a newly placed triple-lumen subclavian central venous catheter. Which nursing actions are ESSENTIAL before using the line? (Select all that apply.)',options:[
{letter:'A',text:'Obtain a chest X-ray to confirm catheter tip placement',correct:true,rationale:'A chest X-ray is MANDATORY before using a newly placed central line to verify the tip is in the SVC and to rule out pneumothorax (complication of subclavian insertion). Never use before confirmation.'},
{letter:'B',text:'Assess for bilateral breath sounds',correct:true,rationale:'Subclavian insertion carries risk of pneumothorax (puncturing the lung). Absent or diminished breath sounds on the insertion side suggest pneumothorax and require immediate intervention.'},
{letter:'C',text:'Aspirate each lumen and flush with normal saline',correct:true,rationale:'Each lumen must be aspirated (check for blood return to verify patency) and flushed to ensure no air or clots before medication administration.'},
{letter:'D',text:'Begin infusing medications while awaiting X-ray results to save time',correct:false,rationale:'NEVER infuse through a central line before X-ray confirmation. If the catheter is malpositioned (in a carotid artery, pleural space, etc.), infusing medications could be fatal.'},
{letter:'E',text:'Monitor the insertion site for hematoma or air leak',correct:true,rationale:'Post-insertion assessment includes checking for hematoma (arterial puncture), subcutaneous emphysema (air leak), and bleeding. These indicate procedural complications.'}
],vocabTip:'New central line checklist: (1) X-ray FIRST to make sure the tube is in the right spot and didn\'t poke a hole in the lung. (2) Listen to both lungs — if one side is quiet, they might have a collapsed lung (pneumothorax). (3) Check each port works (aspirate + flush). (4) Look at the site for bleeding or air bubbles under skin. NEVER use it until the X-ray confirms it\'s safe!',trap:true}
];

let answered={};
let selections={};

function _seedHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function _shuffleAllOptions(){if(window.__optsShuffled)return;window.__optsShuffled=true;questions.forEach(function(q){if(!q.options||q.options.length<2)return;var a=q.options.slice();var rnd=mulberry32(_seedHash((typeof EXAM_ID!=='undefined'&&EXAM_ID?EXAM_ID:'q')+'#'+q.id));for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}var L=['A','B','C','D','E','F','G','H'];for(var k=0;k<a.length;k++){a[k].letter=L[k];}q.options=a;});}
function buildQuiz(){_shuffleAllOptions();
const area=document.getElementById('quizArea');
area.innerHTML='';
let currentChapter=0;
const chapterNames={10:'Environmental Emergencies',11:'Burns & Lightning',12:'Trauma & Shock',13:'Fluid & Electrolyte Balance',14:'Acid-Base Balance',15:'Infusion Therapy'};
questions.forEach((q,idx)=>{
if(q.chapter!==currentChapter){
currentChapter=q.chapter;
const div=document.createElement('div');
div.className='chapter-divider';
div.innerHTML=`<span>Chapter ${currentChapter}: ${chapterNames[currentChapter]}</span>`;
area.appendChild(div);
}
const card=document.createElement('div');
card.className='q-card';
card.id=`qcard-${q.id}`;
const isSata=q.type==='sata';
const trapBadge=q.trap?'<span class="badge badge-trap">TRAP</span>':'';
const sataBadge=isSata?'<span class="badge badge-sata">SATA</span>':'';
card.innerHTML=`
<div class="q-top">
<span class="q-num">Q${idx+1}</span>
<span class="badge badge-ch${q.chapter}">Ch ${q.chapter}</span>
${trapBadge}${sataBadge}
</div>
<div class="q-stem">${q.stem}${isSata?'<em>(Select all that apply)</em>':''}</div>
<div class="opts" id="opts-${q.id}">
${q.options.map(o=>`
<div class="opt" id="opt-${q.id}-${o.letter}" onclick="toggleOpt(${q.id},'${o.letter}',${isSata})">
<span class="opt-letter">${o.letter}.</span>
<div><span class="opt-text">${o.text}</span><div class="opt-rationale" id="rat-${q.id}-${o.letter}">${o.rationale}</div></div>
</div>`).join('')}
</div>
<button class="btn-submit" id="btn-${q.id}" onclick="submitQ(${q.id})">Submit Answer</button>
<div class="vocab-tip" id="tip-${q.id}"><strong>Vocab Tip:</strong> ${q.vocabTip}</div>
${q.trap?`<div class="trap-callout" id="trap-${q.id}">&#9888; TRAP QUESTION: This question tests a common misconception. Read the rationale carefully!</div>`:''}
`;
area.appendChild(card);
});
loadState();
}

function toggleOpt(qId,letter,isSata){
if(answered[qId])return;
if(!selections[qId])selections[qId]=[];
if(isSata){
const idx=selections[qId].indexOf(letter);
if(idx>-1)selections[qId].splice(idx,1);
else selections[qId].push(letter);
}else{
selections[qId]=[letter];
}
const q=questions.find(x=>x.id===qId);
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.classList.toggle('selected',selections[qId].includes(o.letter));
});
}

function submitQ(qId){
if(answered[qId])return;
if(!selections[qId]||selections[qId].length===0)return;
answered[qId]=true;
const q=questions.find(x=>x.id===qId);
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const isCorrect=correctLetters.length===selections[qId].length&&correctLetters.every(l=>selections[qId].includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.style.cursor='default';
if(o.correct)el.classList.add('correct-show');
else if(selections[qId].includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
document.getElementById(`btn-${qId}`).disabled=true;
document.getElementById(`btn-${qId}`).textContent=isCorrect?'Correct!':'Incorrect';
updateProgress();
saveState();
if(Object.keys(answered).length===questions.length)showScore();
}

function updateProgress(){
const pct=(Object.keys(answered).length/questions.length)*100;
document.getElementById('progressBar').style.width=pct+'%';
}

function showScore(){
const chapterScores={};
questions.forEach(q=>{
if(!chapterScores[q.chapter])chapterScores[q.chapter]={correct:0,total:0};
chapterScores[q.chapter].total++;
if(answered[q.id]){
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[q.id]||[];
if(correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l)))chapterScores[q.chapter].correct++;
}
});
let totalCorrect=0,totalQ=0;
Object.values(chapterScores).forEach(s=>{totalCorrect+=s.correct;totalQ+=s.total;});
const pct=Math.round((totalCorrect/totalQ)*100);
document.getElementById('finalScore').textContent=pct+'%';
document.getElementById('finalText').textContent=`${totalCorrect} of ${totalQ} correct`;
const bd=document.getElementById('chapterBreakdown');
const chapterNames={10:'Ch 10: Environ.',11:'Ch 11: Burns',12:'Ch 12: Trauma',13:'Ch 13: Fluids',14:'Ch 14: Acid-Base',15:'Ch 15: Infusion'};
const chapterColors={10:'#fb923c',11:'#7dd3fc',12:'#fca5a5',13:'#c084fc',14:'#a5b4fc',15:'#6ee7b7'};
bd.innerHTML='';
Object.keys(chapterScores).sort().forEach(ch=>{
const s=chapterScores[ch];
const box=document.createElement('div');
box.className='ch-box';
box.innerHTML=`<div class="ch-label">${chapterNames[ch]}</div><div class="ch-score" style="color:${chapterColors[ch]}">${s.correct}/${s.total}</div>`;
bd.appendChild(box);
});
document.getElementById('scoreCard').style.display='block';
document.getElementById('scoreCard').scrollIntoView({behavior:'smooth'});
const record={score:pct,correct:totalCorrect,total:totalQ,date:new Date().toLocaleDateString(),chapters:chapterScores};
localStorage.setItem(EXAM_ID+'-last',JSON.stringify(record));
localStorage.setItem(EXAM_ID+'-label',EXAM_LABEL);
const hist=JSON.parse(localStorage.getItem('examHistory')||'[]');
hist.push({examId:EXAM_ID,examLabel:EXAM_LABEL,date:new Date().toISOString(),score:pct,correct:totalCorrect,total:totalQ,topicBreakdown:chapterScores});
localStorage.setItem('examHistory',JSON.stringify(hist.slice(-20)));
}

function restartQuiz(){
answered={};
selections={};
localStorage.removeItem(EXAM_ID+'-state');
document.getElementById('scoreCard').style.display='none';
buildQuiz();
}

function saveState(){
localStorage.setItem(EXAM_ID+'-state',JSON.stringify({answered,selections}));
}

function loadState(){
const saved=localStorage.getItem(EXAM_ID+'-state');
if(saved){
const state=JSON.parse(saved);
answered=state.answered||{};
selections=state.selections||{};
Object.keys(answered).forEach(qId=>{
const q=questions.find(x=>x.id==qId);
if(!q)return;
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[qId]||[];
const isCorrect=correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
if(sel.includes(o.letter))el.classList.add('selected');
if(o.correct)el.classList.add('correct-show');
else if(sel.includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
el.style.cursor='default';
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
const btn=document.getElementById(`btn-${qId}`);
btn.disabled=true;
btn.textContent=isCorrect?'Correct!':'Incorrect';
});
updateProgress();
if(Object.keys(answered).length===questions.length)showScore();
}
const last=localStorage.getItem(EXAM_ID+'-last');
if(last){
const r=JSON.parse(last);
document.getElementById('lastAttempt').style.display='block';
document.getElementById('lastScore').textContent=r.score+'%';
document.getElementById('lastDate').textContent=r.date;
}
}

buildQuiz();
</script>
</body>
</html>
