<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Final Exam Prep v2 — MS1 Exam 2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0f14;color:#e2e8f0;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;padding:20px 16px 80px}
.wrap{max-width:640px;margin:0 auto}
h1{font-family:'DM Serif Display',serif;font-size:1.8rem;margin-bottom:4px;background:linear-gradient(135deg,#818cf8,#c084fc,#e09a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:#64748b;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.progress-bar{background:#1e293b;border-radius:99px;height:6px;margin-bottom:20px;overflow:hidden;position:sticky;top:0;z-index:10}
.progress-fill{background:linear-gradient(90deg,#f87171,#fbbf24);height:100%;border-radius:99px;transition:width .4s}
.q-card{background:#13181f;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:16px;transition:.2s}
.q-card.correct{border-color:#22c55e;background:#0d1f14}
.q-card.incorrect{border-color:#ef4444;background:#1f0d0d}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.q-num{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;letter-spacing:.1em}
.badge{font-family:'IBM Plex Mono',monospace;font-size:.55rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:8px}
.badge-hot{background:#451a03;color:#fb923c}.badge-cold{background:#0c1e3a;color:#7dd3fc}
.badge-electro{background:#1a0a2e;color:#c084fc}.badge-infusion{background:#0a2e1a;color:#6ee7b7}
.badge-trauma{background:#2a0a0a;color:#fca5a5}.badge-abg{background:#1e1b4b;color:#a5b4fc}
.badge-fluid{background:#1a1a2e;color:#93c5fd}.badge-vet{background:#2e1a0a;color:#fdba74}
.badge-trap{background:#2a1f00;color:#fbbf24}
.sata-tag{font-family:'IBM Plex Mono',monospace;font-size:.55rem;background:#312e81;color:#a5b4fc;padding:2px 7px;border-radius:6px}
.q-text{font-size:.92rem;line-height:1.6;margin-bottom:14px;color:#f1f5f9}
.diagram-box{background:#0c0f14;border:1px solid #1e293b;border-radius:12px;padding:12px;margin-bottom:14px;text-align:center;overflow-x:auto}
.diagram-box svg{max-width:100%;height:auto}
.diagram-label{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.option{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid #1e293b;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s;background:transparent}
.option:hover:not(:disabled){border-color:#334155;background:#111827}
.option.selected{border-color:#6366f1;background:#1a1f3a}
.option.correct-ans{border-color:#22c55e !important;background:#0d1f14 !important}
.option.wrong-ans{border-color:#ef4444 !important;background:#1f0d0d !important}
.option-letter{font-family:'IBM Plex Mono',monospace;font-size:.7rem;font-weight:700;color:#6366f1;min-width:18px;margin-top:1px}
.option-text{font-size:.85rem;line-height:1.5;color:#cbd5e1}
.submit-btn{width:100%;padding:12px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:4px;transition:.2s}
.submit-btn.ready{background:#6366f1;color:#fff}.submit-btn.ready:hover{background:#818cf8}
.submit-btn:disabled{background:#1e293b;color:#475569;cursor:not-allowed}
.rationale-box{margin-top:12px;padding:12px 14px;background:#0f1318;border-radius:12px;border:1px solid #1e293b}
.rationale-title{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.rationale-text{font-size:.82rem;color:#94a3b8;line-height:1.6}
.option-rationale{margin-top:6px;padding:8px 10px;border-radius:8px;font-size:.78rem;line-height:1.5}
.option-rationale.r-correct{background:#0d1f14;border-left:2px solid #22c55e;color:#86efac}
.option-rationale.r-wrong{background:#1f0d0d;border-left:2px solid #ef4444;color:#fca5a5}
.trap-call{background:#2a1f00;border:1px solid #3d2e00;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.78rem;color:#fbbf24;line-height:1.5}
.trap-icon{font-size:.9rem;margin-right:4px}
.vocab-tip{background:#1e1b4b;border:1px solid #312e81;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.78rem;color:#c4b5fd;line-height:1.5}
.vocab-tip strong{color:#e9d5ff}
.score-card{background:#13181f;border:1px solid #1e293b;border-radius:20px;padding:28px;text-align:center;margin-top:20px;display:none}
.score-big{font-family:'DM Serif Display',serif;font-size:3.5rem;margin-bottom:4px}
.score-pct{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:#64748b;margin-bottom:20px}
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.score-cell{background:#0c0f14;border-radius:12px;padding:12px}
.score-cell-label{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.score-cell-val{font-size:1.1rem;font-weight:700;color:#f1f5f9}
.weak-list{text-align:left;background:#0c0f14;border-radius:12px;padding:16px;margin-bottom:16px}
.weak-item{font-size:.82rem;color:#94a3b8;padding:5px 0;border-bottom:1px solid #1e293b;line-height:1.5}
.restart-btn{width:100%;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:8px}
.restart-btn:hover{background:#818cf8}
.sticky-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#0c0f14 30%);padding:16px 16px 20px;z-index:20}
.sticky-inner{max-width:640px;margin:0 auto}
#lastAttempt{display:none;background:#13181f;border:1px solid #1e293b;border-radius:14px;padding:14px 18px;margin-bottom:14px}
</style>
</head>

    options:[
      {l:'A', t:'Respiratory acidosis with metabolic compensation', correct:false, rationale:'The primary problem is metabolic (low HCO3 of 12, caused by ketoacids). The low CO2 is the lungs COMPENSATING, not the cause.'},
      {l:'B', t:'Metabolic acidosis with respiratory compensation', correct:true, rationale:'CORRECT. pH 7.22 = severe acidosis. HCO3 12 = LOW → metabolic cause (ROME: pH down, HCO3 down = Equal = metabolic). PaCO2 24 = LOW → lungs are blowing off CO2 to compensate (Kussmaul breathing). pH still abnormal → partial compensation.'},
      {l:'C', t:'Mixed respiratory and metabolic alkalosis', correct:false, rationale:'This is acidosis (pH 7.22), not alkalosis. Both CO2 and HCO3 are low, but only HCO3 is causing the acidosis.'},
      {l:'D', t:'Fully compensated metabolic acidosis', correct:false, rationale:'"Fully compensated" means the pH has returned to normal range (7.35-7.45). This pH is 7.22 — still severely acidotic. The compensation is partial at best.'},

    options:[
      {l:'A', t:'D (Disability) — perform a neurological assessment using GCS', correct:false, rationale:'D comes AFTER C. You cannot accurately assess neuro status in a hypoperfusing patient — the altered perfusion itself may cause confusion. Fix circulation first.'},
      {l:'B', t:'B (Breathing) — intubate immediately due to labored respirations', correct:false, rationale:'B is being addressed — the patient IS breathing. Labored breathing may improve once circulation is restored. Intubation may become necessary later, but C is the current priority.'},
      {l:'C', t:'C (Circulation) — establish two large-bore IVs and begin fluid resuscitation', correct:true, rationale:'CORRECT. A = secured, B = present. Next is C. This patient is in hemorrhagic shock (hypotension, tachycardia, cool/clammy). Establish two 14-16G IVs, infuse warm crystalloid (NS or LR), and prepare for possible blood transfusion.'},

    text:'A post-thyroidectomy patient reports numbness and tingling around the mouth and fingertips. The nurse taps the facial nerve anterior to the ear, and the facial muscles twitch. Which electrolyte imbalance does this indicate?',
    vocabTip:'Chvostek\'s sign = tap facial nerve → face twitches. Trousseau\'s sign = inflate BP cuff → hand spasms (carpopedal spasm). Both = hypocalcemia. Post-thyroidectomy → parathyroid glands may have been accidentally damaged → no PTH → calcium drops. Always monitor Ca2+ after thyroid surgery.',
    options:[

      {l:'C', t:'Hypermagnesemia — administer IV calcium as an antagonist', correct:false, rationale:'Hypermagnesemia causes neuromuscular depression (decreased reflexes, lethargy), not hyperexcitability. Facial twitching indicates nerve hyperexcitability from LOW calcium.'},

    vocabTip:'Hyperkalemia causes: kidney failure (can\'t excrete K+), tissue destruction (K+ leaks out of cells — crush injury, burns, tumor lysis), and drugs that RETAIN K+ (ACE inhibitors, K+-sparing diuretics like spironolactone, NSAIDs). Loop diuretics (Lasix) do the OPPOSITE — they waste K+.',
    options:[
      {l:'A', t:'Acute kidney injury (AKI)', correct:true, rationale:'CORRECT. Kidneys excrete 80-90% of potassium. When kidneys fail, potassium accumulates rapidly. Hyperkalemia is one of the most dangerous complications of AKI.'},
      {l:'B', t:'Crush injuries from a building collapse', correct:true, rationale:'CORRECT. Muscle cells contain large amounts of intracellular potassium. Crush injuries release this K+ into the bloodstream (rhabdomyolysis). Can cause lethal cardiac arrhythmias.'},
      {l:'C', t:'Treatment with spironolactone (Aldactone)', correct:true, rationale:'CORRECT. Spironolactone is a potassium-SPARING diuretic — it blocks aldosterone, which normally promotes K+ excretion. It retains potassium, increasing hyperkalemia risk.'},
      {l:'D', t:'Treatment with furosemide (Lasix)', correct:false, rationale:'Furosemide is a LOOP diuretic — "Loops Lose" potassium. Lasix causes HYPOkalemia, not hyperkalemia. This is a classic trap: know which diuretics waste K+ vs. spare K+.'},
      {l:'E', t:'Excessive sweating during exercise', correct:false, rationale:'Sweat contains very little potassium. Excessive sweating primarily causes sodium and fluid loss, not hyperkalemia.'},
    ]
  },
  // ============ DROWNING ============
  {
    id:22, topic:'Drowning', badge:'trauma', type:'single',
    text:'A 7-year-old child is pulled from a cold lake after submersion for approximately 8 minutes. The child is pulseless and apneic. Core temperature is 84°F (28.9°C). What is the nurse\'s priority?',
    vocabTip:'"You\'re not dead until you\'re WARM and dead." Cold-water drowning activates the mammalian diving reflex (especially in children): blood shunts to the brain and heart, metabolic rate drops dramatically. Children have survived prolonged cold-water submersion with full neurological recovery. ALWAYS resuscitate hypothermic drowning patients.',
    options:[
      {l:'A', t:'Pronounce the patient deceased — 8 minutes of submersion is non-survivable', correct:false, rationale:'NEVER pronounce death in a hypothermic patient. Cold water dramatically slows metabolism and can be neuroprotective. Children especially have survived 30+ minutes of cold-water submersion with full recovery.'},
      {l:'B', t:'Begin CPR and active rewarming simultaneously', correct:true, rationale:'CORRECT. Begin high-quality CPR immediately and initiate active rewarming. Do not stop resuscitation until the patient is rewarmed to at least 95°F (35°C) and still has no pulse. "They\'re not dead until they\'re warm and dead."'},
      {l:'C', t:'Rewarm first, then assess for pulse — cold causes inaccurate pulse assessment', correct:false, rationale:'While cold does make pulses harder to detect, you cannot delay CPR on a pulseless, apneic patient. Begin CPR while rewarming simultaneously.'},

  },

  {
    id:23, topic:'VTE Prevention', badge:'trauma', type:'sata',
    text:'A nurse is assessing risk factors for venous thromboembolism (VTE) in a hospitalized patient. Which are MODIFIABLE risk factors? Select all that apply.',
    vocabTip:'VTE = DVT + PE (a DVT that travels to the lungs). Virchow\'s Triad = 3 causes of clots: (1) Stasis (not moving), (2) Vessel injury (surgery, trauma), (3) Hypercoagulability (clotting too easily). Modifiable = things you CAN change. Non-modifiable = genetics, age, history.',
    options:[
      {l:'A', t:'Prolonged immobility (bed rest > 3 days)', correct:true, rationale:'CORRECT. Immobility causes venous stasis — blood pools in the legs and clots form. This is why we ambulate patients early, use SCDs (sequential compression devices), and give prophylactic anticoagulants.'},
      {l:'B', t:'Oral contraceptive / hormone replacement use', correct:true, rationale:'CORRECT. Estrogen-containing contraceptives increase clotting factor production, raising VTE risk 3-4x. This is a modifiable risk factor — it can be discontinued.'},

    options:[
      {l:'A', t:'Slow the infusion rate and recheck in 30 minutes', correct:false, rationale:'Phlebitis with a palpable cord is a grade 3+ on the phlebitis scale. Do not delay — the IV must be discontinued immediately to prevent progression to thrombophlebitis or infection.'},

    options:[
      {l:'A', t:'Dementia — likely undiagnosed prior to hospitalization', correct:false, rationale:'Dementia has a GRADUAL onset over months to years. This patient was oriented and calm this morning. Acute-onset confusion post-surgery = delirium, not new-onset dementia.'},
      {l:'B', t:'Delirium — acute onset, likely related to surgery, anesthesia, or medications', correct:true, rationale:'CORRECT. Acute onset (hours), fluctuating, with a clear precipitant (surgery, anesthesia, medications, possible electrolyte shift). This is classic post-operative delirium. Priority: identify and treat the underlying cause. Check meds, electrolytes, oxygenation, bladder distension, and pain level.'},
      {l:'C', t:'Sundowning — expected in elderly patients in the evening', correct:false, rationale:'Sundowning is increased confusion in the evening, typically seen in patients with EXISTING dementia. This patient had no prior confusion. Sundowning does not explain acute-onset delirium in a previously oriented patient.'},
      {l:'D', t:'Anxiety — administer lorazepam (Ativan) as needed', correct:false, rationale:'DANGER. Benzodiazepines (Ativan) can WORSEN delirium in elderly patients. They are a known cause of delirium and are generally contraindicated unless the patient is in alcohol withdrawal or having seizures. Treat the cause, not the symptom.'},

// =================== STATE ===================
let state = { answers: {}, submitted: {}, score: 0, total: QUESTIONS.length };

function buildQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = QUESTIONS.map(q => {
    const badgeClass = { hot:'badge-hot', cold:'badge-cold', electro:'badge-electro', infusion:'badge-infusion', trauma:'badge-trauma', abg:'badge-abg', fluid:'badge-fluid', vet:'badge-vet' }[q.badge] || '';
    return `<div class="q-card" id="q${q.id}">
      <div class="q-meta">
        <span class="q-num">Q${q.id}</span>
        <span class="badge ${badgeClass}">${q.topic}</span>
        ${q.type === 'sata' ? '<span class="sata-tag">SATA</span>' : ''}
        ${q.trap ? '<span class="badge badge-trap">⚠ Trap</span>' : ''}
      </div>
      ${q.diagram ? `<div class="diagram-box">${q.diagram}</div>` : ''}
      <div class="q-text">${q.text}</div>
      <div id="opts${q.id}">
        ${q.options.map((o, i) => `<div class="option" data-q="${q.id}" data-idx="${i}" onclick="pick(${q.id},${i})">
          <span class="option-letter">${o.l}</span>
          <span class="option-text">${o.t}</span>
        </div>`).join('')}
      </div>
      <button class="submit-btn" id="sub${q.id}" disabled onclick="submitQ(${q.id})">Select an answer</button>
    </div>`;
  }).join('');
}

function pick(qid, idx) {
  if (state.submitted[qid]) return;
  const q = QUESTIONS.find(x => x.id === qid);
  if (q.type === 'sata') {
    if (!state.answers[qid]) state.answers[qid] = [];
    const arr = state.answers[qid];
    const pos = arr.indexOf(idx);
    pos === -1 ? arr.push(idx) : arr.splice(pos, 1);
  } else {
    state.answers[qid] = [idx];
  }
  document.querySelectorAll(`[data-q="${qid}"]`).forEach(el => {
    el.classList.toggle('selected', (state.answers[qid] || []).includes(+el.dataset.idx));
  });
  const btn = document.getElementById(`sub${qid}`);
  if (state.answers[qid] && state.answers[qid].length > 0) {
    btn.disabled = false; btn.classList.add('ready');
    btn.textContent = q.type === 'sata' ? `Submit (${state.answers[qid].length} selected)` : 'Submit Answer';
  } else {
    btn.disabled = true; btn.classList.remove('ready');
    btn.textContent = 'Select an answer';
  }
}

function submitQ(qid) {
  if (state.submitted[qid]) return;
  const q = QUESTIONS.find(x => x.id === qid);
  const sel = state.answers[qid] || [];
  const correctIdxs = q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0);
  const isCorrect = sel.length === correctIdxs.length && sel.every(i => correctIdxs.includes(i));
  if (isCorrect) state.score++;
  state.submitted[qid] = { correct: isCorrect, selected: sel };

  const card = document.getElementById(`q${qid}`);
  card.classList.add(isCorrect ? 'correct' : 'incorrect');

  document.querySelectorAll(`[data-q="${qid}"]`).forEach((el, i) => {
    el.style.pointerEvents = 'none';
    if (q.options[i].correct) el.classList.add('correct-ans');
    if (sel.includes(i) && !q.options[i].correct) el.classList.add('wrong-ans');
    const rDiv = document.createElement('div');
    rDiv.className = `option-rationale ${q.options[i].correct ? 'r-correct' : 'r-wrong'}`;
    rDiv.textContent = q.options[i].rationale;
    el.appendChild(rDiv);
  });

  const btn = document.getElementById(`sub${qid}`);
  btn.disabled = true;
  btn.classList.remove('ready');
  btn.textContent = isCorrect ? '✓ Correct' : '✗ Incorrect';
  btn.style.background = isCorrect ? '#166534' : '#7f1d1d';
  btn.style.color = '#fff';

  // Add vocab tip box
  if (q.vocabTip) {
    const tipDiv = document.createElement('div');
    tipDiv.className = 'vocab-tip';
    tipDiv.innerHTML = '<strong>📖 When you see this on an exam:</strong><br>' + q.vocabTip;
    card.appendChild(tipDiv);
  }

  // Add trap callout if applicable
  if (q.trap) {
    const trap = document.createElement('div');
    trap.className = 'trap-call';
    trap.innerHTML = '<span class="trap-icon">⚠</span> <strong>Professor Trap:</strong> This question is designed to look like a different answer is correct. Read every option critically.';
    card.appendChild(trap);
  }

  updateProgress();
  if (Object.keys(state.submitted).length === QUESTIONS.length) showScore();
}

function updateProgress() {
  const done = Object.keys(state.submitted).length;
  document.getElementById('progressFill').style.width = (done / QUESTIONS.length * 100) + '%';
}

function showScore() {
  const sc = document.getElementById('scoreCard');
  sc.style.display = 'block';
  const pct = Math.round(state.score / QUESTIONS.length * 100);
  const grade = pct >= 90 ? '#22c55e' : pct >= 78 ? '#fbbf24' : '#ef4444';
  const msg = pct >= 90 ? 'Ready for tomorrow 🔥' : pct >= 78 ? 'Strong — review missed topics' : 'Focus review needed — see weak areas below';

  const topicScores = {};
  QUESTIONS.forEach(q => {
    if (!topicScores[q.topic]) topicScores[q.topic] = { c: 0, t: 0 };
    topicScores[q.topic].t++;
    if (state.submitted[q.id]?.correct) topicScores[q.topic].c++;
  });

  const weakTopics = Object.entries(topicScores)
    .filter(([_, v]) => v.c < v.t)
    .sort((a, b) => (a[1].c / a[1].t) - (b[1].c / b[1].t));

  // Save to localStorage so The System stats tab can track it
  try {
    const entry = {
      examId: 'ms1-exam2-final-draft-v2',
      examLabel: 'MS1 Exam 2 — Final Draft v2',
      date: new Date().toISOString(),
      score: pct,
      correct: state.score,
      total: QUESTIONS.length,
      topicBreakdown: Object.fromEntries(Object.entries(topicScores).map(([k,v])=>[k,{c:v.c,t:v.t}])),
      weakAreas: weakTopics.map(([t]) => t)
    };
    const hist = JSON.parse(localStorage.getItem('examHistory') || '[]');
    hist.unshift(entry);
    localStorage.setItem('examHistory', JSON.stringify(hist.slice(0, 20)));
    localStorage.setItem('lastExamStats', JSON.stringify(entry));
  } catch(e) {}

  sc.innerHTML = `
    <div class="score-big" style="color:${grade}">${state.score}/${QUESTIONS.length}</div>
    <div class="score-pct">${pct}% · ${msg}</div>
    <div class="score-grid">
      ${Object.entries(topicScores).map(([topic, v]) => `
        <div class="score-cell">
          <div class="score-cell-label">${topic}</div>
          <div class="score-cell-val" style="color:${v.c===v.t?'#22c55e':v.c/v.t>=.5?'#fbbf24':'#ef4444'}">${v.c}/${v.t}</div>
        </div>`).join('')}
    </div>
    ${weakTopics.length > 0 ? `<div class="weak-list"><div style="font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Review before exam</div>${weakTopics.map(([topic, v]) => `<div class="weak-item"><span class="w-topic">${topic}</span> — ${v.c}/${v.t} correct</div>`).join('')}</div>` : ''}
    <button class="restart-btn" onclick="restartQuiz()">Retake Exam</button>
  `;
  sc.scrollIntoView({ behavior: 'smooth' });
}

function restartQuiz() {
  state = { answers: {}, submitted: {}, score: 0, total: QUESTIONS.length };
  updateProgress();
  document.getElementById('scoreCard').style.display = 'none';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
updateProgress();

// Show last attempt banner if one exists
try {
  const last = JSON.parse(localStorage.getItem('lastExamStats'));
  if (last && last.examId === 'ms1-exam2-final-draft-v2') {
    const el = document.getElementById('lastAttempt');
    const color = last.score >= 90 ? '#22c55e' : last.score >= 78 ? '#fbbf24' : '#ef4444';
    const weak = last.weakAreas && last.weakAreas.length > 0
      ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${last.weakAreas.map(w => `<span style="font-family:'IBM Plex Mono',monospace;font-size:.6rem;background:#1f0d0d;color:#fca5a5;padding:2px 8px;border-radius:8px">${w}</span>`).join('')}</div>`
      : '';
    el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em">Last Attempt</div><div style="font-size:.8rem;color:#94a3b8;margin-top:2px">${new Date(last.date).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${last.correct}/${last.total}</div></div><div style="font-family:'DM Serif Display',serif;font-size:1.8rem;font-weight:700;color:${color}">${last.score}%</div></div>${weak}`;
    el.style.display = 'block';
  }
} catch(e) {}
</script>
