const EXAM_ID='ms1-exam3-nlm-ch16-drill';
const EXAM_LABEL='Ch 16 NLM Drill — Inflammation & Immunity (15Q)';
const questions=[
{id:1,chapter:16,difficulty:'easy',sata:false,trap:false,
stem:'A patient presents to the urgent care clinic after severely spraining their ankle during a baseball game. The ankle is swollen, red, warm to the touch, and painful. The patient demands antibiotics, stating, "It\'s red and swollen, so it must be infected." What is the nurse\'s best understanding of this physiological process?',
options:[
{letter:'A',text:'The patient has a local bacterial infection and requires a swab culture.',correct:false,rationale:'A sprained ankle is a closed tissue injury. There is no evidence of pathogenic invasion (infection) requiring antibiotics.'},
{letter:'B',text:'Inflammation is a specific adaptive response to tissue trauma.',correct:false,rationale:'Inflammation is a non-specific (innate) defense, not a specific (adaptive) one.'},
{letter:'C',text:'Inflammation can occur without infection and is a non-specific innate defense.',correct:true,rationale:'As the professor emphasized in lecture, inflammation is a non-specific tissue response to cellular injury (like getting hit with a baseball bat or spraining an ankle) and does not always mean an infection is present.'},
{letter:'D',text:'The patient\'s innate immune system has failed, allowing opportunistic pathogens to enter.',correct:false,rationale:'The innate immune system has not failed; the inflammation IS the innate immune system working appropriately to contain the injury.'}
],vocabTip:'What This Was Testing: Innate Immunity & Inflammation triggers. Test Clue: Closed trauma (sprain) presenting with classic inflammation signs. Fast Rule: If you see [tissue injury without pathogen] → think [inflammation without infection].'},

{id:2,chapter:16,difficulty:'medium',sata:true,trap:false,
stem:'A patient suffers a deep laceration. Within hours, the site becomes warm, red, and swollen. Which of the following statements accurately describe the physiological causes of these cardinal signs of inflammation?',
options:[
{letter:'A',text:'Warmth is caused by increased blood flow (hyperemia) to the area.',correct:true,rationale:'Macrophages and mast cells release vasoactive amines that dilate arterioles, bringing more warm blood to the area.'},
{letter:'B',text:'Swelling is caused by vasoconstriction of the local arterioles.',correct:false,rationale:'Swelling is caused by vasoDILATION and increased capillary permeability (making the vessels like "Swiss cheese," per the lecture), allowing plasma to leak into tissues.'},
{letter:'C',text:'Redness is a direct result of macrophages consuming necrotic tissue.',correct:false,rationale:'Redness is caused by hyperemia (increased blood flow), not phagocytosis.'},
{letter:'D',text:'Edema forms a protective fluid cushion around the injury.',correct:true,rationale:'Edema protects the area from further injury by creating a cushion of fluid.'},
{letter:'E',text:'Decreased function occurs due to tissue swelling and pain.',correct:true,rationale:'Pain and swelling physically restrict the mobility of the affected tissue.'}
],vocabTip:'What This Was Testing: The 5 Cardinal Signs of Inflammation and their physiological mechanisms. Test Clue: Warmth, redness, swelling, pain, decreased function. Fast Rule: If you see [warmth/redness] → think [vasodilation and increased blood flow].'},

{id:3,chapter:16,difficulty:'easy',sata:false,trap:false,
stem:'A healthy 22-year-old nursing student receives the varicella (chickenpox) vaccine prior to starting clinicals. Which type of immunity will this student develop?',
options:[
{letter:'A',text:'Natural active immunity',correct:false,rationale:'Natural active immunity occurs when a person is naturally exposed to the live pathogen, gets sick, and recovers.'},
{letter:'B',text:'Artificial active immunity',correct:true,rationale:'Artificial active immunity (vaccine-induced) occurs when a weakened or killed form of a disease is injected. The host\'s body actively does the work to create memory cells and antibodies without suffering the actual disease.'},
{letter:'C',text:'Natural passive immunity',correct:false,rationale:'Natural passive immunity is the transfer of antibodies from mother to fetus/infant.'},
{letter:'D',text:'Artificial passive immunity',correct:false,rationale:'Artificial passive immunity is injecting pre-made antibodies (like a tetanus immune globulin) into a person.'}
],vocabTip:'What This Was Testing: Types of Immunity (Active vs. Passive). Test Clue: "Vaccine" or "Immunization". Fast Rule: If you see [vaccine/immunization] → think [Artificial Active Immunity].'},

{id:4,chapter:16,difficulty:'medium',sata:false,trap:true,
stem:'A patient is bitten by a stray dog and receives an injection of rabies immune globulin (pre-made antibodies) in the emergency department. The patient asks, "Will this injection protect me from rabies for the rest of my life?" What is the nurse\'s best response?',
options:[
{letter:'A',text:'"Yes, because your body will adapt to these antibodies and form long-term memory cells."',correct:false,rationale:'The patient\'s body did not make these antibodies, so it will not create memory cells.'},
{letter:'B',text:'"Yes, this stimulates your cell-mediated immunity to permanently destroy the virus."',correct:false,rationale:'Immune globulins provide antibody-mediated (humoral) immunity, not cell-mediated immunity.'},
{letter:'C',text:'"No, this provides immediate but short-term protection because your body will eventually eliminate these foreign antibodies."',correct:true,rationale:'As emphasized in the lecture, artificial passive immunity involves giving someone else\'s antibodies. The patient\'s immune system will recognize these injected antibodies as "non-self" and eventually destroy them, making the protection immediate but short-lived.'},
{letter:'D',text:'"No, this only triggers the inflammatory response, which only lasts for 72 hours."',correct:false,rationale:'Immune globulins provide specific passive immunity, not just a non-specific inflammatory response.'}
],vocabTip:'What This Was Testing: Artificial Passive Immunity limitations. Test Clue: Injecting "immune globulin", "antibodies", or "convalescent serum". Fast Rule: If you see [passive immunity/injected antibodies] → think [immediate but short-term protection].'},

{id:5,chapter:16,difficulty:'hard',sata:false,trap:false,
stem:'The nurse is reviewing the white blood cell (WBC) differential of a patient admitted with a severe bacterial infection. The lab report shows a normal total WBC count, but the segmented neutrophil count is extremely low, and the band neutrophil count is 18% (normal is ~5%). What is the nurse\'s best interpretation of these findings?',
options:[
{letter:'A',text:'The patient has a highly functioning immune system with excellent resistance.',correct:false,rationale:'A low segmented (mature) neutrophil count means low resistance to infection.'},
{letter:'B',text:'The bone marrow is rapidly producing mature cells capable of intense phagocytosis.',correct:false,rationale:'Band cells are IMMATURE neutrophils. Only MATURE segmented neutrophils are capable of phagocytosis.'},
{letter:'C',text:'The patient has a "left shift," indicating the bone marrow cannot keep up with the infection, placing them at high risk for sepsis.',correct:true,rationale:'A "left shift" (bandemia) means the bone marrow is exhausted and releasing useless, immature band cells into the blood. This indicates a severe, overwhelming infection and a high risk for sepsis.'},
{letter:'D',text:'The patient is experiencing a mild, localized allergic reaction.',correct:false,rationale:'Eosinophils and basophils, not neutrophils, elevate during allergic reactions.'}
],vocabTip:'What This Was Testing: WBC Differential, ANC, and Left Shift. Test Clue: "Bands", "immature neutrophils", "left shift". Fast Rule: If you see [high band count / left shift] → think [severe infection / sepsis risk / useless immature cells].'},

{id:6,chapter:16,difficulty:'medium',sata:false,trap:false,
stem:'During the cellular ingestion phase of the immune response, a macrophage encounters an invading bacterium. Which specific immune system mechanism acts as a "universal product code" to help the macrophage determine if the bacterium is "self" or "non-self"?',
options:[
{letter:'A',text:'Human Leukocyte Antigens (HLAs)',correct:true,rationale:'HLAs are the unique surface proteins acting as a barcode. Immune cells scan these to differentiate between self cells and non-self invaders.'},
{letter:'B',text:'Pluripotent stem cells',correct:false,rationale:'Pluripotent stem cells are undifferentiated cells in the bone marrow.'},
{letter:'C',text:'Prostaglandins',correct:false,rationale:'Prostaglandins are mediators of inflammation, not cellular barcodes.'},
{letter:'D',text:'Immunoglobulin E (IgE)',correct:false,rationale:'IgE is an antibody primarily associated with allergic reactions and parasite defense, binding to basophils and mast cells.'}
],vocabTip:'What This Was Testing: Human Leukocyte Antigens (HLAs) and Self-Tolerance. Test Clue: "Barcode", "self vs non-self", "recognition". Fast Rule: If you see [determining self vs non-self] → think [HLAs / Universal Product Code].'},

{id:7,chapter:16,difficulty:'hard',sata:false,trap:true,
stem:'An 84-year-old patient is brought to the clinic by a family member who states, "He has been very confused and restless today." The patient\'s temperature is 98.2°F (36.8°C), and his total WBC count is 6,000/mm³ (normal). Based on the concepts of immunosenescence, what is the nurse\'s priority action?',
options:[
{letter:'A',text:'Discharge the patient, as the normal temperature and WBC count rule out infection.',correct:false,rationale:'This is a trap. Older adults often do not mount a fever or leukocytosis (elevated WBCs) during acute infections.'},
{letter:'B',text:'Assess the patient for other signs of a hidden infection, such as dehydration or urinary tract involvement.',correct:true,rationale:'Due to age-related changes in immunity, neutrophil function is reduced. Older adults may have severe infections without a fever or elevated WBCs. Acute confusion (delirium) is often the first sign of infection in the elderly.'},
{letter:'C',text:'Administer broad-spectrum antibiotics immediately for presumed sepsis.',correct:false,rationale:'Assessment and cultures must be done before administering antibiotics.'},
{letter:'D',text:'Prepare the patient for a bone marrow biopsy to assess for stem cell failure.',correct:false,rationale:'This is an extreme and unnecessary intervention for suspected infection in an older adult.'}
],vocabTip:'What This Was Testing: Age-Related Changes in Immunity (Immunosenescence). Test Clue: Elderly patient + acute confusion + normal temp/WBC. Fast Rule: If you see [elderly + acute confusion] → think [hidden infection despite normal labs/vitals].'},

{id:8,chapter:16,difficulty:'easy',sata:false,trap:false,
stem:'A patient is admitted with a parasitic worm infestation. Which specific leukocyte does the nurse expect to be significantly elevated in the patient\'s WBC differential?',
options:[
{letter:'A',text:'Basophils',correct:false,rationale:'Basophils release vasoactive amines (histamine) for general inflammation and allergic reactions.'},
{letter:'B',text:'Macrophages',correct:false,rationale:'Macrophages are primarily for phagocytosis of bacteria and cellular debris.'},
{letter:'C',text:'Eosinophils',correct:true,rationale:'Eosinophils are most active against infestations of parasitic larvae. They also increase during allergic responses (like asthma).'},
{letter:'D',text:'Cytotoxic T-cells',correct:false,rationale:'Cytotoxic T-cells selectively attack virally infected cells and cancer cells.'}
],vocabTip:'What This Was Testing: Specific Leukocyte Functions. Test Clue: "Parasitic", "asthma", "allergic reaction". Fast Rule: If you see [parasite] → think [Eosinophils].'},

{id:9,chapter:16,difficulty:'medium',sata:true,trap:false,
stem:'The professor uses the analogy of "counting only red cars" to describe a specific division of the immune system. Which of the following characteristics accurately describe the Adaptive Immune System?',
options:[
{letter:'A',text:'It provides a rapid, immediate response upon first exposure to a pathogen.',correct:false,rationale:'The innate system is rapid and immediate. The adaptive system takes time to respond upon FIRST exposure.'},
{letter:'B',text:'It requires prior exposure to an antigen to generate a targeted response.',correct:true,rationale:'Adaptive immunity is specific (counting only the red cars) and requires sensitization to a specific antigen.'},
{letter:'C',text:'It utilizes T-lymphocytes and B-lymphocytes.',correct:true,rationale:'B-cells (Antibody-Mediated) and T-cells (Cell-Mediated) are the key players in adaptive immunity.'},
{letter:'D',text:'It includes physical barriers like the skin and mucous membranes.',correct:false,rationale:'Skin and mucous membranes are part of the innate, non-specific immune system.'},
{letter:'E',text:'It generates long-term memory cells for sustained immunity.',correct:true,rationale:'Adaptive immunity creates memory cells (B-memory and T-memory) for long-lasting protection.'}
],vocabTip:'What This Was Testing: Adaptive vs. Innate Immunity characteristics. Test Clue: "Specific", "memory", "lymphocytes". Fast Rule: If you see [specific/memory/acquired] → think [Adaptive Immunity].'},

{id:10,chapter:16,difficulty:'medium',sata:false,trap:false,
stem:'A patient is diagnosed with a viral infection. During the immune response, which specific cells conduct "seek and destroy" missions to directly kill these virally infected cells without needing prior sensitization?',
options:[
{letter:'A',text:'Natural Killer (NK) cells',correct:true,rationale:'NK cells (CD16+ cells) are part of Cell-Mediated Immunity. They uniquely have direct cytotoxic effects to non-selectively seek and destroy abnormal self-cells (cancer cells and virally infected cells) without needing prior sensitization.'},
{letter:'B',text:'Helper T-cells',correct:false,rationale:'Helper T-cells secrete cytokines to organize and "call together" the immune response, but do not directly kill cells.'},
{letter:'C',text:'Plasma cells',correct:false,rationale:'Plasma cells secrete antibodies (AMI).'},
{letter:'D',text:'Band neutrophils',correct:false,rationale:'Band neutrophils are immature and incapable of killing/phagocytosis.'}
],vocabTip:'What This Was Testing: Cell-Mediated Immunity / NK Cell function. Test Clue: "Seek and destroy", "virally infected cells", "cancer cells", "without prior sensitization". Fast Rule: If you see [seek and destroy cancer/viruses] → think [Natural Killer (NK) cells].'},

{id:11,chapter:16,difficulty:'medium',sata:false,trap:false,
stem:'During a lecture, the professor compares Antibody-Mediated Immunity (AMI) to the way insulin acts as a "key" to let glucose into a cell. In AMI, which cell is responsible for actively manufacturing and secreting the "keys" (antibodies) that specifically fit the invading antigen?',
options:[
{letter:'A',text:'Memory B-cells',correct:false,rationale:'Memory cells remain sensitized for future exposures but do not actively secrete antibodies during the initial fight.'},
{letter:'B',text:'Plasma cells',correct:true,rationale:'Once a B-lymphocyte is sensitized, it divides into a memory cell and a plasma cell. The plasma cell is the factory that immediately begins secreting huge amounts of specific antibodies (immunoglobulins) to neutralize the antigen.'},
{letter:'C',text:'Macrophages',correct:false,rationale:'Macrophages perform phagocytosis and present the antigen.'},
{letter:'D',text:'Cytotoxic T-cells',correct:false,rationale:'Cytotoxic T-cells deliver "lethal hits" to infected cells (CMI), they do not make antibodies.'}
],vocabTip:'What This Was Testing: Antibody-Mediated Immunity (Humoral) cell functions. Test Clue: "Secretes antibodies", "manufactures immunoglobulins". Fast Rule: If you see [antibody production/secretion] → think [Plasma cells].'},

{id:12,chapter:16,difficulty:'hard',sata:false,trap:false,
stem:'A patient develops severe anaphylaxis after a bee sting. The patient\'s airways constrict, and they develop severe edema. Which leukocyte is primarily responsible for the rapid release of histamine and vasoactive amines that cause this vascular leak syndrome?',
options:[
{letter:'A',text:'Neutrophils',correct:false,rationale:'Neutrophils are responsible for phagocytizing bacteria.'},
{letter:'B',text:'Regulator T-cells',correct:false,rationale:'Regulator T-cells calm the immune response down and maintain self-tolerance.'},
{letter:'C',text:'Basophils',correct:true,rationale:'Basophils (and tissue mast cells) have binding sites for IgE. When an allergen binds, they break open (degranulate) and release histamine, kinins, and heparin. This dilates arterioles, increases capillary permeability, and causes massive fluid shifts (edema).'},
{letter:'D',text:'Erythrocytes',correct:false,rationale:'Erythrocytes are red blood cells and carry oxygen.'}
],vocabTip:'What This Was Testing: Basophil/Mast Cell function in inflammation. Test Clue: "Histamine", "allergic reaction", "vascular leak". Fast Rule: If you see [histamine/allergic edema] → think [Basophils & Mast cells].'},

{id:13,chapter:16,difficulty:'hard',sata:false,trap:false,
stem:'The complement system is activated during a patient\'s immune response to a bacterial invasion. What is the primary role of these 20 inactive plasma proteins once they are stimulated?',
options:[
{letter:'A',text:'They convert arachidonic acid into prostaglandins to cause a fever.',correct:false,rationale:'The cyclooxygenase (COX) enzyme converts arachidonic acid to prostaglandins.'},
{letter:'B',text:'They form a Membrane Attack Complex (MAC) on the antigen to enhance phagocytosis.',correct:true,rationale:'The complement system proteins act as enzymes that stick to the antigen and form a membrane attack complex (MAC). This "fixes" the complement to the invader, making phagocytosis by macrophages and neutrophils much more efficient.'},
{letter:'C',text:'They produce colony-stimulating factor (CSF) to increase bone marrow production.',correct:false,rationale:'Macrophages secrete colony-stimulating factor (CSF).'},
{letter:'D',text:'They present the antigen to virgin B-lymphocytes.',correct:false,rationale:'Macrophages and Helper T-cells present antigens to B-cells.'}
],vocabTip:'What This Was Testing: The Complement System. Test Clue: "20 inactive plasma proteins", "MAC". Fast Rule: If you see [Complement system] → think [Enhances phagocytosis / Membrane Attack Complex].'},

{id:14,chapter:16,difficulty:'medium',sata:true,trap:false,
stem:'A nurse is caring for a patient recovering from a major surgical incision. The nurse understands that macrophages are actively assisting in the immune response. Which of the following are primary functions of macrophages?',
options:[
{letter:'A',text:'Nonspecific phagocytosis of cellular debris and invaders.',correct:true,rationale:'Macrophages engulf and digest invaders and clean up debris (innate immunity).'},
{letter:'B',text:'Secreting cytokines to attract other immune cells to the site.',correct:true,rationale:'Macrophages secrete pro-inflammatory cytokines to call other white blood cells to the area.'},
{letter:'C',text:'Processing and presenting antigens to helper T-cells.',correct:true,rationale:'Macrophages "mark" the invader and present the antigen to helper T-cells to trigger the adaptive immune response.'},
{letter:'D',text:'Secreting large quantities of Immunoglobulin G (IgG).',correct:false,rationale:'Plasma cells (from B-cells) secrete antibodies/IgG.'},
{letter:'E',text:'Puncturing holes in virally infected cells without prior sensitization.',correct:false,rationale:'Natural Killer (NK) cells puncture holes in virally infected cells without prior sensitization.'}
],vocabTip:'What This Was Testing: Macrophage functions across innate and adaptive immunity. Test Clue: "Phagocytosis", "Antigen presenting", "Cytokine secretion". Fast Rule: If you see [Antigen presenting / heavy phagocytosis] → think [Macrophages].'},

{id:15,chapter:16,difficulty:'medium',sata:false,trap:false,
stem:'A patient is undergoing the 7-step process of phagocytosis to clear a pathogen. During which step do opsonins (like dead neutrophils and antibodies) coat the target cell, making it easier for the macrophage to stick to it?',
options:[
{letter:'A',text:'Exposure/Invasion',correct:false,rationale:'Exposure is the initial entry of the pathogen.'},
{letter:'B',text:'Attraction',correct:false,rationale:'Attraction is when chemotaxins draw the WBC to the area.'},
{letter:'C',text:'Adherence',correct:true,rationale:'Adherence is the step where the phagocytic cell actually binds to the target. Opsonins (substances that coat the target) act like glue, increasing the contact and making it much easier for the macrophage to adhere to the invader.'},
{letter:'D',text:'Degradation',correct:false,rationale:'Degradation is the final step where enzymes digest the engulfed target.'}
],vocabTip:'What This Was Testing: The specific stages of Phagocytosis. Test Clue: "Opsonins", "stick to it", "coating". Fast Rule: If you see [Opsonins/coating] → think [Adherence phase of phagocytosis].'}
];

card.className='q-card';
card.id=`qcard-${q.id}`;
const isSata=q.sata===true;
const trapBadge=q.trap?'<span class="badge badge-trap">TRAP</span>':'';
const sataBadge=isSata?'<span class="badge badge-sata">SATA</span>':'';
card.innerHTML=`
<div class="q-top">
<span class="q-num">Q${idx+1}</span>
<span class="badge badge-ch${q.chapter}">Ch ${q.chapter}</span>
${trapBadge}${sataBadge}
</div>
<div class="q-stem">${q.stem}${isSata?'<em>(Select all that apply)</em>':''}</div>
<div class="opts" id="opts-${q.id}">
${q.options.map(o=>`
<div class="opt" id="opt-${q.id}-${o.letter}" onclick="toggleOpt(${q.id},'${o.letter}',${isSata})">
<span class="opt-letter">${o.letter}.</span>
<div><span class="opt-text">${o.text}</span><div class="opt-rationale" id="rat-${q.id}-${o.letter}">${o.rationale}</div></div>
</div>`).join('')}
</div>
<button class="btn-submit" id="btn-${q.id}" onclick="submitQ(${q.id})">Submit Answer</button>
<div class="vocab-tip" id="tip-${q.id}"><strong>Vocab Tip:</strong> ${q.vocabTip}</div>
${q.trap?`<div class="trap-callout" id="trap-${q.id}">&#9888; TRAP QUESTION: This question tests a common misconception. Read the rationale carefully!</div>`:''}
`;
area.appendChild(card);
});
loadState();
}

function toggleOpt(qId,letter,isSata){
if(answered[qId])return;
if(!selections[qId])selections[qId]=[];
if(isSata){
const idx=selections[qId].indexOf(letter);
if(idx>-1)selections[qId].splice(idx,1);
else selections[qId].push(letter);
}else{
selections[qId]=[letter];
}
const q=questions.find(x=>x.id===qId);
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.classList.toggle('selected',selections[qId].includes(o.letter));
});
}

function submitQ(qId){
if(answered[qId])return;
if(!selections[qId]||selections[qId].length===0)return;
answered[qId]=true;
const q=questions.find(x=>x.id===qId);
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const isCorrect=correctLetters.length===selections[qId].length&&correctLetters.every(l=>selections[qId].includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.style.cursor='default';
if(o.correct)el.classList.add('correct-show');
else if(selections[qId].includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
document.getElementById(`btn-${qId}`).disabled=true;
document.getElementById(`btn-${qId}`).textContent=isCorrect?'Correct!':'Incorrect';
updateProgress();
saveState();
if(Object.keys(answered).length===questions.length)showScore();
}

function updateProgress(){
const pct=(Object.keys(answered).length/questions.length)*100;
document.getElementById('progressBar').style.width=pct+'%';
}

function showScore(){
const chScores={16:0};
const chTotals={16:0};
const chNames={16:'Ch 16 Inflammation'};
const chColors={16:'#f472b6'};
questions.forEach(q=>{
chTotals[q.chapter]++;
if(answered[q.id]){
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[q.id]||[];
if(correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l)))chScores[q.chapter]++;
}
});
let totalCorrect=0,totalQ=0;
[16].forEach(ch=>{totalCorrect+=chScores[ch];totalQ+=chTotals[ch];});
const pct=Math.round((totalCorrect/totalQ)*100);
document.getElementById('finalScore').textContent=pct+'%';
document.getElementById('finalText').textContent=`${totalCorrect} of ${totalQ} correct`;
const bd=document.getElementById('chapterBreakdown');
bd.innerHTML='';
[16].forEach(ch=>{
const box=document.createElement('div');
box.className='ch-box';
box.innerHTML=`<div class="ch-label">${chNames[ch]}</div><div class="ch-score" style="color:${chColors[ch]}">${chScores[ch]}/${chTotals[ch]}</div>`;
bd.appendChild(box);
});
document.getElementById('scoreCard').style.display='block';
document.getElementById('scoreCard').scrollIntoView({behavior:'smooth'});
const record={score:pct,correct:totalCorrect,total:totalQ,date:new Date().toLocaleDateString(),chapters:{16:{correct:chScores[16],total:chTotals[16]}}};
localStorage.setItem(EXAM_ID+'-last',JSON.stringify(record));
localStorage.setItem(EXAM_ID+'-label',EXAM_LABEL);
const hist=JSON.parse(localStorage.getItem('examHistory')||'[]');
hist.push({examId:EXAM_ID,examLabel:EXAM_LABEL,date:new Date().toISOString(),score:pct,correct:totalCorrect,total:totalQ,topicBreakdown:{16:{correct:chScores[16],total:chTotals[16]}}});
localStorage.setItem('examHistory',JSON.stringify(hist.slice(-20)));
}

function restartQuiz(){
answered={};
selections={};
localStorage.removeItem(EXAM_ID+'-state');
document.getElementById('scoreCard').style.display='none';
buildQuiz();
}

function saveState(){
localStorage.setItem(EXAM_ID+'-state',JSON.stringify({answered,selections}));
}

function loadState(){
const saved=localStorage.getItem(EXAM_ID+'-state');
if(saved){
const state=JSON.parse(saved);
answered=state.answered||{};
selections=state.selections||{};
Object.keys(answered).forEach(qId=>{
const q=questions.find(x=>x.id==qId);
if(!q)return;
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[qId]||[];
const isCorrect=correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
if(sel.includes(o.letter))el.classList.add('selected');
if(o.correct)el.classList.add('correct-show');
else if(sel.includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
el.style.cursor='default';
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
const btn=document.getElementById(`btn-${qId}`);
btn.disabled=true;
btn.textContent=isCorrect?'Correct!':'Incorrect';
});
updateProgress();
if(Object.keys(answered).length===questions.length)showScore();
}
const last=localStorage.getItem(EXAM_ID+'-last');
if(last){
const r=JSON.parse(last);
document.getElementById('lastAttempt').style.display='block';
document.getElementById('lastScore').textContent=r.score+'%';
document.getElementById('lastDate').textContent=r.date;
}
}

buildQuiz();
</script>
<script src="encourage.js"></script>
</body>
</html>
