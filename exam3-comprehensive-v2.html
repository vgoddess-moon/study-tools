<script>
const EXAM_ID='ms1-exam3-comprehensive-v2';
const EXAM_LABEL='Ch 16-17 Practice v2 (20Q)';
const questions=[
// ===== CHAPTER 16: Concepts of Inflammation and Immunity =====
{id:1,chapter:16,difficulty:'easy',sata:false,trap:false,
stem:'A nursing student asks how a child who had chickenpox as a toddler is protected from getting it again. The nurse explains this is an example of which type of immunity?',
options:[
{letter:'A',text:'Natural active immunity',correct:true,rationale:'Natural active immunity develops when the body is exposed to a live pathogen (chickenpox virus) and mounts its own immune response, producing memory cells that provide long-lasting protection.'},
{letter:'B',text:'Artificial active immunity',correct:false,rationale:'Artificial active immunity comes from vaccination (receiving a weakened or killed pathogen). The child got the actual disease, not a vaccine.'},
{letter:'C',text:'Natural passive immunity',correct:false,rationale:'Natural passive immunity is the transfer of antibodies from mother to fetus through the placenta or breast milk. It is temporary and does not involve the child making their own antibodies.'},
{letter:'D',text:'Artificial passive immunity',correct:false,rationale:'Artificial passive immunity involves receiving pre-formed antibodies via injection (e.g., immunoglobulin). No antibodies were injected here; the child made their own.'}
],vocabTip:'Active = you MAKE the antibodies yourself (your immune system does the work). Passive = you RECEIVE someone else\'s antibodies (borrowed protection). Natural = happened naturally (got sick or from mom). Artificial = happened on purpose (vaccine or injection). Chickenpox as a kid = natural + active.'},

{id:2,chapter:16,difficulty:'easy',sata:false,trap:false,
stem:'A patient presents to the clinic with a swollen, red, warm, and painful right ankle after a sprain. The nurse documents these findings as cardinal signs of inflammation. Which term correctly matches the sign of WARMTH?',
options:[
{letter:'A',text:'Rubor',correct:false,rationale:'Rubor means redness. It results from vasodilation bringing more blood to the injured area, making it appear red.'},
{letter:'B',text:'Calor',correct:true,rationale:'Calor means heat/warmth. Increased blood flow from vasodilation brings warm blood to the local tissue, raising the temperature of the inflamed area.'},
{letter:'C',text:'Tumor',correct:false,rationale:'Tumor means swelling. It occurs when increased vascular permeability allows fluid and proteins to leak into interstitial tissue, causing edema.'},
{letter:'D',text:'Dolor',correct:false,rationale:'Dolor means pain. Chemical mediators like bradykinin and prostaglandins stimulate nerve endings in the inflamed tissue, causing pain.'}
],vocabTip:'The 5 Latin cardinal signs: Rubor (Redness), Calor (heat — think Calories = energy = heat), Tumor (swelling — not cancer here), Dolor (pain — think Dolores means "sorrows"), Functio Laesa (loss of function). These are LOCAL signs, not systemic like fever.'},

{id:3,chapter:16,difficulty:'medium',sata:false,trap:false,
stem:'During the cellular stage of the inflammatory response, the nurse knows that the FIRST white blood cells to arrive at the site of tissue injury are:',
options:[
{letter:'A',text:'Monocytes',correct:false,rationale:'Monocytes arrive later (after 24-48 hours) and transform into macrophages for cleanup and antigen presentation. They are the second wave, not the first responders.'},
{letter:'B',text:'Neutrophils',correct:true,rationale:'Neutrophils are the FIRST responders to arrive at the injury site (within 6-12 hours). They are the most abundant WBC and perform phagocytosis of bacteria and debris during acute inflammation.'},
{letter:'C',text:'Eosinophils',correct:false,rationale:'Eosinophils are primarily involved in parasitic infections and allergic responses. They are not the first cells to migrate to a general inflammatory site.'},
{letter:'D',text:'Basophils',correct:false,rationale:'Basophils release histamine and heparin and play a role in allergic and inflammatory responses, but they are not the first to arrive at injury sites. They are the rarest WBC.'}
],vocabTip:'Think of inflammation like a house fire: Neutrophils are the first fire truck on scene (first responders, 6-12 hrs). Monocytes/Macrophages are the cleanup crew that comes the next day (24-48 hrs). Neutrophils are fast but short-lived; macrophages stick around to finish the job.'},

{id:4,chapter:16,difficulty:'medium',sata:false,trap:true,
stem:'A 78-year-old patient in a long-term care facility has a urinary tract infection confirmed by urine culture. The nurse notes the patient\'s temperature is 98.4°F (36.9°C) and WBC count is 9,800/mm³. The nurse should:',
options:[
{letter:'A',text:'Reassure the patient that the normal temperature and WBC mean the infection is mild',correct:false,rationale:'TRAP. In older adults, immunosenescence causes a blunted immune response. A normal temperature and normal WBC do NOT rule out serious infection. The elderly often fail to mount a fever or leukocytosis even with severe infection.'},
{letter:'B',text:'Question the culture results since the vital signs do not support infection',correct:false,rationale:'The culture is the definitive diagnostic test. Normal vitals in elderly patients do NOT contradict a positive culture. Assuming vitals must match is a dangerous misconception with geriatric patients.'},
{letter:'C',text:'Recognize that older adults may not exhibit typical inflammatory markers and assess for atypical signs such as confusion or functional decline',correct:true,rationale:'Immunosenescence in the elderly means the inflammatory response is blunted. Older adults often present with atypical signs: acute confusion (delirium), falls, decreased appetite, or functional decline rather than fever and elevated WBC.'},
{letter:'D',text:'Hold antibiotic therapy until the patient develops a fever to confirm active infection',correct:false,rationale:'Waiting for a fever in an elderly patient is dangerous. Many older adults NEVER develop a fever with infection due to immunosenescence. Treatment should begin based on the confirmed culture, not on waiting for signs the patient may never show.'}
],vocabTip:'Immunosenescence = the immune system gets weaker with age. Older adults often have a "silent" infection: no fever, normal WBC, but they are actually very sick. Instead, look for confusion, falls, not eating, or just "not acting right." A normal temp in an elderly patient does NOT mean no infection.'},

{id:5,chapter:16,difficulty:'medium',sata:false,trap:false,
stem:'A patient\'s CBC shows: WBC 14,200/mm³, Segmented Neutrophils (Segs) 58%, Bands 12%. The nurse interprets this as:',
options:[
{letter:'A',text:'Normal white blood cell differential',correct:false,rationale:'WBC is elevated (normal 5,000-10,000). Bands at 12% are elevated (normal <5%). This is not a normal differential.'},
{letter:'B',text:'Leukocytosis with a left shift, indicating acute bacterial infection',correct:true,rationale:'Leukocytosis (WBC >10,000) combined with bandemia/left shift (bands >5% — here 12%) indicates the bone marrow is releasing immature neutrophils (bands) to fight an acute infection. The body is so stressed it is sending out "rookie" cells before they fully mature.'},
{letter:'C',text:'Leukopenia with neutropenia, indicating viral infection',correct:false,rationale:'Leukopenia is WBC BELOW 5,000. This patient has 14,200 (elevated). Viral infections tend to cause lymphocytosis, not bandemia.'},
{letter:'D',text:'Eosinophilia suggesting a parasitic infection',correct:false,rationale:'Eosinophilia would show elevated eosinophils, not elevated bands. The key finding here is the elevated bands (left shift), pointing to acute bacterial infection.'}
],vocabTip:'Left shift = lots of bands (immature neutrophils) in the blood. Normal bands <5%. Think of a factory in emergency mode: they are sending workers out before training is done because demand is so high. Bands >5% (bandemia) = the body is fighting a serious bacterial infection and is calling up the reserves.'},

{id:6,chapter:16,difficulty:'hard',sata:true,trap:false,
stem:'A nursing student is reviewing the functions of the complement system. Which statements about complement activation are correct? (Select all that apply.)',
options:[
{letter:'A',text:'Complement proteins coat pathogens to make them easier for phagocytes to engulf (opsonization)',correct:true,rationale:'Opsonization is a key complement function. Complement proteins (especially C3b) coat bacteria, acting as "flags" that phagocytes (neutrophils, macrophages) recognize, dramatically enhancing phagocytosis.'},
{letter:'B',text:'The membrane attack complex (MAC) creates pores in bacterial cell walls, causing lysis',correct:true,rationale:'The terminal complement pathway (C5b-C9) assembles the MAC, which punches holes in bacterial cell membranes. The bacterium cannot maintain homeostasis and lyses (bursts).'},
{letter:'C',text:'Complement fragments C3a and C5a attract phagocytes to the site of infection (chemotaxis)',correct:true,rationale:'C3a and C5a are potent chemotactic factors that attract neutrophils and macrophages to the infection site. C5a is the most powerful chemotactic complement fragment.'},
{letter:'D',text:'Complement activation provides long-term immunological memory against specific pathogens',correct:false,rationale:'Complement is part of INNATE (nonspecific) immunity. It does NOT create memory cells. Immunological memory is a function of ADAPTIVE immunity (T and B lymphocytes).'},
{letter:'E',text:'Complement can only be activated through the antibody-dependent classical pathway',correct:false,rationale:'Complement can be activated through THREE pathways: classical (antibody-dependent), alternative (directly by pathogen surfaces), and lectin (by mannose-binding lectin). It does not require antibodies.'}
],vocabTip:'Complement = a team of ~30 proteins that "complement" (help) the immune system in 3 ways: (1) Opsonize = coat bacteria like BBQ sauce so phagocytes want to eat them, (2) MAC attack = drill holes in bacteria so they pop, (3) Chemotaxis = send out a chemical "come here" signal to attract immune cells.'},

{id:7,chapter:16,difficulty:'medium',sata:false,trap:true,
stem:'A patient asks the nurse to explain the difference between antibody-mediated immunity and cell-mediated immunity. Which statement by the nurse is MOST accurate?',
options:[
{letter:'A',text:'"Antibody-mediated immunity uses B-lymphocytes that produce antibodies to fight pathogens outside of cells, while cell-mediated immunity uses T-lymphocytes to destroy infected cells directly."',correct:true,rationale:'Antibody-mediated (humoral) immunity involves B cells producing antibodies that target extracellular pathogens (bacteria, toxins, viruses in body fluids). Cell-mediated immunity involves T cells that directly attack intracellular threats (virus-infected cells, cancer cells, transplanted tissue).'},
{letter:'B',text:'"Both types of immunity are identical and interchangeable in how they fight infection."',correct:false,rationale:'They are distinct arms of adaptive immunity with different mechanisms and targets. Antibody-mediated targets extracellular pathogens; cell-mediated targets intracellular threats. They work together but are not interchangeable.'},
{letter:'C',text:'"Cell-mediated immunity produces antibodies while antibody-mediated immunity directly kills infected cells."',correct:false,rationale:'This reverses the two. B cells (antibody-mediated) produce antibodies. T cells (cell-mediated) directly kill infected cells. Do not confuse which cell type does which job.'},
{letter:'D',text:'"Antibody-mediated immunity only functions after the second exposure to a pathogen."',correct:false,rationale:'TRAP. While the secondary response is faster and stronger (memory B cells), antibody-mediated immunity DOES function on FIRST exposure — it just takes longer (primary response, 5-10 days to produce sufficient antibodies).'}
],vocabTip:'Think of it as two defense strategies: B cells are the snipers shooting antibody "bullets" at enemies floating around outside cells (bacteria, toxins). T cells are the SWAT team that breaks into your own cells when enemies are hiding inside (viruses, cancer). B = Bullets (antibodies). T = hand-To-hand combat (cell killing).'},

{id:8,chapter:16,difficulty:'easy',sata:false,trap:false,
stem:'During phagocytosis, the nurse explains to a student that the correct sequence of events is:',
options:[
{letter:'A',text:'Recognition and attachment, engulfment, phagosome formation, destruction by lysosomal enzymes',correct:true,rationale:'The phagocytosis process follows this order: (1) the phagocyte recognizes and attaches to the pathogen (aided by opsonization), (2) the cell membrane extends pseudopods to engulf it, (3) the pathogen is enclosed in a phagosome, (4) lysosomes fuse with the phagosome and release enzymes that digest the pathogen.'},
{letter:'B',text:'Engulfment, lysosomal destruction, recognition, phagosome formation',correct:false,rationale:'You cannot engulf something before recognizing it. The phagocyte must first identify the target (recognition) before it can engulf it. This sequence is out of order.'},
{letter:'C',text:'Lysosomal destruction, phagosome formation, engulfment, recognition',correct:false,rationale:'This is completely reversed. Destruction is the LAST step, not the first. The phagocyte must first find, grab, swallow, and package the pathogen before destroying it.'},
{letter:'D',text:'Phagosome formation, recognition, destruction, engulfment',correct:false,rationale:'A phagosome cannot form before the pathogen is engulfed. The phagosome IS the vesicle that forms around the engulfed pathogen. Recognition must come first.'}
],vocabTip:'Phagocytosis is like Pac-Man eating a ghost: (1) SEE IT — recognize the bad guy, (2) GRAB IT — stick to it and wrap around it, (3) SWALLOW IT — pull it inside a bubble (phagosome), (4) DIGEST IT — dump acid/enzymes on it (lysosomes). Remember: See, Grab, Swallow, Digest.'},

{id:9,chapter:16,difficulty:'hard',sata:false,trap:true,
stem:'A nurse reviews lab results for a patient with suspected infection. WBC is 7,200/mm³ with the following differential: Segs 45%, Bands 3%, Lymphocytes 42%, Monocytes 6%, Eosinophils 3%, Basophils 1%. Which interpretation is CORRECT?',
options:[
{letter:'A',text:'The normal WBC and low bands rule out any significant infection',correct:false,rationale:'TRAP. While WBC is within normal range and bands are normal, the lymphocyte count is elevated (42%, normal 20-40%). An elevated lymphocyte percentage with low-normal neutrophils suggests a VIRAL infection, not bacterial. Normal WBC does not rule out infection.'},
{letter:'B',text:'The differential suggests a viral infection based on the relative lymphocytosis',correct:true,rationale:'Lymphocytes at 42% (above the typical 20-40% range) with relatively decreased neutrophils (Segs 45%, normal 55-70%) suggests lymphocytosis. Viral infections characteristically cause lymphocyte proliferation because T-lymphocytes are the primary defense against intracellular viral pathogens.'},
{letter:'C',text:'The elevated eosinophils indicate a parasitic infection',correct:false,rationale:'Eosinophils at 3% are within normal range (1-4%). This is not eosinophilia. Parasitic infection would typically show eosinophils well above 4-5%.'},
{letter:'D',text:'The differential is entirely normal and requires no further investigation',correct:false,rationale:'While all values are near normal ranges, the pattern matters. The relative lymphocytosis (42%) with low-normal neutrophils (45%) is a pattern that warrants correlation with clinical symptoms and may indicate viral illness.'}
],vocabTip:'Bacterial infections = neutrophils go UP (with left shift/bands). Viral infections = lymphocytes go UP (because T-cells fight viruses inside cells). Always look at the PATTERN, not just individual numbers. A "normal" WBC with shifted percentages still tells a story.'},

{id:10,chapter:16,difficulty:'medium',sata:false,trap:false,
stem:'The nurse is teaching about the three stages of the inflammatory response. Which description correctly matches the VASCULAR stage?',
options:[
{letter:'A',text:'Neutrophils and macrophages migrate to the injury site and perform phagocytosis',correct:false,rationale:'This describes the CELLULAR stage (stage 2), when white blood cells are recruited to the area and begin destroying pathogens and debris through phagocytosis.'},
{letter:'B',text:'Blood vessels constrict briefly, then dilate; vascular permeability increases allowing plasma to leak into tissues',correct:true,rationale:'The vascular stage (stage 1) begins with brief vasoconstriction followed by vasodilation. Histamine and other mediators increase capillary permeability, allowing plasma proteins, clotting factors, and fluid to move into the interstitial space (causing edema).'},
{letter:'C',text:'New blood vessels form and fibroblasts lay down collagen to repair damaged tissue',correct:false,rationale:'This describes the TISSUE REPAIR stage (stage 3), when the body rebuilds damaged tissue through angiogenesis (new blood vessels) and fibroblast activity (scar/collagen formation).'},
{letter:'D',text:'Antibodies are produced by B-lymphocytes to neutralize specific antigens',correct:false,rationale:'Antibody production is part of the adaptive immune response, not the inflammatory response stages. Inflammation is an innate (nonspecific) response that does not involve antigen-specific antibodies.'}
],vocabTip:'3 stages of inflammation: (1) VASCULAR = blood vessels open up (vasodilation) and get leaky (permeability) so fluid floods the area. (2) CELLULAR = WBCs march in and start eating invaders (phagocytosis). (3) TISSUE REPAIR = construction crew arrives to rebuild with collagen and new blood vessels. Think: Flood, Fight, Fix.'},

// ===== CHAPTER 17: Care of Patients with Allergy and Immunity Conditions =====
{id:11,chapter:17,difficulty:'easy',sata:false,trap:false,
stem:'A patient stung by a bee rapidly develops throat tightness, wheezing, hypotension, and widespread urticaria. The nurse identifies this as a Type I hypersensitivity reaction. Which antibody mediates this response?',
options:[
{letter:'A',text:'IgA',correct:false,rationale:'IgA is found in mucous membranes, saliva, tears, and breast milk. It provides local mucosal immunity but is not the mediator of anaphylaxis.'},
{letter:'B',text:'IgG',correct:false,rationale:'IgG is the most abundant antibody in serum and is involved in Type II and III hypersensitivity reactions, not Type I. It crosses the placenta and provides passive immunity to newborns.'},
{letter:'C',text:'IgE',correct:true,rationale:'IgE is the antibody responsible for Type I (immediate/anaphylactic) hypersensitivity. IgE binds to mast cells and basophils. On re-exposure to the allergen, cross-linking of IgE triggers massive degranulation, releasing histamine and causing anaphylaxis.'},
{letter:'D',text:'IgM',correct:false,rationale:'IgM is the largest antibody and the FIRST produced during an initial immune response. It activates complement but does not mediate Type I hypersensitivity reactions.'}
],vocabTip:'IgE = the "allergy antibody." Think E = Everyone snEEzing. IgE sits on mast cells like a loaded trigger. When the allergen hits, mast cells EXPLODE (degranulate) and dump histamine everywhere. Type I = Immediate = IgE = anaphylaxis, hives, asthma, hay fever.'},

{id:12,chapter:17,difficulty:'medium',sata:false,trap:false,
stem:'A patient receiving a blood transfusion develops fever, chills, flank pain, and dark red urine 15 minutes into the infusion. The nurse recognizes these as signs of which hypersensitivity reaction?',
options:[
{letter:'A',text:'Type I — anaphylactic reaction',correct:false,rationale:'Type I reactions are IgE-mediated and present with urticaria, bronchospasm, and angioedema. Hemolysis (dark urine, flank pain) is NOT characteristic of Type I; it involves mast cell degranulation, not red blood cell destruction.'},
{letter:'B',text:'Type II — cytotoxic reaction',correct:true,rationale:'Type II (cytotoxic) hypersensitivity involves IgG or IgM antibodies binding to antigens on cell surfaces, activating complement and destroying the cells. Transfusion reactions occur when recipient antibodies attack mismatched donor RBCs, causing hemolysis (dark urine from hemoglobin, flank pain from kidney filtration of debris).'},
{letter:'C',text:'Type III — immune complex reaction',correct:false,rationale:'Type III involves antigen-antibody complexes depositing in tissues (joints, kidneys, blood vessels), causing inflammation. It does not cause acute hemolysis during blood transfusion.'},
{letter:'D',text:'Type IV — delayed cell-mediated reaction',correct:false,rationale:'Type IV reactions take 24-72 hours to develop and involve T-cells, not antibodies. They would not cause acute hemolysis within 15 minutes of transfusion.'}
],vocabTip:'Type II = "Cytotoxic" = cells get DESTROYED. The antibodies (IgG/IgM) land on cells and mark them for death. Classic examples: blood transfusion reaction (wrong blood type), hemolytic disease of the newborn (Rh incompatibility), some drug reactions. The "II" looks like two cells bumping into each other.'},

{id:13,chapter:17,difficulty:'medium',sata:false,trap:true,
stem:'A nurse is preparing to administer the first dose of epinephrine to a patient experiencing anaphylaxis. The patient\'s blood pressure is 72/40 mmHg with severe bronchospasm. Which action is MOST appropriate?',
options:[
{letter:'A',text:'Administer epinephrine 0.3-0.5 mg intramuscularly in the vastus lateralis (outer thigh)',correct:true,rationale:'IM epinephrine in the outer thigh (vastus lateralis) is the FIRST-LINE treatment for anaphylaxis. IM injection in this large, well-perfused muscle provides the fastest and most reliable absorption. The anterolateral thigh is preferred over the deltoid.'},
{letter:'B',text:'Administer epinephrine 0.3-0.5 mg subcutaneously in the upper arm',correct:false,rationale:'TRAP. Subcutaneous administration is no longer recommended for anaphylaxis because absorption is too slow and unpredictable, especially in patients with hypotension where peripheral perfusion is compromised. IM is the correct route.'},
{letter:'C',text:'Administer diphenhydramine (Benadryl) IV first, then epinephrine if symptoms persist',correct:false,rationale:'Diphenhydramine is a second-line adjunct. Epinephrine is ALWAYS first in anaphylaxis. Delaying epinephrine to give antihistamines can be fatal. Epi reverses bronchospasm and vasodilation; antihistamines cannot.'},
{letter:'D',text:'Start an IV epinephrine drip at a high dose for immediate effect',correct:false,rationale:'IV epinephrine is reserved for refractory anaphylaxis or cardiac arrest, not first-line treatment. Bolus IV epi in anaphylaxis can cause fatal arrhythmias. IM is the safe and effective first-line route.'}
],vocabTip:'Anaphylaxis priority: EPI FIRST, everything else second. Route = IM (intramuscular), NOT subcutaneous. Location = outer thigh (vastus lateralis) because it has the best blood supply for fast absorption. Dose = 0.3-0.5 mg for adults. Can repeat every 5-15 minutes if needed. ABCs + position flat with legs elevated (unless breathing difficulty).'},

{id:14,chapter:17,difficulty:'easy',sata:false,trap:false,
stem:'A patient with a history of seasonal allergies presents with sneezing, rhinorrhea, itchy watery eyes, and nasal congestion every spring. The nurse documents this as:',
options:[
{letter:'A',text:'Anaphylaxis requiring emergency treatment',correct:false,rationale:'Anaphylaxis is a systemic, life-threatening reaction involving hypotension, airway compromise, and cardiovascular collapse. Seasonal sneezing and runny nose are localized upper airway symptoms, not anaphylaxis.'},
{letter:'B',text:'Allergic rhinitis',correct:true,rationale:'Allergic rhinitis is inflammation of the nasal mucosa caused by inhaled allergens (pollen, dust, mold). It presents with the classic triad: sneezing, rhinorrhea (runny nose), and nasal congestion, plus itchy/watery eyes. It is a localized Type I reaction, not systemic.'},
{letter:'C',text:'Type IV hypersensitivity reaction',correct:false,rationale:'Type IV is a delayed cell-mediated reaction (24-72 hours) involving T-cells. Allergic rhinitis is a Type I (immediate, IgE-mediated) reaction with rapid onset upon allergen exposure.'},
{letter:'D',text:'Angioedema requiring epinephrine',correct:false,rationale:'Angioedema is deep tissue swelling, especially of the face, lips, and tongue. The patient has rhinitis symptoms (sneezing, runny nose), not tissue swelling. Angioedema is a separate condition.'}
],vocabTip:'Allergic rhinitis = "hay fever." It is the MILD, LOCAL version of a Type I reaction. Same IgE mechanism as anaphylaxis but LIMITED to the nose/eyes. Anaphylaxis is when that same reaction goes SYSTEMIC (whole body). Think of rhinitis as a small campfire and anaphylaxis as a wildfire — same spark, vastly different scale.'},

{id:15,chapter:17,difficulty:'hard',sata:true,trap:false,
stem:'A patient is diagnosed with systemic lupus erythematosus (SLE). Which findings does the nurse expect during the initial assessment? (Select all that apply.)',
options:[
{letter:'A',text:'Butterfly-shaped (malar) rash across the cheeks and nose',correct:true,rationale:'The butterfly/malar rash is the hallmark finding of SLE, present in approximately 50% of patients. It spans both cheeks and the bridge of the nose, sparing the nasolabial folds.'},
{letter:'B',text:'Photosensitivity with worsening of symptoms after sun exposure',correct:true,rationale:'UV light triggers lupus flares and worsens the skin rash. Patients are taught strict sun avoidance, use of SPF 30+ sunscreen, and protective clothing. Sun exposure can also trigger systemic flares, not just skin symptoms.'},
{letter:'C',text:'Joint pain and swelling, particularly in the hands and wrists',correct:true,rationale:'Arthralgia and arthritis affect 90% of lupus patients, most commonly in the small joints of the hands and wrists. Unlike RA, lupus arthritis is typically non-erosive (does not destroy bone).'},
{letter:'D',text:'Fixed, non-migratory joint deformities identical to rheumatoid arthritis',correct:false,rationale:'Lupus arthritis is typically non-erosive and non-deforming, unlike RA which causes progressive joint destruction. If deformities occur in lupus (Jaccoud arthropathy), they are reducible, not fixed.'},
{letter:'E',text:'Contact dermatitis rash limited to areas touched by an allergen',correct:false,rationale:'Contact dermatitis is a Type IV hypersensitivity reaction localized to the exposure area. The lupus malar rash is an autoimmune manifestation (Type III), not a contact allergy, and appears in the characteristic butterfly pattern regardless of external contact.'}
],vocabTip:'Lupus (SLE) is the body attacking ITSELF (autoimmune, Type III). The 3 classic findings to remember: (1) Butterfly rash on the face, (2) Joint pain (but unlike RA, does not destroy the joints), (3) Sun makes everything WORSE. Lupus can attack any organ, so symptoms are all over the place — that is why it is called "the great imitator."'},

{id:16,chapter:17,difficulty:'medium',sata:false,trap:false,
stem:'A nurse reads a patient\'s TB skin test (Mantoux test) at 48 hours and documents a 12 mm area of induration. The nurse understands this reaction is classified as which type of hypersensitivity?',
options:[
{letter:'A',text:'Type I — immediate hypersensitivity',correct:false,rationale:'Type I reactions occur within minutes (IgE-mediated). The TB test is read at 48-72 hours because it relies on T-cell migration and cytokine release, which takes time. The delay is the defining feature of Type IV.'},
{letter:'B',text:'Type II — cytotoxic hypersensitivity',correct:false,rationale:'Type II involves antibodies attacking cell-surface antigens (hemolysis, transfusion reactions). The TB test does not involve antibody-mediated cell destruction.'},
{letter:'C',text:'Type III — immune complex hypersensitivity',correct:false,rationale:'Type III involves circulating antigen-antibody complexes depositing in tissues. The TB test reaction is localized T-cell mediated inflammation at the injection site, not immune complex deposition.'},
{letter:'D',text:'Type IV — delayed cell-mediated hypersensitivity',correct:true,rationale:'The TB skin test is the classic example of Type IV (delayed) hypersensitivity. Sensitized T-cells recognize the TB antigen (purified protein derivative), migrate to the injection site, and release cytokines causing induration over 24-72 hours. No antibodies are involved.'}
],vocabTip:'Type IV = DELAYED = T-cells (no antibodies). Read at 48-72 hours because T-cells are slow travelers. Classic examples: TB skin test, contact dermatitis (poison ivy), transplant rejection. Think: "4 is the Floor" — it takes TIME for T-cells to walk to the floor/site. Also: T = Type 4 = T-cells.'},

{id:17,chapter:17,difficulty:'hard',sata:false,trap:true,
stem:'A patient with known severe latex allergy is scheduled for surgery. The nurse is preparing the operating room. Which fruit should the nurse specifically ask about during the preoperative dietary history because of cross-reactivity with latex?',
options:[
{letter:'A',text:'Oranges',correct:false,rationale:'Oranges (citrus fruits) are not commonly cross-reactive with latex. While some patients may have individual sensitivities, citrus is not in the classic latex-fruit syndrome group.'},
{letter:'B',text:'Bananas',correct:true,rationale:'Bananas are one of the most commonly cross-reactive foods with latex allergy (latex-fruit syndrome). Other cross-reactive fruits include avocados, kiwis, and chestnuts. The proteins in these foods share structural similarity with latex proteins, causing cross-reactivity.'},
{letter:'C',text:'Blueberries',correct:false,rationale:'Blueberries are not a recognized cross-reactive food with latex allergy. The classic latex-fruit syndrome foods are bananas, avocados, kiwis, and chestnuts.'},
{letter:'D',text:'Grapes',correct:false,rationale:'TRAP. Grapes are not among the commonly cited cross-reactive foods. Students may confuse random fruits as latex-associated, but the tested cross-reactive foods are specific: Bananas, Avocados, Kiwis, Chestnuts (remember BACK).'}
],vocabTip:'Latex-fruit syndrome: remember BACK — Bananas, Avocados, Chestnuts, Kiwis. These fruits have proteins that look like latex to the immune system, so if you are allergic to latex, eating these can trigger a reaction. Always ask about food allergies in latex-allergic patients before surgery.'},

{id:18,chapter:17,difficulty:'medium',sata:true,trap:false,
stem:'A patient presents to the emergency department with angioedema of the lips and tongue after starting a new ACE inhibitor medication. Which nursing interventions are priorities? (Select all that apply.)',
options:[
{letter:'A',text:'Assess airway patency and prepare for potential intubation',correct:true,rationale:'Angioedema of the lips and tongue can rapidly progress to airway obstruction. Assessing and securing the airway is the TOP priority. Intubation equipment should be at bedside in case swelling compromises the airway.'},
{letter:'B',text:'Administer the next scheduled dose of the ACE inhibitor to build tolerance',correct:false,rationale:'NEVER re-administer the offending drug. ACE inhibitor-induced angioedema is a known adverse effect caused by bradykinin accumulation. The medication must be DISCONTINUED permanently, not given again.'},
{letter:'C',text:'Discontinue the ACE inhibitor and notify the prescriber immediately',correct:true,rationale:'The ACE inhibitor is the most likely cause and must be stopped immediately. ACE inhibitors block the breakdown of bradykinin, which causes vasodilation and increased vascular permeability leading to swelling. The provider must be notified to change the medication.'},
{letter:'D',text:'Monitor oxygen saturation and have emergency airway equipment at bedside',correct:true,rationale:'Continuous pulse oximetry monitors for hypoxia from airway compromise. Emergency airway supplies (crash cart, intubation kit, tracheostomy tray) should be immediately accessible in case the swelling worsens and occludes the airway.'},
{letter:'E',text:'Apply ice packs to the face to reduce the swelling and discharge the patient',correct:false,rationale:'Ice packs will not reverse angioedema, which is caused by vascular permeability from bradykinin or histamine, not simple tissue inflammation. Discharging a patient with tongue/lip angioedema is dangerous — airway obstruction can progress rapidly.'}
],vocabTip:'Angioedema = deep swelling under the skin, especially lips, tongue, and throat. ACE inhibitors (drugs ending in "-pril" like lisinopril) are a common cause because they raise bradykinin levels, which causes swelling. Priority: AIRWAY FIRST (can the patient breathe?), STOP the drug, WATCH closely. This is different from hives — angioedema goes DEEP.'},

{id:19,chapter:17,difficulty:'medium',sata:false,trap:false,
stem:'A nurse is educating a patient newly diagnosed with rheumatoid arthritis (RA) about their condition. Which statement by the patient indicates correct understanding?',
options:[
{letter:'A',text:'"My joint damage is caused by my immune system attacking the synovial membrane in my joints."',correct:true,rationale:'RA is an autoimmune disorder (Type III hypersensitivity) in which the immune system attacks the synovial membrane, causing chronic inflammation (synovitis). Over time, this destroys cartilage and bone within the joint. Understanding the autoimmune mechanism helps patients understand why immunosuppressant medications are used.'},
{letter:'B',text:'"This condition only affects my joints and will not impact any other body systems."',correct:false,rationale:'RA is a SYSTEMIC autoimmune disease. While joints are the primary target, RA can also cause rheumatoid nodules, vasculitis, pericarditis, lung disease, anemia, and eye inflammation (scleritis). It affects the whole body.'},
{letter:'C',text:'"I should exercise vigorously during flare-ups to prevent joint stiffness."',correct:false,rationale:'During acute flares, joints are inflamed and painful. Vigorous exercise during flares can worsen inflammation and joint damage. Rest is recommended during flares, with gentle ROM exercises. Full exercise resumes when the flare subsides.'},
{letter:'D',text:'"My joint damage is caused by normal wear and tear from aging, just like osteoarthritis."',correct:false,rationale:'RA is an AUTOIMMUNE disease (immune system attacks self), completely different from osteoarthritis which is degenerative (wear and tear). RA can occur at any age and involves systemic inflammation, not mechanical breakdown.'}
],vocabTip:'RA vs OA: RA = your immune system is ATTACKING your joints (autoimmune, inflammation). OA = your joints are WEARING OUT (degenerative, mechanical). RA is bilateral and symmetric (both hands, both knees). OA is from use (weight-bearing joints). RA patients wake up STIFF for >30 minutes; OA stiffness goes away quickly.'},

{id:20,chapter:17,difficulty:'hard',sata:false,trap:false,
stem:'A nurse is caring for a patient with a primary immunodeficiency disorder who has frequent, severe respiratory infections. The provider prescribes monthly intravenous immunoglobulin (IVIG) therapy. The patient asks why they need ongoing infusions instead of a one-time treatment. The nurse\'s BEST response is:',
options:[
{letter:'A',text:'"The infused antibodies will teach your immune system to make its own, so eventually you can stop treatment."',correct:false,rationale:'IVIG provides PASSIVE immunity — pre-formed antibodies that do not stimulate the patient\'s own immune system to produce antibodies. The patient\'s B-cells remain dysfunctional. This is a common misconception.'},
{letter:'B',text:'"The infused antibodies are borrowed from donors and break down over time, so you need regular replacement to maintain protection."',correct:true,rationale:'IVIG provides artificial passive immunity: donated antibodies (primarily IgG) that protect against infection. Because these are not produced by the patient\'s own immune system, they have a limited lifespan (IgG half-life ~21 days) and must be replaced regularly. The patient\'s underlying immune deficiency remains.'},
{letter:'C',text:'"Each infusion gives you a different set of antibodies, and you need all of them to be fully protected."',correct:false,rationale:'Each IVIG infusion contains a similar broad spectrum of IgG antibodies pooled from thousands of donors. The need for repeat infusions is due to antibody degradation over time, not because different antibodies are given each time.'},
{letter:'D',text:'"One infusion would be sufficient, but insurance requires monthly visits to verify you still need the medication."',correct:false,rationale:'The need for regular infusions is medically necessary, not driven by insurance requirements. Infused antibodies are catabolized (broken down) by the body over weeks and must be replenished to maintain protective antibody levels.'}
],vocabTip:'IVIG = getting someone else\'s antibodies through an IV. It is PASSIVE immunity (borrowed, not self-made). Like borrowing a friend\'s umbrella — it works great but it is not yours, and eventually it wears out. The patient\'s own immune system is still broken, so they need new "umbrellas" (antibodies) every month because the borrowed ones degrade.'}
];

let answered={};
let selections={};

function _seedHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function _shuffleAllOptions(){if(window.__optsShuffled)return;window.__optsShuffled=true;questions.forEach(function(q){if(!q.options||q.options.length<2)return;var a=q.options.slice();var rnd=mulberry32(_seedHash((typeof EXAM_ID!=='undefined'&&EXAM_ID?EXAM_ID:'q')+'#'+q.id));for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}var L=['A','B','C','D','E','F','G','H'];for(var k=0;k<a.length;k++){a[k].letter=L[k];}q.options=a;});}
function buildQuiz(){_shuffleAllOptions();
const area=document.getElementById('quizArea');
area.innerHTML='';
let currentChapter=0;
const chapterNames={16:'Concepts of Inflammation & Immunity',17:'Allergy & Immunity Conditions'};
questions.forEach((q,idx)=>{
if(q.chapter!==currentChapter){
currentChapter=q.chapter;
const div=document.createElement('div');
div.className='chapter-divider';
div.innerHTML=`<span>Chapter ${currentChapter}: ${chapterNames[currentChapter]}</span>`;
area.appendChild(div);
}
const card=document.createElement('div');
card.className='q-card';
card.id=`qcard-${q.id}`;
const isSata=q.sata===true;
const trapBadge=q.trap?'<span class="badge badge-trap">TRAP</span>':'';
const sataBadge=isSata?'<span class="badge badge-sata">SATA</span>':'';
card.innerHTML=`
<div class="q-top">
<span class="q-num">Q${idx+1}</span>
<span class="badge badge-ch${q.chapter}">Ch ${q.chapter}</span>
${trapBadge}${sataBadge}
</div>
<div class="q-stem">${q.stem}${isSata?'<em>(Select all that apply)</em>':''}</div>
<div class="opts" id="opts-${q.id}">
${q.options.map(o=>`
<div class="opt" id="opt-${q.id}-${o.letter}" onclick="toggleOpt(${q.id},'${o.letter}',${isSata})">
<span class="opt-letter">${o.letter}.</span>
<div><span class="opt-text">${o.text}</span><div class="opt-rationale" id="rat-${q.id}-${o.letter}">${o.rationale}</div></div>
</div>`).join('')}
</div>
<button class="btn-submit" id="btn-${q.id}" onclick="submitQ(${q.id})">Submit Answer</button>
<div class="vocab-tip" id="tip-${q.id}"><strong>Vocab Tip:</strong> ${q.vocabTip}</div>
${q.trap?`<div class="trap-callout" id="trap-${q.id}">&#9888; TRAP QUESTION: This question tests a common misconception. Read the rationale carefully!</div>`:''}
`;
area.appendChild(card);
});
loadState();
}

function toggleOpt(qId,letter,isSata){
if(answered[qId])return;
if(!selections[qId])selections[qId]=[];
if(isSata){
const idx=selections[qId].indexOf(letter);
if(idx>-1)selections[qId].splice(idx,1);
else selections[qId].push(letter);
}else{
selections[qId]=[letter];
}
const q=questions.find(x=>x.id===qId);
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.classList.toggle('selected',selections[qId].includes(o.letter));
});
}

function submitQ(qId){
if(answered[qId])return;
if(!selections[qId]||selections[qId].length===0)return;
answered[qId]=true;
const q=questions.find(x=>x.id===qId);
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const isCorrect=correctLetters.length===selections[qId].length&&correctLetters.every(l=>selections[qId].includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.style.cursor='default';
if(o.correct)el.classList.add('correct-show');
else if(selections[qId].includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
document.getElementById(`btn-${qId}`).disabled=true;
document.getElementById(`btn-${qId}`).textContent=isCorrect?'Correct!':'Incorrect';
updateProgress();
saveState();
if(Object.keys(answered).length===questions.length)showScore();
}

function updateProgress(){
const pct=(Object.keys(answered).length/questions.length)*100;
document.getElementById('progressBar').style.width=pct+'%';
}

function showScore(){
const chScores={16:0,17:0};
const chTotals={16:0,17:0};
const chNames={16:'Ch 16 Inflammation',17:'Ch 17 Allergy/Immunity'};
const chColors={16:'#f472b6',17:'#c084fc'};
questions.forEach(q=>{
chTotals[q.chapter]++;
if(answered[q.id]){
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[q.id]||[];
if(correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l)))chScores[q.chapter]++;
}
});
let totalCorrect=0,totalQ=0;
[16,17].forEach(ch=>{totalCorrect+=chScores[ch];totalQ+=chTotals[ch];});
const pct=Math.round((totalCorrect/totalQ)*100);
document.getElementById('finalScore').textContent=pct+'%';
document.getElementById('finalText').textContent=`${totalCorrect} of ${totalQ} correct`;
const bd=document.getElementById('chapterBreakdown');
bd.innerHTML='';
[16,17].forEach(ch=>{
const box=document.createElement('div');
box.className='ch-box';
box.innerHTML=`<div class="ch-label">${chNames[ch]}</div><div class="ch-score" style="color:${chColors[ch]}">${chScores[ch]}/${chTotals[ch]}</div>`;
bd.appendChild(box);
});
document.getElementById('scoreCard').style.display='block';
document.getElementById('scoreCard').scrollIntoView({behavior:'smooth'});
const record={score:pct,correct:totalCorrect,total:totalQ,date:new Date().toLocaleDateString(),chapters:{16:{correct:chScores[16],total:chTotals[16]},17:{correct:chScores[17],total:chTotals[17]}}};
localStorage.setItem(EXAM_ID+'-last',JSON.stringify(record));
localStorage.setItem(EXAM_ID+'-label',EXAM_LABEL);
const hist=JSON.parse(localStorage.getItem('examHistory')||'[]');
hist.push({examId:EXAM_ID,examLabel:EXAM_LABEL,date:new Date().toISOString(),score:pct,correct:totalCorrect,total:totalQ,topicBreakdown:{16:{correct:chScores[16],total:chTotals[16]},17:{correct:chScores[17],total:chTotals[17]}}});
localStorage.setItem('examHistory',JSON.stringify(hist.slice(-20)));
}

function restartQuiz(){
answered={};
selections={};
localStorage.removeItem(EXAM_ID+'-state');
document.getElementById('scoreCard').style.display='none';
buildQuiz();
}

function saveState(){
localStorage.setItem(EXAM_ID+'-state',JSON.stringify({answered,selections}));
}

function loadState(){
const saved=localStorage.getItem(EXAM_ID+'-state');
if(saved){
const state=JSON.parse(saved);
answered=state.answered||{};
selections=state.selections||{};
Object.keys(answered).forEach(qId=>{
const q=questions.find(x=>x.id==qId);
if(!q)return;
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[qId]||[];
const isCorrect=correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
if(sel.includes(o.letter))el.classList.add('selected');
if(o.correct)el.classList.add('correct-show');
else if(sel.includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
el.style.cursor='default';
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
const btn=document.getElementById(`btn-${qId}`);
btn.disabled=true;
btn.textContent=isCorrect?'Correct!':'Incorrect';
});
updateProgress();
if(Object.keys(answered).length===questions.length)showScore();
}
const last=localStorage.getItem(EXAM_ID+'-last');
if(last){
const r=JSON.parse(last);
document.getElementById('lastAttempt').style.display='block';
document.getElementById('lastScore').textContent=r.score+'%';
document.getElementById('lastDate').textContent=r.date;
}
}

buildQuiz();
</script>
<script src="encourage.js"></script>
</body>
