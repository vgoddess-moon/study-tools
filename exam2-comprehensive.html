<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Comprehensive Exam — MS1 Exam 2</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0f14;color:#e2e8f0;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;padding:20px 16px 80px}
.wrap{max-width:640px;margin:0 auto}
h1{font-family:'DM Serif Display',serif;font-size:1.8rem;margin-bottom:4px;background:linear-gradient(135deg,#818cf8,#c084fc,#e09a3a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:#64748b;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.exam-info{background:#13181f;border:1px solid #1e293b;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:.8rem;color:#94a3b8;line-height:1.6}
.exam-info strong{color:#c084fc}
.progress-bar{background:#1e293b;border-radius:99px;height:6px;margin-bottom:20px;overflow:hidden;position:sticky;top:0;z-index:10}
.progress-fill{background:linear-gradient(90deg,#818cf8,#c084fc);height:100%;border-radius:99px;transition:width .4s}
.q-card{background:#13181f;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:16px;transition:.2s}
.q-card.correct{border-color:#22c55e;background:#0d1f14}
.q-card.incorrect{border-color:#ef4444;background:#1f0d0d}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.q-num{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;letter-spacing:.1em}
.badge{font-family:'IBM Plex Mono',monospace;font-size:.55rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:8px}
.badge-ch10{background:#451a03;color:#fb923c}.badge-ch11{background:#0c1e3a;color:#7dd3fc}
.badge-ch12{background:#2a0a0a;color:#fca5a5}.badge-ch13{background:#1a0a2e;color:#c084fc}
.badge-ch14{background:#1e1b4b;color:#a5b4fc}.badge-ch15{background:#0a2e1a;color:#6ee7b7}
.badge-trap{background:#2a1f00;color:#fbbf24}
.sata-tag{font-family:'IBM Plex Mono',monospace;font-size:.55rem;background:#312e81;color:#a5b4fc;padding:2px 7px;border-radius:6px}
.q-text{font-size:.92rem;line-height:1.6;margin-bottom:14px;color:#f1f5f9}
.diagram-box{background:#0c0f14;border:1px solid #1e293b;border-radius:12px;padding:12px;margin-bottom:14px;text-align:center;overflow-x:auto}
.diagram-box svg{max-width:100%;height:auto}
.diagram-label{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.option{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid #1e293b;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s;background:transparent}
.option:hover:not(:disabled){border-color:#334155;background:#111827}
.option.selected{border-color:#6366f1;background:#1a1f3a}
.option.correct-ans{border-color:#22c55e !important;background:#0d1f14 !important}
.option.wrong-ans{border-color:#ef4444 !important;background:#1f0d0d !important}
.option-letter{font-family:'IBM Plex Mono',monospace;font-size:.7rem;font-weight:700;color:#6366f1;min-width:18px;margin-top:1px}
.option-text{font-size:.85rem;line-height:1.5;color:#cbd5e1}
.submit-btn{width:100%;padding:12px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:4px;transition:.2s}
.submit-btn.ready{background:#6366f1;color:#fff}.submit-btn.ready:hover{background:#818cf8}
.submit-btn:disabled{background:#1e293b;color:#475569;cursor:not-allowed}
.rationale-box{margin-top:12px;padding:12px 14px;background:#0f1318;border-radius:12px;border:1px solid #1e293b}
.rationale-title{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.rationale-text{font-size:.82rem;color:#94a3b8;line-height:1.6}
.option-rationale{margin-top:6px;padding:8px 10px;border-radius:8px;font-size:.78rem;line-height:1.5}
.option-rationale.r-correct{background:#0d1f14;border-left:2px solid #22c55e;color:#86efac}
.option-rationale.r-wrong{background:#1f0d0d;border-left:2px solid #ef4444;color:#fca5a5}
.trap-call{background:#2a1f00;border:1px solid #3d2e00;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.78rem;color:#fbbf24;line-height:1.5}
.trap-icon{font-size:.9rem;margin-right:4px}
.vocab-tip{background:#1e1b4b;border:1px solid #312e81;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.78rem;color:#c4b5fd;line-height:1.5}
.vocab-tip strong{color:#e9d5ff}
.score-card{background:#13181f;border:1px solid #1e293b;border-radius:20px;padding:28px;text-align:center;margin-top:20px;display:none}
.score-big{font-family:'DM Serif Display',serif;font-size:3.5rem;margin-bottom:4px}
.score-pct{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:#64748b;margin-bottom:20px}
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.score-cell{background:#0c0f14;border-radius:12px;padding:12px}
.score-cell-label{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.score-cell-val{font-size:1.1rem;font-weight:700;color:#f1f5f9}
.weak-list{text-align:left;background:#0c0f14;border-radius:12px;padding:16px;margin-bottom:16px}
.weak-item{font-size:.82rem;color:#94a3b8;padding:5px 0;border-bottom:1px solid #1e293b;line-height:1.5}
.restart-btn{width:100%;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:8px}
.restart-btn:hover{background:#818cf8}
.sticky-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#0c0f14 30%);padding:16px 16px 20px;z-index:20}
.sticky-inner{max-width:640px;margin:0 auto}
#lastAttempt{display:none;background:#13181f;border:1px solid #1e293b;border-radius:14px;padding:14px 18px;margin-bottom:14px}
.chapter-divider{font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;letter-spacing:.15em;text-transform:uppercase;margin:24px 0 12px;padding:8px 0;border-top:1px solid #1e293b}
</style>
</head>

    vocabTip:'RED = immediate = life-threatening but SALVAGEABLE with intervention. This patient has a pneumothorax (sucking chest wound) — will die without treatment but CAN be saved with an occlusive dressing and chest tube. That makes them RED, not BLACK.',
    options:[
      {l:'A', t:'RED — Immediate: life-threatening, salvageable with intervention', correct:true, rationale:'CORRECT. Sucking chest wound + breathing + pulse present = life-threatening but treatable. An occlusive dressing can stabilize this patient. They go to RED.'},
      {l:'B', t:'YELLOW — Delayed: serious but can wait', correct:false, rationale:'A sucking chest wound cannot wait. Without an occlusive dressing, this patient will develop tension pneumothorax and die. This is an IMMEDIATE (RED) priority.'},
      {l:'C', t:'BLACK — Expectant: not expected to survive', correct:false, rationale:'This patient IS salvageable. They are breathing, have a pulse, and are following commands. A sucking chest wound is a TREATABLE life threat.'},
      {l:'D', t:'GREEN — Minor: walking wounded', correct:false, rationale:'A patient with a sucking chest wound is NOT minor. They have a life-threatening injury requiring immediate intervention.'},
    ]
  },
  {
    id:12, ch:'Ch 12', topic:'Hemorrhage', badge:'ch12', type:'single',
    text:'A trauma patient has an estimated blood loss of 1,500 mL (Class III hemorrhage). Vital signs: HR 124, BP 86/58, RR 32, anxious and confused. Which IV fluid does the nurse anticipate administering FIRST?',
    vocabTip:'Class III hemorrhage = 30-40% blood volume lost. Signs: tachycardia >120, hypotension, confusion, tachypnea >30. First-line fluid: isotonic crystalloid (NS or LR). Blood products (PRBCs) follow if no improvement after 2L crystalloid. Massive transfusion protocol if ongoing hemorrhage.',
    options:[
      {l:'A', t:'Lactated Ringer\'s (LR) or Normal Saline (NS) — isotonic crystalloid bolus', correct:true, rationale:'CORRECT. Isotonic crystalloids (LR or NS) are the first-line fluid for hemorrhagic shock. Rapidly expand intravascular volume. Give 1-2L bolus, then reassess.'},
      {l:'B', t:'D5W (5% dextrose in water) — to restore glucose and volume', correct:false, rationale:'D5W is a HYPOtonic solution once the dextrose is metabolized. It will shift into cells, NOT stay in the vascular space. Useless for volume resuscitation.'},
      {l:'C', t:'Albumin 25% — the most effective volume expander', correct:false, rationale:'Albumin is a colloid but is not first-line for hemorrhagic shock. Crystalloids are given first. Albumin may be considered later but does not replace blood loss effectively.'},
      {l:'D', t:'3% hypertonic saline — to pull fluid into the vascular space', correct:false, rationale:'3% saline is reserved for severe hyponatremia with neuro symptoms. It is NOT used for volume resuscitation in hemorrhagic shock.'},
    ]
  },
  {
    id:13, ch:'Ch 12', topic:'Shock', badge:'ch12', type:'sata',
    text:'A nurse is caring for a patient in septic shock. Which assessment findings are characteristic of the EARLY (warm/hyperdynamic) phase of septic shock? Select all that apply.',
    vocabTip:'Septic shock has TWO phases. EARLY/warm = vasodilation → warm flushed skin, bounding pulse, hypotension, fever, tachycardia. LATE/cold = decompensation → cool clammy skin, weak pulse, organ failure. The "warm" phase is counterintuitive — the patient looks pink but is dying.',
    options:[
      {l:'A', t:'Warm, flushed skin', correct:true, rationale:'CORRECT. Early septic shock causes massive vasodilation. Blood vessels dilate → skin becomes warm, pink, and flushed. This is the "warm shock" phase.'},
      {l:'B', t:'Bounding pulse', correct:true, rationale:'CORRECT. The heart compensates for vasodilation by increasing cardiac output, producing a strong, bounding pulse. This is the hyperdynamic phase.'},
      {l:'C', t:'Fever and tachycardia', correct:true, rationale:'CORRECT. The inflammatory/infectious process causes fever. Tachycardia is a compensatory mechanism for the drop in peripheral vascular resistance.'},
      {l:'D', t:'Cool, clammy skin with weak pulse', correct:false, rationale:'Cool, clammy skin = LATE/COLD septic shock. This is the decompensated phase when the body can no longer maintain cardiac output. This is a later, more ominous sign.'},
      {l:'E', t:'Decreased urine output to less than 5 mL/hr', correct:false, rationale:'While oliguria can occur in septic shock, severely decreased urine output is more characteristic of the LATE/decompensated phase when organs are failing.'},
    ]
  },
  {
    id:14, ch:'Ch 12', topic:'Primary Survey', badge:'ch12', type:'single',
    text:'A motorcycle crash victim arrives at the trauma bay. The nurse performs the primary survey (ABCDE). In what order should the nurse assess?',
    vocabTip:'Primary Survey = ABCDE: Airway (with cervical spine stabilization), Breathing, Circulation, Disability (neuro/LOC), Exposure (undress and examine). This is NOT optional — it must be done in this EXACT order. Fix each problem before moving to the next letter.',
    options:[
      {l:'A', t:'Airway → Breathing → Circulation → Disability → Exposure', correct:true, rationale:'CORRECT. ABCDE is performed in this exact order. Airway is always first (with C-spine precaution). You fix each life threat before moving on. An airway problem kills faster than a circulation problem.'},
      {l:'B', t:'Circulation → Airway → Breathing → Disability → Exposure', correct:false, rationale:'Circulation is C, not first. If the patient can\'t breathe, controlling bleeding doesn\'t matter. Airway always comes first.'},
      {l:'C', t:'Breathing → Circulation → Airway → Exposure → Disability', correct:false, rationale:'Airway must come before breathing. You cannot assess breathing if the airway is blocked. The sequence is always A-B-C-D-E.'},
      {l:'D', t:'Disability → Airway → Breathing → Circulation → Exposure', correct:false, rationale:'Neurologic assessment (Disability) is D — it comes AFTER life-threatening ABC problems are addressed.'},
    ]
  },
  {
    id:15, ch:'Ch 12', topic:'Tourniquet Use', badge:'ch12', type:'single', trap:true,
    text:'A nurse applies a tourniquet to a patient\'s mangled right arm with uncontrolled arterial bleeding in the field. Which action is correct regarding tourniquet management?',
    vocabTip:'Tourniquet rules: Apply 2-3 inches ABOVE the wound (never on a joint). Write the TIME of application on the tourniquet or the patient\'s forehead. Once applied, do NOT loosen or release in the field — releasing can cause reperfusion injury and lethal hyperkalemia.',
    options:[
      {l:'A', t:'Loosen the tourniquet every 15-20 minutes to allow blood flow', correct:false, rationale:'TRAP: This used to be taught but is NO LONGER recommended. Releasing a tourniquet can cause a sudden surge of potassium (from dying tissue) into the bloodstream, leading to fatal cardiac arrhythmia.'},
      {l:'B', t:'Note the time of application and do NOT release until definitive surgical care', correct:true, rationale:'CORRECT. Document the time (write it on the tourniquet). Do not release in the field. Modern evidence shows tourniquets can stay in place for hours. Removal should only happen in a facility prepared to manage reperfusion.'},
      {l:'C', t:'Apply the tourniquet directly over the wound site for maximum pressure', correct:false, rationale:'The tourniquet goes 2-3 inches ABOVE the wound (proximal/closer to the heart), not directly on it. Placing it on the wound won\'t occlude the artery effectively.'},
      {l:'D', t:'Remove the tourniquet once bleeding slows to a trickle', correct:false, rationale:'Reduced bleeding doesn\'t mean the vessel is repaired. Removing the tourniquet will likely restart hemorrhage. Only remove in a surgical setting.'},
    ]
  },

  // ============ CH 13: FLUIDS & ELECTROLYTES ============
  {
    id:16, ch:'Ch 13', topic:'Sodium Imbalance', badge:'ch13', type:'single',
    diagram: SVG_ELECTROLYTES,
    text:'A patient with SIADH (syndrome of inappropriate antidiuretic hormone) has a serum sodium of 122 mEq/L. The nurse understands that this patient is experiencing:',
    vocabTip:'SIADH = too much ADH → kidneys retain too much WATER → dilutes sodium → hyponatremia. Think: "SIADH = Swimming In A Diluted H2O." The problem is TOO MUCH WATER, not too little sodium. Treatment: fluid restriction (stop the dilution), NOT sodium supplementation usually.',
    options:[
      {l:'A', t:'Hyponatremia due to water retention diluting the sodium', correct:true, rationale:'CORRECT. SIADH causes the kidneys to retain excessive water, diluting serum sodium. Na+ 122 is dangerously low (normal 135-145). This is dilutional hyponatremia — the total body sodium may be normal, but the water volume is too high.'},
      {l:'B', t:'Hypernatremia due to sodium wasting in the urine', correct:false, rationale:'SIADH causes hypoNatremia, not hypernatremia. The problem is water retention, not sodium loss.'},
      {l:'C', t:'Dehydration requiring aggressive IV fluid replacement', correct:false, rationale:'The OPPOSITE is true. SIADH patients are fluid OVERLOADED. Giving more fluid would further dilute sodium and worsen the problem. Treatment is fluid RESTRICTION.'},
      {l:'D', t:'Hyperkalemia requiring cardiac monitoring', correct:false, rationale:'SIADH primarily affects sodium and water balance. While electrolytes can be disrupted, the primary derangement is hyponatremia, not hyperkalemia.'},
    ]
  },
  {
    id:17, ch:'Ch 13', topic:'Potassium Imbalance', badge:'ch13', type:'single',
    text:'A patient\'s potassium level is 6.2 mEq/L. The ECG shows tall, peaked T waves. Which medication should the nurse anticipate administering FIRST?',
    vocabTip:'Hyperkalemia emergency ladder: 1) Calcium gluconate (protect the heart NOW — stabilizes cardiac membranes). 2) Insulin + D50 (drives K+ INTO cells). 3) Sodium bicarb (drives K+ into cells). 4) Kayexalate/Lokelma (removes K+ from body). Calcium doesn\'t lower K+ — it buys time.',
    options:[
      {l:'A', t:'Kayexalate (sodium polystyrene) to remove potassium from the body', correct:false, rationale:'Kayexalate removes potassium via the GI tract but takes HOURS to work. With ECG changes, you need to protect the heart immediately. Kayexalate comes later.'},
      {l:'B', t:'IV calcium gluconate to stabilize the cardiac membrane', correct:true, rationale:'CORRECT. With ECG changes (peaked T waves), the heart is at risk for lethal arrhythmias. IV calcium gluconate acts within MINUTES to stabilize the myocardium. It does NOT lower K+ — it buys time while other treatments work.'},
      {l:'C', t:'Regular insulin with D50 to shift potassium into cells', correct:false, rationale:'Insulin + dextrose IS part of the treatment (shifts K+ intracellularly), but calcium gluconate comes FIRST because the ECG changes indicate immediate cardiac risk. Stabilize the heart first.'},
      {l:'D', t:'Furosemide (Lasix) IV push to excrete potassium renally', correct:false, rationale:'Loop diuretics can help excrete K+ but take time to work and require adequate kidney function. Not the first-line intervention when ECG changes are present.'},
    ]
  },
  {
    id:18, ch:'Ch 13', topic:'IV Fluid Tonicity', badge:'ch13', type:'single',
    text:'A nurse is administering 0.45% NaCl (half-normal saline) to a dehydrated patient. The nurse understands this is classified as what type of solution?',
    vocabTip:'IV fluid tonicity compared to blood: Isotonic (same concentration) = 0.9% NS, LR. Hypotonic (lower concentration) = 0.45% NS, D5W (after dextrose metabolized). Hypertonic (higher concentration) = 3% NS, D10W, D5NS. Hypotonic moves water INTO cells. Hypertonic pulls water OUT of cells.',
    options:[
      {l:'A', t:'Isotonic — same concentration as blood plasma', correct:false, rationale:'0.9% NS (normal saline) is isotonic. 0.45% is HALF that concentration, making it hypotonic.'},
      {l:'B', t:'Hypotonic — lower concentration than blood, water moves into cells', correct:true, rationale:'CORRECT. 0.45% NaCl is hypotonic. It has a lower osmolality than blood, so water moves by osmosis from the IV fluid INTO cells. Used for cellular dehydration.'},
      {l:'C', t:'Hypertonic — higher concentration, pulls water from cells', correct:false, rationale:'Hypertonic solutions (like 3% NaCl) have higher concentration than blood. 0.45% is below blood concentration, making it hypotonic.'},
      {l:'D', t:'Colloid — contains large protein molecules that stay intravascular', correct:false, rationale:'Colloids contain proteins (albumin, dextran). NaCl solutions are crystalloids, regardless of their concentration.'},
    ]
  },
  {
    id:19, ch:'Ch 13', topic:'Calcium Imbalance', badge:'ch13', type:'sata',
    text:'A patient with hypocalcemia (Ca2+ 7.0 mg/dL) is being assessed by the nurse. Which clinical findings does the nurse expect? Select all that apply.',
    vocabTip:'Hypocalcemia = too little calcium = nerves become HYPEREXCITABLE. Signs: Trousseau (BP cuff → hand spasm), Chvostek (tap face → twitch), tetany, seizures, prolonged QT. Think: "Low calcium = muscles go CRAZY." Trousseau\'s = Trousers (BP cuff on arm), Chvostek = Cheek (tap the face).',
    options:[
      {l:'A', t:'Positive Trousseau\'s sign (carpopedal spasm with BP cuff)', correct:true, rationale:'CORRECT. Inflating BP cuff causes ischemia → hypocalcemic nerves fire spontaneously → hand/wrist spasm (carpopedal spasm). Classic sign of hypocalcemia.'},
      {l:'B', t:'Positive Chvostek\'s sign (facial twitch when tapping cheek)', correct:true, rationale:'CORRECT. Tapping over the facial nerve (CN VII) near the ear causes facial twitching in hypocalcemic patients. The nerve is hyperexcitable due to low calcium.'},
      {l:'C', t:'Numbness and tingling around the mouth and fingers', correct:true, rationale:'CORRECT. Perioral and fingertip paresthesias are often the EARLIEST symptom of hypocalcemia. The sensory nerves become hyperexcitable.'},
      {l:'D', t:'Muscle weakness and hyporeflexia', correct:false, rationale:'Hyporeflexia and muscle weakness are signs of HYPERCALCEMIA (too much calcium dampens nerve transmission). HypOcalcemia causes HYPERreflexia and muscle spasms.'},
    ]
  },
  {
    id:20, ch:'Ch 13', topic:'Fluid Volume', badge:'ch13', type:'single',
    text:'A nurse assessing a patient with heart failure notes jugular vein distention (JVD), crackles in both lung bases, and 3+ pitting edema in the ankles. The nurse recognizes these as signs of:',
    vocabTip:'Fluid Volume Excess (FVE) / Hypervolemia: JVD = fluid backing up into the venous system. Crackles = fluid in the lungs. Edema = fluid leaking into tissues. Weight gain is the MOST ACCURATE indicator — 1 liter of fluid = 2.2 lbs gained. Monitor daily weights, same time, same scale.',
    options:[
      {l:'A', t:'Fluid volume excess (hypervolemia)', correct:true, rationale:'CORRECT. JVD + crackles + edema = classic triad of fluid overload. The heart is failing as a pump, causing fluid to back up into the lungs (crackles) and venous system (JVD, edema).'},
      {l:'B', t:'Fluid volume deficit (hypovolemia)', correct:false, rationale:'Hypovolemia causes the OPPOSITE: flat neck veins, dry mucous membranes, poor skin turgor, concentrated urine. This patient has TOO MUCH fluid.'},
      {l:'C', t:'Third-spacing requiring albumin infusion', correct:false, rationale:'While third-spacing involves fluid shifts, the clinical picture of JVD + crackles + edema in a heart failure patient is classic fluid overload, not primarily a third-spacing problem.'},
      {l:'D', t:'Electrolyte imbalance requiring potassium replacement', correct:false, rationale:'While electrolyte imbalances may coexist, the assessment findings described are specifically indicative of fluid volume excess, not an isolated electrolyte problem.'},
    ]
  },

  // ============ CH 14: ACID-BASE BALANCE ============
  {
    id:21, ch:'Ch 14', topic:'ABG Interpretation', badge:'ch14', type:'single',
    diagram: SVG_ABG_REF,
    text:'A patient with COPD presents with the following ABG values: pH 7.33, PaCO2 55 mmHg, HCO3 30 mEq/L. The nurse interprets this as:',
    vocabTip:'Use ROME: pH 7.33 = acidosis. PaCO2 55 = high (respiratory moves OPPOSITE to pH → respiratory cause). HCO3 30 = high (metabolic moves EQUAL to pH → this should be low for metabolic acidosis, but it\'s high = kidneys compensating). Both systems abnormal + pH still abnormal = PARTIALLY compensated.',
    options:[
      {l:'A', t:'Fully compensated respiratory acidosis', correct:false, rationale:'If fully compensated, the pH would be within normal range (7.35-7.45). This patient\'s pH is 7.33 — still below normal. It is PARTIALLY compensated.'},
      {l:'B', t:'Partially compensated respiratory acidosis', correct:true, rationale:'CORRECT. pH 7.33 = acidotic. PaCO2 55 = high (respiratory system is the CAUSE — ROME: opposite direction from pH). HCO3 30 = high (kidneys are compensating by retaining bicarb). Both systems abnormal + pH still off = partial compensation.'},
      {l:'C', t:'Uncompensated metabolic acidosis', correct:false, rationale:'If this were metabolic acidosis, the HCO3 would be LOW (equal direction to pH in ROME). HCO3 is 30 (high), meaning it\'s compensating, not causing. The PaCO2 is the problem.'},
      {l:'D', t:'Partially compensated metabolic alkalosis', correct:false, rationale:'The pH is acidotic (7.33), not alkalotic. Alkalosis would require pH above 7.45.'},
    ]
  },
  {
    id:22, ch:'Ch 14', topic:'Respiratory Alkalosis', badge:'ch14', type:'single',
    text:'A 22-year-old patient in the ED is hyperventilating due to a panic attack. ABG shows: pH 7.52, PaCO2 28 mmHg, HCO3 24 mEq/L. What is the priority nursing intervention?',
    vocabTip:'Hyperventilation → blows off too much CO2 → PaCO2 drops → pH rises → respiratory alkalosis. HCO3 is normal (24) = uncompensated (kidneys haven\'t had time to respond). Treatment: slow breathing to retain CO2. Do NOT use a paper bag — can cause dangerous hypoxia.',
    options:[
      {l:'A', t:'Have the patient rebreathe into a paper bag', correct:false, rationale:'Paper bag rebreathing is NO LONGER recommended. It can cause dangerous hypoxia, especially if the hyperventilation has an underlying medical cause (PE, asthma, MI). It also cannot be monitored.'},
      {l:'B', t:'Coach the patient to slow their breathing and provide a calm environment', correct:true, rationale:'CORRECT. Coaching slow, controlled breathing reduces CO2 loss and allows PaCO2 to normalize. Address the underlying anxiety. This is safe and effective.'},
      {l:'C', t:'Administer sodium bicarbonate IV to raise the CO2', correct:false, rationale:'Bicarb would WORSEN the alkalosis. The patient already has a high pH. Bicarb is a BASE — never give a base to a patient in alkalosis.'},
      {l:'D', t:'Prepare for intubation to control the respiratory rate', correct:false, rationale:'Intubation for a panic attack is disproportionate and unnecessary. Coach breathing first, consider anxiolytics if needed. Reserve intubation for respiratory failure.'},
    ]
  },
  {
    id:23, ch:'Ch 14', topic:'Metabolic Acidosis', badge:'ch14', type:'single',
    text:'A patient with uncontrolled diabetes presents with blood glucose 480 mg/dL, fruity breath odor, and Kussmaul respirations. ABGs: pH 7.18, PaCO2 22, HCO3 10. Which condition does the nurse suspect?',
    vocabTip:'DKA triad: hyperglycemia + ketones (fruity breath) + metabolic acidosis. Kussmaul respirations = deep, rapid breathing = the lungs trying to compensate for metabolic acidosis by blowing off CO2. The PaCO2 of 22 (low) shows the lungs ARE compensating, but pH is still very low = partial compensation.',
    options:[
      {l:'A', t:'Diabetic ketoacidosis (DKA)', correct:true, rationale:'CORRECT. High glucose (480) + fruity breath (ketones) + Kussmaul respirations + metabolic acidosis (low pH, low HCO3) = classic DKA. The body is burning fat for fuel → producing ketoacids → metabolic acidosis.'},
      {l:'B', t:'Hyperosmolar hyperglycemic syndrome (HHS)', correct:false, rationale:'HHS has very high glucose (often >600) but WITHOUT significant ketoacidosis. This patient has clear acidosis (pH 7.18) and ketones (fruity breath), pointing to DKA.'},
      {l:'C', t:'Respiratory alkalosis from hyperventilation', correct:false, rationale:'The Kussmaul breathing is COMPENSATORY, not the primary problem. The pH is 7.18 (severely acidotic), and HCO3 is 10 (the metabolic cause). The lungs are trying to help by lowering CO2.'},
      {l:'D', t:'Lactic acidosis from septic shock', correct:false, rationale:'While lactic acidosis also causes metabolic acidosis, the clinical picture (high glucose + fruity breath + diabetic history) is classic DKA, not sepsis.'},
    ]
  },
  {
    id:24, ch:'Ch 14', topic:'Compensation', badge:'ch14', type:'sata',
    text:'The nurse is reviewing ABG results: pH 7.36, PaCO2 60, HCO3 34. Which statements about this ABG are correct? Select all that apply.',
    vocabTip:'Step-by-step: pH 7.36 = normal (but on the low/acidic side). PaCO2 60 = HIGH (respiratory acidosis). HCO3 34 = HIGH (metabolic alkalosis). Both are abnormal, but pH is normal → FULLY COMPENSATED. The pH is on the acidic side of normal → the PRIMARY problem is respiratory acidosis (the system that matches the pH direction).',
    options:[
      {l:'A', t:'The primary disorder is respiratory acidosis', correct:true, rationale:'CORRECT. When fully compensated, look at which SIDE of 7.40 the pH falls. pH 7.36 leans acidic. PaCO2 is high (acid from respiratory). The respiratory system is the primary problem.'},
      {l:'B', t:'The kidneys have fully compensated by retaining bicarbonate', correct:true, rationale:'CORRECT. HCO3 34 (elevated) shows the kidneys are retaining bicarb to buffer the respiratory acid. Since the pH is back to normal range, compensation is COMPLETE.'},
      {l:'C', t:'This is uncompensated respiratory alkalosis', correct:false, rationale:'PaCO2 is HIGH (60), which causes acidosis, not alkalosis. And both systems are abnormal with a normal pH, so it is FULLY compensated, not uncompensated.'},
      {l:'D', t:'The pH is normal, indicating full compensation', correct:true, rationale:'CORRECT. pH 7.36 is within normal range (7.35-7.45). Both PaCO2 and HCO3 are abnormal. Normal pH + two abnormal values = fully compensated.'},
    ]
  },
  {
    id:25, ch:'Ch 14', topic:'ABG Clinical Application', badge:'ch14', type:'single',
    text:'A postoperative patient has been taking shallow breaths due to incisional pain. The nurse anticipates which acid-base imbalance?',
    vocabTip:'Shallow breathing (hypoventilation) → not blowing off enough CO2 → CO2 builds up → PaCO2 rises → pH drops → respiratory ACIDOSIS. Common causes: post-op pain, opioid overdose, COPD, sedation. Treatment: incentive spirometry, pain management (so patient can breathe deeply), not just more morphine.',
    options:[
      {l:'A', t:'Respiratory acidosis from CO2 retention due to hypoventilation', correct:true, rationale:'CORRECT. Shallow breathing = inadequate CO2 removal = CO2 accumulates = respiratory acidosis. Post-op pain is a classic cause. Treatment: adequate pain control + incentive spirometry to encourage deep breathing.'},
      {l:'B', t:'Respiratory alkalosis from hyperventilation', correct:false, rationale:'Hyperventilation LOWERS CO2, causing alkalosis. This patient is hypoventilating (shallow breaths), which does the opposite — retains CO2.'},
      {l:'C', t:'Metabolic acidosis from tissue hypoxia', correct:false, rationale:'While prolonged hypoventilation could eventually cause tissue hypoxia and lactic acidosis, the primary and immediate imbalance from shallow breathing is RESPIRATORY acidosis.'},
      {l:'D', t:'Metabolic alkalosis from vomiting', correct:false, rationale:'There is no mention of vomiting. Metabolic alkalosis from vomiting is a separate entity caused by loss of HCl from the stomach.'},
    ]
  },

  // ============ CH 15: INFUSION THERAPY ============
  {
    id:26, ch:'Ch 15', topic:'IV Access', badge:'ch15', type:'single',
    diagram: SVG_ARM_VEINS,
    text:'A nurse needs to draw blood from a hospitalized patient who has a peripheral IV running in the left cephalic vein. From which site should the nurse draw blood?',
    vocabTip:'NEVER draw blood from the same arm as a running IV — the infusion fluid will contaminate the sample, giving false lab results (especially glucose, electrolytes). Use the opposite arm. The median cubital vein in the antecubital fossa is the preferred phlebotomy site.',
    options:[
      {l:'A', t:'Left basilic vein — same arm but different vein', correct:false, rationale:'Even a different vein on the SAME arm can give contaminated results when an IV is running. The infusion fluid mixes in the venous system. Use the opposite arm.'},
      {l:'B', t:'Right median cubital vein — opposite arm, preferred for phlebotomy', correct:true, rationale:'CORRECT. Draw from the opposite arm to avoid IV fluid contamination. The median cubital vein in the antecubital fossa is the preferred phlebotomy site — it\'s large, superficial, and well-anchored.'},
      {l:'C', t:'Left cephalic vein — distal to the IV site is acceptable', correct:false, rationale:'Drawing from the same vein, even below the IV, will give inaccurate results. Turn off the IV first if you MUST use the same arm (wait 1-2 minutes and discard the first mL), but the opposite arm is strongly preferred.'},
      {l:'D', t:'Either arm — it makes no difference if the IV is a maintenance rate', correct:false, rationale:'Even maintenance-rate IVs can contaminate blood samples. ANY rate of infusion affects the accuracy of lab values.'},
    ]
  },
  {
    id:27, ch:'Ch 15', topic:'IV Gauge Selection', badge:'ch15', type:'single',
    diagram: SVG_GAUGE_CHART,
    text:'A trauma patient arrives needing a rapid blood transfusion. Referring to the gauge chart: which IV catheter size is MOST appropriate?',
    vocabTip:'Gauge is INVERSE: lower number = bigger needle = faster flow. Trauma/rapid transfusion needs FAST flow → large bore → 14G (orange) or 16G (gray). Blood cells are large — they need a wide catheter to flow without hemolysis (rupturing). Never transfuse blood through a 22G or smaller.',
    options:[
      {l:'A', t:'14-gauge (orange) — largest bore for rapid volume', correct:true, rationale:'CORRECT. 14G provides the fastest flow rate, essential for rapid blood transfusion in trauma. Remember: lower gauge = bigger needle = faster flow.'},
      {l:'B', t:'20-gauge (pink) — standard for most adult patients', correct:false, rationale:'20G is fine for routine infusions but too small for rapid blood transfusion. Blood cells can hemolyze (rupture) through small catheters under pressure.'},
      {l:'C', t:'22-gauge (blue) — minimizes patient discomfort', correct:false, rationale:'22G is for pediatrics, elderly, and fragile veins. It cannot deliver the flow rate needed for trauma resuscitation or rapid transfusion.'},
      {l:'D', t:'24-gauge (yellow) — any IV can deliver blood in an emergency', correct:false, rationale:'24G is for neonates. While any access is better than none, this would be completely inadequate for rapid blood transfusion. Blood can hemolyze through catheters this small.'},
    ]
  },
  {
    id:28, ch:'Ch 15', topic:'PICC Lines', badge:'ch15', type:'single',
    diagram: SVG_CENTRAL_LINES,
    text:'A nurse is caring for a patient with a PICC line. The patient reports a sudden onset of dyspnea, chest pain, and tachycardia. The nurse suspects an air embolism. What is the priority nursing action?',
    vocabTip:'Air embolism: air enters the venous system → travels to heart/lungs → blocks blood flow. Position: LEFT SIDE, head DOWN (Trendelenburg). Why left side? Traps air in the right atrium (right side up = air moves to pulmonary artery = worse). Clamp the line immediately.',
    options:[
      {l:'A', t:'Place the patient in left-side Trendelenburg position and clamp the line', correct:true, rationale:'CORRECT. Left lateral Trendelenburg (left side, head down) traps air in the right atrium and prevents it from traveling to the pulmonary artery. Clamp the catheter to prevent more air from entering.'},
      {l:'B', t:'Elevate the head of bed and apply oxygen', correct:false, rationale:'Elevating the HOB would allow air to travel UP through the right heart into the pulmonary vasculature, worsening the embolism. Position should be head DOWN, not up.'},
      {l:'C', t:'Flush the PICC line rapidly with normal saline to clear the air', correct:false, rationale:'Flushing could push MORE air into the venous system. The line should be CLAMPED, not flushed. Flushing is contraindicated.'},
      {l:'D', t:'Remove the PICC line immediately to stop the air source', correct:false, rationale:'Removing the line during the emergency could introduce MORE air through the open tract. Clamp first, stabilize the patient, then address the line removal under controlled conditions.'},
    ]
  },
  {
    id:29, ch:'Ch 15', topic:'Blood Transfusion', badge:'ch15', type:'sata',
    text:'A nurse is administering a unit of packed red blood cells (PRBCs). Which actions are correct for safe blood administration? Select all that apply.',
    vocabTip:'Blood transfusion safety: Two-nurse verification at bedside. Only NS can run with blood (dextrose causes clumping, LR has calcium which causes clotting). Start slow (first 15 min = highest reaction risk). Each unit must infuse within 4 hours (bacteria grow at room temp after that).',
    options:[
      {l:'A', t:'Verify the blood product with two nurses at the bedside using two patient identifiers', correct:true, rationale:'CORRECT. Two-nurse verification with at least two patient identifiers (name + DOB or MRN) is required to prevent transfusion of the wrong blood type — a potentially fatal error.'},
      {l:'B', t:'Infuse with 0.9% normal saline as the only compatible IV solution', correct:true, rationale:'CORRECT. NS is the ONLY solution that can be co-infused with blood. LR contains calcium (causes clotting of donor blood). Dextrose causes hemolysis of red blood cells.'},
      {l:'C', t:'Stay with the patient for the first 15 minutes and take vital signs', correct:true, rationale:'CORRECT. Most severe transfusion reactions occur in the first 15 minutes. Stay at the bedside, start with a slow rate, and take vitals at baseline, 15 min, and per protocol.'},
      {l:'D', t:'Complete each unit within 4 hours from the time it was released from the blood bank', correct:true, rationale:'CORRECT. Blood must be infused within 4 hours of leaving the blood bank. After 4 hours at room temperature, bacterial contamination risk increases significantly.'},
      {l:'E', t:'Add dextrose to the blood to prevent hypoglycemia during transfusion', correct:false, rationale:'NEVER add dextrose to blood products. Dextrose causes hemolysis (rupture) of the red blood cells, destroying the product and potentially causing a reaction.'},
    ]
  },
  {
    id:30, ch:'Ch 15', topic:'IV Complications', badge:'ch15', type:'single',
    text:'A nurse observes that the IV site is swollen, cool to touch, and the patient reports burning at the insertion site. The IV fluid is infusing, but there is no blood return. The nurse suspects:',
    vocabTip:'Infiltration = IV fluid leaking into surrounding tissue. Signs: swelling, coolness, pallor, no blood return, fluid still infusing. EXTRAVASATION = infiltration of a VESICANT (tissue-damaging) medication — causes tissue necrosis. Phlebitis = vein inflammation: warm, red, tender, palpable cord ALONG the vein.',
    options:[
      {l:'A', t:'Infiltration — the catheter has dislodged from the vein', correct:true, rationale:'CORRECT. Swelling + cool skin + burning + no blood return = infiltration. The catheter tip is no longer in the vein, and IV fluid is leaking into the interstitial tissue. Stop the infusion, remove the IV, and restart at a new site.'},
      {l:'B', t:'Phlebitis — the vein is inflamed', correct:false, rationale:'Phlebitis presents as warmth, redness, and tenderness ALONG the vein path, often with a palpable cord. The site described is cool and swollen, not warm and red.'},
      {l:'C', t:'Thrombosis — a clot has formed in the vein', correct:false, rationale:'While thrombosis can occur with IV therapy, the cool, swollen site with continued fluid flow but no blood return is classic infiltration, not clot formation.'},
      {l:'D', t:'Speed shock — the fluid is infusing too rapidly', correct:false, rationale:'Speed shock causes systemic symptoms (flushing, irregular pulse, shock) from rapid drug entry into circulation. The symptoms described are LOCAL to the IV site.'},
    ]
  }
];

// =================== QUIZ ENGINE ===================
let state = { answers: {}, submitted: {}, score: 0, total: QUESTIONS.length };

function buildQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  let currentCh = '';
  QUESTIONS.forEach((q, qi) => {
    if (q.ch !== currentCh) {
      currentCh = q.ch;
      const chNames = {'Ch 10':'Environmental Emergencies','Ch 11':'Burns / Lightning','Ch 12':'Trauma / Triage / Shock','Ch 13':'Fluids & Electrolytes','Ch 14':'Acid-Base Balance','Ch 15':'Infusion Therapy'};
      const div = document.createElement('div');
      div.className = 'chapter-divider';
      div.textContent = `${currentCh}: ${chNames[currentCh] || ''}`;
      container.appendChild(div);
    }
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `q${q.id}`;
    const badgeClass = `badge-${q.badge}`;
    const isSata = q.type === 'sata';
    let html = `<div class="q-meta"><span class="q-num">Q${q.id} / ${QUESTIONS.length}</span><span class="badge ${badgeClass}">${q.ch} · ${q.topic}</span>`;
    if (isSata) html += `<span class="sata-tag">SATA</span>`;
    if (q.trap) html += `<span class="badge badge-trap">Trap</span>`;
    html += `</div>`;
    html += `<div class="q-text">${q.text}</div>`;
    if (q.diagram) html += `<div class="diagram-box">${q.diagram}</div>`;
    q.options.forEach((opt, oi) => {
      html += `<div class="option" data-q="${q.id}" data-i="${oi}" onclick="toggleOpt(${q.id},${oi},${isSata})"><span class="option-letter">${opt.l}</span><span class="option-text">${opt.t}</span></div>`;
    });
    html += `<button class="submit-btn" id="sub${q.id}" disabled onclick="submitQ(${q.id})">Submit</button>`;
    card.innerHTML = html;
    container.appendChild(card);
  });
}

function toggleOpt(qid, idx, multi) {
  if (state.submitted[qid]) return;
  if (!state.answers[qid]) state.answers[qid] = [];
  const sel = state.answers[qid];
  if (multi) {
    const i = sel.indexOf(idx);
    i >= 0 ? sel.splice(i, 1) : sel.push(idx);
  } else {
    state.answers[qid] = [idx];
  }
  document.querySelectorAll(`[data-q="${qid}"]`).forEach((el, i) => {
    el.classList.toggle('selected', state.answers[qid].includes(i));
  });
  const btn = document.getElementById(`sub${qid}`);
  btn.disabled = state.answers[qid].length === 0;
  if (!btn.disabled) btn.classList.add('ready');
}

function submitQ(qid) {
  if (state.submitted[qid]) return;
  const q = QUESTIONS.find(x => x.id === qid);
  const sel = state.answers[qid] || [];
  if (sel.length === 0) return;
  const correctIdxs = q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0);
  const isCorrect = sel.length === correctIdxs.length && sel.every(i => correctIdxs.includes(i));
  if (isCorrect) state.score++;
  state.submitted[qid] = { correct: isCorrect, selected: sel };
  const card = document.getElementById(`q${qid}`);
  card.classList.add(isCorrect ? 'correct' : 'incorrect');
  document.querySelectorAll(`[data-q="${qid}"]`).forEach((el, i) => {
    el.style.pointerEvents = 'none';
    if (q.options[i].correct) el.classList.add('correct-ans');
    if (sel.includes(i) && !q.options[i].correct) el.classList.add('wrong-ans');
    const rDiv = document.createElement('div');
    rDiv.className = `option-rationale ${q.options[i].correct ? 'r-correct' : 'r-wrong'}`;
    rDiv.textContent = q.options[i].rationale;
    el.appendChild(rDiv);
  });
  const btn = document.getElementById(`sub${qid}`);
  btn.disabled = true;
  btn.classList.remove('ready');
  btn.textContent = isCorrect ? '✓ Correct' : '✗ Incorrect';
  btn.style.background = isCorrect ? '#166534' : '#7f1d1d';
  btn.style.color = '#fff';
  if (q.vocabTip) {
    const tipDiv = document.createElement('div');
    tipDiv.className = 'vocab-tip';
    tipDiv.innerHTML = '<strong>📖 When you see this on an exam:</strong><br>' + q.vocabTip;
    card.appendChild(tipDiv);
  }
  if (q.trap) {
    const trap = document.createElement('div');
    trap.className = 'trap-call';
    trap.innerHTML = '<span class="trap-icon">⚠</span> <strong>Professor Trap:</strong> This question is designed to look like a different answer is correct. Read every option critically.';
    card.appendChild(trap);
  }
  updateProgress();
  if (Object.keys(state.submitted).length === QUESTIONS.length) showScore();
}

function updateProgress() {
  const done = Object.keys(state.submitted).length;
  document.getElementById('progressFill').style.width = (done / QUESTIONS.length * 100) + '%';
}

function showScore() {
  const sc = document.getElementById('scoreCard');
  sc.style.display = 'block';
  const pct = Math.round(state.score / QUESTIONS.length * 100);
  const grade = pct >= 90 ? '#22c55e' : pct >= 78 ? '#fbbf24' : '#ef4444';
  const msg = pct >= 90 ? 'You are READY for this exam' : pct >= 78 ? 'Solid — review the missed topics below' : 'Focus on the weak areas below before Thursday';

  const topicScores = {};
  QUESTIONS.forEach(q => {
    const key = q.ch + ': ' + q.topic;
    if (!topicScores[key]) topicScores[key] = { c: 0, t: 0 };
    topicScores[key].t++;
    if (state.submitted[q.id]?.correct) topicScores[key].c++;
  });

  const chScores = {};
  QUESTIONS.forEach(q => {
    if (!chScores[q.ch]) chScores[q.ch] = { c: 0, t: 0 };
    chScores[q.ch].t++;
    if (state.submitted[q.id]?.correct) chScores[q.ch].c++;
  });

  const weakTopics = Object.entries(topicScores)
    .filter(([_, v]) => v.c < v.t)
    .sort((a, b) => (a[1].c / a[1].t) - (b[1].c / b[1].t));

  try {
    const entry = {
      examId: 'ms1-exam2-comprehensive',
      examLabel: 'MS1 Exam 2 — Comprehensive (30Q)',
      date: new Date().toISOString(),
      score: pct,
      correct: state.score,
      total: QUESTIONS.length,
      topicBreakdown: Object.fromEntries(Object.entries(chScores).map(([k,v])=>[k,{c:v.c,t:v.t}])),
      weakAreas: weakTopics.map(([t]) => t)
    };
    const hist = JSON.parse(localStorage.getItem('examHistory') || '[]');
    hist.unshift(entry);
    localStorage.setItem('examHistory', JSON.stringify(hist.slice(0, 20)));
    localStorage.setItem('lastExamStats', JSON.stringify(entry));
  } catch(e) {}

  sc.innerHTML = `
    <div class="score-big" style="color:${grade}">${state.score}/${QUESTIONS.length}</div>
    <div class="score-pct">${pct}% · ${msg}</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px">Score by Chapter</div>
    <div class="score-grid">
      ${Object.entries(chScores).map(([ch, v]) => {
        const chNames = {'Ch 10':'Env. Emergencies','Ch 11':'Burns/Lightning','Ch 12':'Trauma/Triage','Ch 13':'Fluids/Lytes','Ch 14':'Acid-Base','Ch 15':'Infusion'};
        return `<div class="score-cell">
          <div class="score-cell-label">${ch}: ${chNames[ch]||''}</div>
          <div class="score-cell-val" style="color:${v.c===v.t?'#22c55e':v.c/v.t>=.6?'#fbbf24':'#ef4444'}">${v.c}/${v.t} (${Math.round(v.c/v.t*100)}%)</div>
        </div>`;
      }).join('')}
    </div>
    ${weakTopics.length > 0 ? `<div class="weak-list"><div style="font-family:'IBM Plex Mono',monospace;font-size:.65rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Review before exam</div>${weakTopics.map(([topic, v]) => `<div class="weak-item">${topic} — ${v.c}/${v.t} correct</div>`).join('')}</div>` : ''}
    <button class="restart-btn" onclick="restartQuiz()">Retake Exam</button>
  `;
  sc.scrollIntoView({ behavior: 'smooth' });
}

function restartQuiz() {
  state = { answers: {}, submitted: {}, score: 0, total: QUESTIONS.length };
  updateProgress();
  document.getElementById('scoreCard').style.display = 'none';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
updateProgress();

try {
  const last = JSON.parse(localStorage.getItem('lastExamStats'));
  if (last && last.examId === 'ms1-exam2-comprehensive') {
    const el = document.getElementById('lastAttempt');
    const color = last.score >= 90 ? '#22c55e' : last.score >= 78 ? '#fbbf24' : '#ef4444';
    const weak = last.weakAreas && last.weakAreas.length > 0
      ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${last.weakAreas.map(w => `<span style="font-family:'IBM Plex Mono',monospace;font-size:.6rem;background:#1f0d0d;color:#fca5a5;padding:2px 8px;border-radius:8px">${w}</span>`).join('')}</div>`
      : '';
    el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-family:'IBM Plex Mono',monospace;font-size:.6rem;color:#64748b;text-transform:uppercase;letter-spacing:.1em">Last Attempt</div><div style="font-size:.8rem;color:#94a3b8;margin-top:2px">${new Date(last.date).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${last.correct}/${last.total}</div></div><div style="font-family:'DM Serif Display',serif;font-size:1.8rem;font-weight:700;color:${color}">${last.score}%</div></div>${weak}`;
    el.style.display = 'block';
  }
} catch(e) {}
</script>
