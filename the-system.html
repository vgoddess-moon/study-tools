    try { localStorage.removeItem(key); } catch(e) {}
  },
  getAll: () => {
    const data = {};

      for (let i = 0; i < localStorage.length; i++) {

// Parse a date string in LOCAL time. A bare 'YYYY-MM-DD' is otherwise read as UTC
// midnight, which lands on the previous evening in US time zones.
const parseLocalDate = (s) => {
  if (typeof s === 'string' && s.length === 10 && s.indexOf('T') === -1) return new Date(s + 'T00:00:00');

const streakFromDateList = (dates) => {
  let count = 0;
  let d = new Date();
  for (let i = 0; i < 90; i++) {
    if (dates.includes(d.toDateString())) count++;
    else if (i > 0) break;
    d = new Date(d.getTime() - 86400000);
  }
  return count;
};

// Cumulative "Days in The System" — union of every unique day across every tracked
// activity. Only goes UP. Never resets. The metric Vivian asked for.
const computeDaysInSystem = () => {
  const set = new Set();
  const addDate = (d) => {
    if (!d) return;
    const date = new Date(d);
    if (isNaN(date.getTime())) return;
    set.add(date.toDateString());
  };
  try {
    const rh = storage.get('ritualHistory') || [];
    if (Array.isArray(rh)) rh.forEach(addDate);
    const hist = storage.get('history') || [];
    if (Array.isArray(hist)) hist.forEach(h => addDate(h && h.date));
    const eh = storage.get('examHistory') || [];
    if (Array.isArray(eh)) eh.forEach(e => addDate(e && e.date));
    const ql = storage.get('quizLog') || [];
    if (Array.isArray(ql)) ql.forEach(q => addDate(q && q.date));
    const wh = storage.get('workoutHistory') || [];
    if (Array.isArray(wh)) wh.forEach(addDate);
    // meditation:* keys (one per day)
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('meditation:')) {
        addDate(key.slice('meditation:'.length));
      }
    }
  } catch (e) { /* swallow */ }
  return set.size;
};

  if (age < 0) age += synodic;
  let phase, emoji;
  if (age < 1.5 || age > synodic - 1.5) { phase = 'New Moon'; emoji = '🌑'; }
  else if (age < 6.5) { phase = 'Waxing Crescent'; emoji = '🌒'; }
  else if (age < 8.5) { phase = 'First Quarter'; emoji = '🌓'; }
  else if (age < 13.5) { phase = 'Waxing Gibbous'; emoji = '🌔'; }
  else if (age < 16) { phase = 'Full Moon'; emoji = '🌕'; }
  else if (age < 21.5) { phase = 'Waning Gibbous'; emoji = '🌖'; }
  else if (age < 23.5) { phase = 'Last Quarter'; emoji = '🌗'; }
  else { phase = 'Waning Crescent'; emoji = '🌘'; }
  // 3-day high-leverage windows
  const halfSyn = synodic / 2;
  const preFull = age < halfSyn && (halfSyn - age) < 3;
  const postFull = age >= halfSyn && (age - halfSyn) < 3;
  const preNew = age > synodic - 3;
  const postNew = age < 3 && age >= 0 && !(age > synodic - 3);
  const nearNew = preNew || postNew;
  const nearFull = preFull || postFull;
  // Callout content for the dashboard banner
  let callout = null;
  if (preFull) {
    const d = Math.max(1, Math.ceil(halfSyn - age));
    callout = {
      icon: '🌕',
      tone: 'full',
      label: d <= 1 ? 'Full Moon tonight' : `Full Moon in ${d} day${d>1?'s':''}`,
      hint: 'Refine your vision. Start your release list — what are you letting go of?',
    };
  } else if (postFull) {
    const d = Math.max(1, Math.ceil(age - halfSyn));
    callout = {
      icon: '🌖',
      tone: 'full',
      label: d <= 1 ? 'Full Moon energy still active' : `Full Moon was ${d} days ago`,
      hint: 'Burn or tear your release list. Cleanse with water, smoke, or a long shower.',
    };
  } else if (preNew) {
    const d = Math.max(1, Math.ceil(synodic - age));
    callout = {
      icon: '🌑',
      tone: 'new',
      label: d <= 1 ? 'New Moon tonight' : `New Moon in ${d} day${d>1?'s':''}`,
      hint: 'Quiet your mind. What seeds are you planting this cycle?',
    };
  } else if (postNew) {
    const d = Math.max(1, Math.ceil(age));
    callout = {
      icon: '🌒',
      tone: 'new',
      label: d <= 1 ? 'New Moon energy active' : `New Moon was ${d} days ago`,
      hint: 'Light a candle. Begin (or continue) the 555 method — 55 lines a day for 5 days.',
    };
  }
  // 8-phase key for ritual rendering
  let phaseKey;
  if (age < 1.5 || age > synodic - 1.5) phaseKey = 'new';
  else if (age < 6.5) phaseKey = 'waxingCrescent';
  else if (age < 8.5) phaseKey = 'firstQuarter';
  else if (age < 13.5) phaseKey = 'waxingGibbous';
  else if (age < 16) phaseKey = 'full';
  else if (age < 21.5) phaseKey = 'waningGibbous';
  else if (age < 23.5) phaseKey = 'lastQuarter';
  else phaseKey = 'waningCrescent';
  return { age, phase, emoji, nearNew, nearFull, callout, phaseKey };
};

const playChime = () => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.25);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.25 + 0.9);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.25);
      osc.stop(ctx.currentTime + i * 0.25 + 0.9);
    });
  } catch(e) {}
};
const daysBetween = (d1, d2) => {
  const a = parseLocalDate(d1); const b = parseLocalDate(d2);
  a.setHours(0,0,0,0); b.setHours(0,0,0,0);
  return Math.round((b - a) / 86400000);
};
const formatETA = (date) => {
  const diff = parseLocalDate(date) - new Date();
  if (diff < 0) return 'now';
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  if (days === 0) {
    const mins = Math.floor((diff % 3600000) / 60000);
    return hours === 0 ? `${mins}m` : `${hours}h ${mins}m`;
  }
  if (days < 7) return `${days}d ${hours}h`;
  if (days < 60) return `${days} days`;
  return `${Math.floor(days/30)}mo ${days%30}d`;
};

const weatherCodeToEmoji = (code) => {
  if (code === 0) return '☀️';
  if (code >= 1 && code <= 3) return '⛅';
  if (code >= 45 && code <= 48) return '🌫️';
  if (code >= 51 && code <= 55) return '🌧️';
  if (code >= 61 && code <= 65) return '🌧️';
  if (code >= 71 && code <= 77) return '❄️';
  if (code >= 80 && code <= 82) return '🌦️';
  if (code >= 95 && code <= 99) return '⛈️';
  return '🌤️';
};

const weatherCodeToLabel = (code) => {
  if (code === 0) return 'Clear';
  if (code >= 1 && code <= 3) return 'Partly Cloudy';
  if (code >= 45 && code <= 48) return 'Foggy';
  if (code >= 51 && code <= 55) return 'Drizzle';
  if (code >= 61 && code <= 65) return 'Rain';
  if (code >= 71 && code <= 77) return 'Snow';
  if (code >= 80 && code <= 82) return 'Showers';
  if (code >= 95 && code <= 99) return 'Thunderstorm';
  return 'Fair';
};

    if (practiceScores && typeof practiceScores === 'object') {
      Object.entries(practiceScores).forEach(([topic, score]) => {
        if (typeof score === 'number' && score < 70) areas.push({ topic, score, source: 'Practice Exam' });
      });
    }
    if (vocabScores && typeof vocabScores === 'object') {
      Object.entries(vocabScores).forEach(([topic, score]) => {
        if (typeof score === 'number' && score < 70) areas.push({ topic, score, source: 'Vocab Quiz' });
      });
    }
    // Also check manual quiz log
    quizLog.forEach(q => {
      if (q.score < 70) areas.push({ topic: q.name, score: q.score, source: 'Manual' });
    });
    return areas;
  }, [quizLog]);

  const computeStreak = (h) => {
    const dates = h.map(x => x.date).filter(Boolean);
    let count = 0;
    let d = new Date();
    for (let i = 0; i < 60; i++) {
      if (dates.includes(d.toDateString())) count++;
      else if (i > 0) break;
      d = new Date(d.getTime() - 86400000);
    }
    return count;
  };

  const saveCheckin = (data) => {
    const full = { ...data, date: todayKey(), timestamp: Date.now() };
    setCheckin(full);
    setLastActive(todayKey());
    const h = [...history.filter(x => x.date !== todayKey()), full].slice(-30);
    setHistory(h);
    const s = computeStreak(h);
    setStreak(s);
    storage.set(`checkin:${todayKey()}`, full);
    storage.set('streak', s);
    storage.set('lastActive', todayKey());
    storage.set('history', h);
    showToast(`Day ${s} 🔥`);
  };

  const addProduct = () => {
    if (!newProd.name.trim()) return;
    const p = { id: Date.now().toString(), ...newProd, stage: 'queued', added: Date.now() };
    const u = [...products, p];
    setProducts(u);
    storage.set('products', u);
    setNewProd({ name: '', category: 'shoes', notes: '' });
    setShowAdd(false);
  };

  const advance = (id) => {
    const stages = ['queued', 'filmed', 'edited', 'captioned', 'scheduled', 'posted'];
    const u = products.map(p => {
      if (p.id !== id) return p;
      const i = stages.indexOf(p.stage);
      return { ...p, stage: stages[Math.min(i+1, stages.length-1)] };
    });
    setProducts(u);
    storage.set('products', u);
    const p = products.find(x => x.id === id);
    if (p) {
      const next = stages[stages.indexOf(p.stage) + 1];
      if (next === 'posted') showToast('LIVE 🚀', 1800);
      else if (next) showToast(`✓ ${next}`, 1500);
    }
  };

  const del = (id) => {
    const u = products.filter(p => p.id !== id);
    setProducts(u);
    storage.set('products', u);
  };

  const logEat = () => {
    setAte(Date.now());
    storage.set(`ate:${todayKey()}`, Date.now());
    showToast('Fuel ✓', 1500);
  };

  const startAnki = () => { setAnkiSec(900); setAnki(true); setAnkiNote(''); showToast('15 min. Just start. 🃏', 2000); };

  const saveAnkiSession = () => {
    if (!ankiNote.trim()) { showToast('Add a note first', 1500); return; }
    const session = { time: Date.now(), note: ankiNote, duration: 900 - ankiSec };
    saveTodayLog({ ...todayLog, anki: [...(todayLog.anki || []), session] });
    setAnkiNote('');
    showToast('Logged ✓', 1500);
  };

  const toggleFamily = () => { const n = !family; setFamily(n); storage.set('family', n); };

  const toggleLaunchTask = (id) => {
    const u = { ...launchDone, [id]: !launchDone[id] };
    setLaunchDone(u);
    storage.set('launchDone', u);
    if (!launchDone[id]) {
      const task = LAUNCH_TASKS.find(t => t.id === id);
      if (task?.id === 'post1') showToast('YOU ARE A CREATOR 🚀', 3500);
      else showToast('Done! 🎯', 1500);
    }
  };

  // Reschedule a launch task to tomorrow (or a specific date)
  const rescheduleLaunchTask = (id, newDay) => {
    const u = { ...launchOverrides, [id]: newDay || tomorrowISO() };
    setLaunchOverrides(u);
    storage.set('launchOverrides', u);
    showToast('Moved → ' + (newDay || 'tomorrow'), 1500);
  };

  const toggleSuggestion = (idx) => {
    const cur = todayLog.suggestions || {};
    const item = cur[idx] || { done: false, note: '' };
    saveTodayLog({ ...todayLog, suggestions: { ...cur, [idx]: { ...item, done: !item.done } } });
    if (!item.done) showToast('✓', 1200);
  };

  const updateSuggestionNote = (idx, note) => {
    const cur = todayLog.suggestions || {};
    const item = cur[idx] || { done: false, note: '' };
    saveTodayLog({ ...todayLog, suggestions: { ...cur, [idx]: { ...item, note } } });
  };

  const saveAddresses = (newAddresses) => {
    setAddresses(newAddresses);
    storage.set('addresses', newAddresses);
  };

  // Sync functions
  const generateSyncCode = () => {
    try {
      const allData = storage.getAll();
      const json = JSON.stringify(allData);
      const encoded = btoa(unescape(encodeURIComponent(json)));
      navigator.clipboard.writeText(encoded).then(() => {
        const now = Date.now();
        setLastSync(now);
        storage.set('lastSync', now);
        showToast('Copied! Paste on other device', 2500);
      }).catch(() => {
        // Fallback: show in a prompt
        const ta = document.createElement('textarea');
        ta.value = encoded;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const now = Date.now();
        setLastSync(now);
        storage.set('lastSync', now);
        showToast('Copied! Paste on other device', 2500);
      });
    } catch(e) {
      showToast('Sync export failed', 2000);
    }
  };

  const importSyncCode = () => {
    try {
      const json = decodeURIComponent(escape(atob(syncCode.trim())));
      const data = JSON.parse(json);
      storage.importAll(data);
      const now = Date.now();
      setLastSync(now);
      storage.set('lastSync', now);
      setSyncCode('');
      setShowSyncImport(false);
      showToast('Synced! Reloading...', 2000);
      setTimeout(() => window.location.reload(), 2000);
    } catch(e) {
      showToast('Invalid sync code', 2000);
    }
  };

  // Revenue functions
  const addRevenue = (amount, note) => {
    const entry = { id: Date.now(), amount: parseFloat(amount), note, date: todayKey() };
    const u = [...revenue, entry];
    setRevenue(u);
    storage.set('revenue', u);
    showToast(`+$${amount} 💰`, 1500);
  };

  // Content ideas
  const addContentIdea = (text) => {
    const idea = { id: Date.now(), text, date: todayKey() };
    const u = [idea, ...contentIdeas];
    setContentIdeas(u);
    storage.set('contentIdeas', u);
    showToast('Idea saved 💡', 1500);
  };

  const removeContentIdea = (id) => {
    const u = contentIdeas.filter(i => i.id !== id);
    setContentIdeas(u);
    storage.set('contentIdeas', u);
  };

  // Engagement
  const addEngagement = (postName, views, likes, follows) => {
    const entry = { id: Date.now(), postName, views: parseInt(views)||0, likes: parseInt(likes)||0, follows: parseInt(follows)||0, date: todayKey() };
    const u = [...engagement, entry];
    setEngagement(u);
    storage.set('engagement', u);
    showToast('Logged 📊', 1500);

  // Study log
  const saveStudySession = (note) => {
    const session = { time: Date.now(), note, duration: studyTimerSec };
    const u = [...studyLogs, session];
    setStudyLogs(u);

    storage.set('allStudyLogs', updated);
    setStudyTimer(false);
    setStudyTimerSec(0);
    studyStartRef.current = null;
    showToast('Study session logged ✓', 1500);
  };

  // Quiz log
  const addQuiz = (name, score, notes) => {
    const entry = { id: Date.now(), name, score: parseFloat(score), notes, date: todayKey() };
    const u = [...quizLog, entry];
    setQuizLog(u);
    storage.set('quizLog', u);
    showToast('Quiz logged ✓', 1500);
  };

  // Meditation
  const saveMeditationSession = (duration, note) => {
    const session = { time: Date.now(), duration, note };
    const u = [...meditationLog, session];
    setMeditationLog(u);
    storage.set(`meditation:${todayKey()}`, u);
    // Update mindfulness streak
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    const yesterdayMed = storage.get(`meditation:${yesterday}`);
    let ms = mindfulStreak;
    if (yesterdayMed && yesterdayMed.length > 0) ms = mindfulStreak + 1;
    else if (meditationLog.length === 0) ms = 1; // first today

    storage.set('mindfulStreak', ms);
    showToast('Mindful moment logged 🧘', 1500);

  // Ritual: persist today's data and keep a history of active days for the streak
  const updateRitual = (next, toast) => {
    setRitualToday(next);
    storage.set(`ritual:${todayKey()}`, next);
    let hist = storage.get('ritualHistory') || [];
    if (!hist.includes(todayKey())) {
      hist = [...hist, todayKey()].slice(-90);
      storage.set('ritualHistory', hist);
    }
    const s = streakFromDateList(hist);
    setRitualStreak(s);
    storage.set('ritualStreak', s);
    if (toast) showToast(toast, 1500);
  };

  // Workout: check off moves, log weights for progressive overload, save the session
  const updateWorkout = (next) => {
    setWorkoutToday(next);
    storage.set(`workout:${todayKey()}`, next);
  };
  const logWorkout = () => {
    let hist = storage.get('workoutHistory') || [];
    if (!hist.includes(todayKey())) {
      hist = [...hist, todayKey()].slice(-120);
      storage.set('workoutHistory', hist);
    }
    setWorkoutStreak(streakFromDateList(hist));
    // Save any logged weights as the new "last" to beat next time
    const ww = { ...workoutWeights };
    Object.keys(workoutToday.weights || {}).forEach(k => {
      const v = parseFloat(workoutToday.weights[k]);
      if (!isNaN(v) && v > 0) ww[k] = v;
    });
    setWorkoutWeights(ww);
    storage.set('workoutWeights', ww);
    showToast('Workout logged 💪 Pearl placed.', 2000);
  };

  // Pomodoro
  const startPomodoro = () => {
    setPomodoro('work');
    setPomodoroSec(1500); // 25 min
    showToast('25-min sprint started 🎯', 2000);
  };

  const getSuggestions = () => {
    if (!checkin) return [];
    if (family) return [{ icon: '💕', text: 'Family mode is on. Be present. Hustle is paused.' }];
    if (inAtlanta) return [
      { icon: '🌴', text: "You're in Atlanta. Hustle on pause. Be present." },
      { icon: '📸', text: 'Optional: capture content for later.' },
    ];
    if (examMode && nextExam) {
      const suggestions = [
        { icon: '📚', text: `${nextExam.label} in ${nextExam.daysAway} day${nextExam.daysAway===1?'':'s'}. Study mode active.` },
        { icon: '🃏', text: 'Anki Now — even 15 min counts.' },
        { icon: '🛌', text: 'Sleep IS study. 2am hard cutoff is on tonight.' },
      ];
      if (weakAreas.length > 0) {
        suggestions.push({ icon: '⚠️', text: `Review weak area: ${weakAreas[0].topic} (${weakAreas[0].score}%)` });
      }
      return suggestions;
    }
    if (todayLaunchTasks.length > 0) return [
      { icon: '🚀', text: `Launch day! ${todayLaunchTasks.length} task${todayLaunchTasks.length===1?'':'s'} unlocked.` },
      { icon: '✅', text: `${todayLaunchTasks[0].title} — ${todayLaunchTasks[0].time}` },
    ];
    const { energy, meds, sleep, brain } = checkin;
    const score = (energy==='high'?3:energy==='med'?2:1) + (meds==='taken'?1:0) + (sleep==='good'?1:sleep==='okay'?0.5:0) + (brain==='hyper'?2:brain==='normal'?1:0);
    const queued = products.filter(p => p.stage==='queued').length;
    const filmed = products.filter(p => p.stage==='filmed').length;
    const edited = products.filter(p => p.stage==='edited').length;
    if (score >= 6) return [
      { icon: '🎬', text: queued > 0 ? `Film day. ${queued} product${queued>1?'s':''} queued.` : 'Hyperfocus — batch order samples.' },
      { icon: '💪', text: 'Gym micro-commit: 20 min Planet Fitness.' },
      { icon: '🃏', text: 'Anki if exam within 2 weeks.' },
    ];
    if (score >= 4) return [
      { icon: '✂️', text: filmed > 0 ? `Edit the ${filmed} filmed video${filmed>1?'s':''}.` : 'Write captions for upcoming posts.' },
      { icon: '🃏', text: 'Anki 15-min — perfect medium-energy task.' },
      { icon: '🛒', text: 'Browse DHgate for next samples (15 min cap).' },
    ];
    return [
      { icon: '✅', text: edited > 0 ? 'Schedule edited videos.' : 'Just check in. Streak preserved.' },
      { icon: '🥗', text: 'Did you eat in the last 4 hours?' },
      { icon: '🛌', text: 'Rest day. No guilt. Tomorrow is new.' },
    ];
  };

  // Tab list varies based on exam mode
  const tabs = [
    { id: 'today', label: 'Today' },
    { id: 'ritual', label: 'Ritual' },
    { id: 'move', label: 'Move' },
    { id: 'study', label: 'Study' },
    { id: 'launch', label: 'Launch' },
    { id: 'road', label: 'Road' },
    { id: 'pipe', label: 'Pipe' },
    { id: 'stats', label: 'Stats' },
  ];

  return (
    <div className="min-h-screen bg-stone-50 pb-24">
      {toast && (
        <div className="fixed top-1/3 left-1/2 -translate-x-1/2 z-50 toast pointer-events-none px-4">
          <div className="text-3xl font-bold text-amber-700 tracking-tight text-center">{toast}</div>
        </div>
      )}

      {panic && <PanicScreen onClose={() => setPanic(false)} nextExam={nextExam} />}
      {editingAddr && <AddressEditor address={editingAddr} addresses={addresses} onSave={(u) => { saveAddresses(u); setEditingAddr(null); }} onClose={() => setEditingAddr(null)} />}

      <div className="max-w-md mx-auto px-4 py-5">
        <header className="mb-4">
          <div className="flex items-baseline justify-between mb-1">
            <h1 className="text-3xl font-light tracking-tight text-stone-900">
              <span className="italic font-medium">the</span> system
            </h1>
            <div className="flex items-center gap-1.5 flex-wrap justify-end">
              {(() => { const m = moonInfo(); return m.callout && (
                <button onClick={() => setTab('ritual')} title={`${m.callout.label} — tap to open Ritual`} className="bg-pink-100 px-2 py-0.5 rounded-full flex items-center gap-1">
                  <span className="moon-pulse-icon text-sm leading-none">{m.callout.icon}</span>
                  <span className="mono text-[9px] font-semibold text-pink-800 uppercase tracking-wider">moon</span>
                </button>
              ); })()}
              <button onClick={() => setDarkMode(d => !d)} className="dark-toggle" title="Toggle dark mode">
                {darkMode ? '☀️' : '🌙'}
              </button>
              {lastSync && (
                <button onClick={() => setTab('stats')} className="text-stone-400 hover:text-stone-600" title={`Last synced: ${new Date(lastSync).toLocaleString()}`}>
                  <Icon name="sync" size={12} />
                </button>
              )}
              {family && <span className="bg-pink-100 text-pink-800 mono text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full">family</span>}
              {examMode && <span className="bg-rose-100 text-rose-800 mono text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full pulse-soft">exam</span>}
              {(() => {
                const total = computeDaysInSystem();
                return (
                  <div className="flex items-center gap-1 bg-amber-100 px-2 py-0.5 rounded-full" title={`${total} day${total === 1 ? '' : 's'} in The System — counts every day you've engaged (check-in, ritual, exam, quiz, meditation, workout). Never resets.`}>
                    <span className="text-xs">🌱</span>
                    <span className="mono text-xs font-semibold text-amber-900">{total}</span>
                  </div>
                );
              })()}
            </div>
          </div>
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500">
            {new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}
          </p>
        </header>

        {nextEvent && (
          <div className="bg-stone-900 text-stone-50 rounded-2xl p-4 mb-4">
            <div className="flex items-start justify-between gap-3">
              <div className="flex-1 min-w-0">
                <p className="mono text-[9px] uppercase tracking-[0.2em] text-stone-400 mb-1.5">→ Next up</p>
                <p className="text-base font-medium leading-tight">
                  {nextEvent.icon && <span className="mr-1.5">{nextEvent.icon}</span>}
                  {nextEvent.label}
                </p>
                {nextEvent.detail && <p className="text-xs text-stone-400 mt-0.5">{nextEvent.detail}</p>}
              </div>
              <div className="text-right shrink-0">
                <p className="mono text-[9px] uppercase tracking-wider text-stone-400">ETA</p>
                <p className="mono text-xl font-semibold text-amber-300">{formatETA(nextEvent.date)}</p>
              </div>
            </div>
          </div>
        )}

        {!checkin && <CheckInFlow onSave={saveCheckin} />}

        <ExamCountdownTimeline />

        {(() => { const m = moonInfo(); return m.callout && (
          <button onClick={() => setTab('ritual')} className="moon-banner w-full text-left bg-pink-50 border border-pink-200 rounded-2xl p-3.5 mb-4 flex items-start gap-3">
            <span className="moon-pulse-icon text-2xl leading-none mt-0.5">{m.callout.icon}</span>
            <div className="flex-1 min-w-0">
              <p className="mono text-[9px] uppercase tracking-[0.2em] text-pink-800 mb-0.5">🌙 Tonight the moon is saying…</p>
              <p className="text-sm font-medium text-stone-900 leading-snug">{m.callout.label}</p>
              <p className="text-xs text-stone-700 mt-1 leading-snug">{m.callout.hint}</p>
              <p className="mono text-[10px] text-pink-800 mt-1.5">Open Ritual →</p>
            </div>
          </button>
        ); })()}

        {checkin && (
          <React.Fragment>
            <div className="flex gap-0.5 mb-4 bg-stone-200/50 p-1 rounded-xl overflow-x-auto">
              {tabs.map(t => {
                const m = moonInfo();
                const isMoonTab = t.id === 'ritual' && m.callout && tab !== t.id;
                return (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    className={`flex-1 py-2 rounded-lg text-[11px] font-medium whitespace-nowrap px-1 ${tab===t.id?'bg-white text-stone-900 shadow-sm':'text-stone-500'} ${isMoonTab ? 'moon-glow' : ''}`}>
                    {t.label}{isMoonTab ? ' 🌙' : ''}
                  </button>
                );
              })}
            </div>

            {tab === 'today' && <TodayView checkin={checkin} suggestions={getSuggestions()} suggestionLog={todayLog.suggestions || {}} onToggleSuggestion={toggleSuggestion} onUpdateSuggestionNote={updateSuggestionNote} nextExam={nextExam} examMode={examMode} inAtlanta={inAtlanta} ate={ate} onEat={logEat} anki={anki} ankiSec={ankiSec} ankiNote={ankiNote} setAnkiNote={setAnkiNote} ankiSessions={todayLog.anki || []} onStartAnki={startAnki} onStopAnki={() => setAnki(false)} onSaveAnkiSession={saveAnkiSession} study={study} onToggleStudy={() => setStudy(s => !s)} family={family} onToggleFamily={toggleFamily} onPanic={() => setPanic(true)} onReset={() => setCheckin(null)} todayLaunchTasks={todayLaunchTasks} onGoToLaunch={() => setTab('launch')} addresses={addresses} onEditAddress={(a) => setEditingAddr(a)} weather={weather} onRefreshWeather={fetchWeather} weakAreas={weakAreas} meditationLog={meditationLog} onSaveMeditation={saveMeditationSession} mindfulStreak={mindfulStreak} pomodoro={pomodoro} pomodoroSec={pomodoroSec} onStartPomodoro={startPomodoro} onStopPomodoro={() => { setPomodoro(null); setPomodoroSec(0); }} examHistory={examHistory} quizLog={quizLog} onGoToRitual={() => setTab('ritual')} />}

            {tab === 'ritual' && <RitualView ritualToday={ritualToday} onUpdate={updateRitual} ritualStreak={ritualStreak} moon={moonInfo()} oppWindow={activeOppWindow()} prompt={JOURNAL_PROMPTS[new Date().getDay()]} />}

            {tab === 'move' && <WorkoutView workoutToday={workoutToday} onUpdate={updateWorkout} onLog={logWorkout} workoutWeights={workoutWeights} workoutStreak={workoutStreak} />}

            {tab === 'study' && <StudyView checkin={checkin} nextExam={nextExam} examMode={examMode} studyLogs={studyLogs} allStudyLogs={allStudyLogs} quizLog={quizLog} studyTimer={studyTimer} studyTimerSec={studyTimerSec} onStartStudyTimer={() => { studyStartRef.current = studyTimerSec > 0 ? Date.now() - (studyTimerSec * 1000) : Date.now(); setStudyTimer(true); }} onStopStudyTimer={() => setStudyTimer(false)} onSaveStudySession={saveStudySession} onAddQuiz={addQuiz} weakAreas={weakAreas} pomodoro={pomodoro} pomodoroSec={pomodoroSec} onStartPomodoro={startPomodoro} onStopPomodoro={() => { setPomodoro(null); setPomodoroSec(0); }} />}

            {tab === 'launch' && <LaunchView launchStarted={launchStarted} daysToLaunch={daysToLaunch} inAtlanta={inAtlanta} examMode={examMode} nextExam={nextExam} todayLaunchTasks={todayLaunchTasks} upcomingLaunchTask={upcomingLaunchTask} launchDone={launchDone} launchOverrides={launchOverrides} onToggle={toggleLaunchTask} onReschedule={rescheduleLaunchTask} launchProgress={launchProgress} checkin={checkin} products={products} revenue={revenue} onAddRevenue={addRevenue} contentIdeas={contentIdeas} onAddContentIdea={addContentIdea} onRemoveContentIdea={removeContentIdea} engagement={engagement} onAddEngagement={addEngagement} />}

            {tab === 'road' && <RoadView events={allEvents} customEvents={customEvents} onSaveEvent={(ev) => {
              let updated;

              }

              storage.set('customEvents', updated);

              const updated = customEvents.filter(e => e.id !== id);
              setCustomEvents(updated);
              storage.set('customEvents', updated);

            {tab === 'stats' && <StatsView history={history} products={products} streak={streak} nextExam={nextExam} allLogs={allLogs} lastSync={lastSync} onGenerateSync={generateSyncCode} showSyncImport={showSyncImport} setShowSyncImport={setShowSyncImport} syncCode={syncCode} setSyncCode={setSyncCode} onImportSync={importSyncCode} allStudyLogs={allStudyLogs} revenue={revenue} mindfulStreak={mindfulStreak} ritualStreak={ritualStreak} examHistory={examHistory} quizLog={quizLog} />}
          </React.Fragment>
        )}
      </div>

      {showAdd && (

          <div className="bg-stone-50 w-full max-w-md rounded-t-3xl p-6 pb-10" onClick={e => e.stopPropagation()}>
            <div className="flex items-baseline justify-between mb-5">
              <h2 className="text-2xl font-medium">New product</h2>

            </div>

// ============== EXAM COUNTDOWN TIMELINE ==============
function ExamCountdownTimeline() {
  const EXAM_SCHEDULE = [
    { date: '2026-04-23T17:00:00', label: 'Exam 1', chapters: 'Ch 1-9', completed: true, score: 85 },
    { date: '2026-05-14T17:00:00', label: 'Exam 2', chapters: 'Ch 10-15', completed: true, score: 100 },
    { date: '2026-06-04T17:00:00', label: 'Exam 3', chapters: 'Ch 16-21' },
    { date: '2026-06-25T17:00:00', label: 'Exam 4', chapters: 'Ch 22-26' },
    { date: '2026-07-09T17:00:00', label: 'Exam 5', chapters: 'Ch 27-32' },
    { date: '2026-07-16T17:00:00', label: 'Final', chapters: 'Ch 1-32', isFinal: true },
  ];

  const TRIP = { start: '2026-05-16', end: '2026-05-20', label: 'Atlanta Trip' };

  const now = new Date();
  const semStart = new Date('2026-04-23T17:00:00');
  const semEnd = new Date('2026-07-16T17:00:00');
  const totalSpan = semEnd - semStart;
  const progress = Math.max(0, Math.min(100, ((now - semStart) / totalSpan) * 100));

  // Find next upcoming exam
  const nextExam = EXAM_SCHEDULE.find(e => new Date(e.date) > now);
  const nextExamDate = nextExam ? new Date(nextExam.date) : null;
  const msToNext = nextExamDate ? nextExamDate - now : 0;
  const daysToNext = Math.floor(msToNext / 86400000);
  const hoursToNext = Math.floor((msToNext % 86400000) / 3600000);

  // Calculate actual study days (subtract trip days if trip is between now and next exam)
  const countTripDaysInRange = () => {
    if (!nextExamDate) return 0;
    const tripStart = new Date(TRIP.start);
    const tripEnd = new Date(TRIP.end);
    // Count overlap days
    const overlapStart = new Date(Math.max(now.getTime(), tripStart.getTime()));
    const overlapEnd = new Date(Math.min(nextExamDate.getTime(), tripEnd.getTime()));
    if (overlapStart >= overlapEnd) return 0;
    overlapStart.setHours(0,0,0,0);
    overlapEnd.setHours(0,0,0,0);
    return Math.max(0, Math.round((overlapEnd - overlapStart) / 86400000) + 1);
  };
  const tripDays = countTripDaysInRange();
  const actualStudyDays = Math.max(0, daysToNext - tripDays);

  return (
    <div className="bg-white border border-stone-200 rounded-2xl p-4 mb-4">
      <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-3">Exam Timeline — Med Surg</p>

      {nextExam && (
        <div className="flex items-center justify-between mb-4">
          <div>
            <p className="text-lg font-semibold text-stone-900">{nextExam.label}</p>
            <p className="text-xs text-stone-500">{nextExam.chapters || ''}</p>
          </div>
          <div className="text-right">
            <p className="mono text-2xl font-bold" style={{color: daysToNext <= 3 ? '#ef4444' : '#ec4899'}}>{daysToNext}d {hoursToNext}h</p>
            {tripDays > 0 && (
              <p className="mono text-[10px] text-amber-600 mt-0.5">{actualStudyDays} actual study days</p>
            )}
          </div>
        </div>
      )}

      {tripDays > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 mb-3">
          <p className="text-xs text-amber-800 font-medium">&#9888;&#65039; Trip: May 16-20 (Atlanta) — {tripDays} day{tripDays !== 1 ? 's' : ''} unavailable</p>
        </div>
      )}

      {/* Timeline bar */}
      <div className="relative h-8 bg-stone-100 rounded-full overflow-visible mb-2" style={{border: '1px solid var(--tl-border, #e7e5e4)'}}>
        {/* Progress fill */}
        <div className="absolute top-0 left-0 h-full rounded-full" style={{width: `${progress}%`, background: 'linear-gradient(90deg, #ec4899, #f472b6)'}} />

        {/* Exam markers */}
        {EXAM_SCHEDULE.map((exam, i) => {
          const pos = ((new Date(exam.date) - semStart) / totalSpan) * 100;
          const isPast = new Date(exam.date) < now;
          const isNext = nextExam && exam.label === nextExam.label;
          return (
            <div key={i} className="absolute" style={{left: `${Math.min(pos, 98)}%`, top: '-2px', transform: 'translateX(-50%)'}}>
              <div className="flex flex-col items-center" style={{width: '20px'}}>
                <div style={{
                  width: isNext ? 14 : 10,
                  height: isNext ? 14 : 10,
                  borderRadius: '50%',
                  background: exam.completed ? '#22c55e' : isNext ? '#ec4899' : isPast ? '#94a3b8' : '#cbd5e1',
                  border: isNext ? '2px solid #fff' : 'none',
                  boxShadow: isNext ? '0 0 0 2px #ec4899' : 'none',
                  marginTop: isNext ? '-1px' : '3px',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: '7px', color: '#fff', fontWeight: 700,
                }}>
                  {exam.completed && '✓'}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Legend row */}
      <div className="flex items-center justify-between mt-1">
        <div className="flex items-center gap-3 flex-wrap">
          {EXAM_SCHEDULE.map((exam, i) => {
            const isPast = new Date(exam.date) < now;
            return (
              <div key={i} className="flex items-center gap-1">
                <div style={{width: 6, height: 6, borderRadius: '50%', background: exam.completed ? '#22c55e' : isPast ? '#94a3b8' : '#ec4899'}} />
                <span className="mono text-[8px] text-stone-500">
                  {exam.label}{exam.completed ? ` ${exam.score}%` : ''}
                </span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ============== BREATHING EXERCISE ==============
function BreathingExercise({ onSave }) {
  const [mode, setMode] = useState(null); // null | 'box' | '478'
  const [phase, setPhase] = useState(''); // INHALE | HOLD | EXHALE
  const [phaseTime, setPhaseTime] = useState(0);
  const [totalTime, setTotalTime] = useState(0);
  const [cycles, setCycles] = useState(3);
  const [currentCycle, setCurrentCycle] = useState(0);
  const [running, setRunning] = useState(false);
  const intervalRef = useRef(null);

  const boxPattern = [
    { phase: 'INHALE', duration: 4 },
    { phase: 'HOLD', duration: 4 },
    { phase: 'EXHALE', duration: 4 },
    { phase: 'HOLD', duration: 4 },
  ];

  const pattern478 = [
    { phase: 'INHALE', duration: 4 },
    { phase: 'HOLD', duration: 7 },
    { phase: 'EXHALE', duration: 8 },
  ];

  useEffect(() => {
    if (!running || !mode) return;
    const pattern = mode === 'box' ? boxPattern : pattern478;
    let cycleIdx = 0;
    let stepIdx = 0;
    let countdown = pattern[0].duration;
    setPhase(pattern[0].phase);
    setPhaseTime(countdown);
    setCurrentCycle(1);

    intervalRef.current = setInterval(() => {
      countdown--;
      setPhaseTime(countdown);
      setTotalTime(t => t + 1);

      if (countdown <= 0) {
        stepIdx++;
        if (stepIdx >= pattern.length) {
          stepIdx = 0;
          cycleIdx++;
          if (cycleIdx >= cycles) {
            clearInterval(intervalRef.current);
            setRunning(false);
            const label = mode === 'box' ? 'Box Breathing' : '4-7-8 Breathing';
            if (onSave) onSave(cycles * (mode === 'box' ? 16 : 19), `${label} · ${cycles} cycles`);
            playChime();
            setMode(null);
            setPhase('');
            return;
          }
          setCurrentCycle(cycleIdx + 1);
        }
        countdown = pattern[stepIdx].duration;
        setPhase(pattern[stepIdx].phase);
        setPhaseTime(countdown);
      }
    }, 1000);

    return () => clearInterval(intervalRef.current);
  }, [running, mode, cycles]);

  const stop = () => {
    clearInterval(intervalRef.current);
    setRunning(false);
    setMode(null);
    setPhase('');
    setTotalTime(0);
  };

  if (running) {
    const circleScale = phase === 'INHALE' ? 'scale-100' : phase === 'EXHALE' ? 'scale-50' : 'scale-75';
    return (
      <div className="bg-stone-900 text-stone-50 rounded-2xl p-6 text-center">
        <p className="mono text-[9px] uppercase tracking-[0.2em] text-stone-400 mb-1">
          {mode === 'box' ? 'Box Breathing' : '4-7-8 Breathing'} · Cycle {currentCycle}/{cycles}
        </p>
        <div className="flex items-center justify-center my-6">
          <div className={`w-24 h-24 rounded-full bg-amber-400/30 border-2 border-amber-400 flex items-center justify-center transition-transform duration-1000 ${circleScale}`}>
            <div className="text-center">
              <p className="text-xl font-semibold text-amber-300">{phaseTime}</p>
            </div>
          </div>
        </div>
        <p className="text-lg font-medium text-amber-300 mb-4">{phase}</p>
        <button onClick={stop} className="bg-stone-700/50 px-6 py-2 rounded-full text-sm">Stop</button>
      </div>
    );
  }

  return (
    <div className="space-y-2">
      <div className="flex gap-2">
        <button onClick={() => { setMode('box'); setRunning(true); setTotalTime(0); }}
          className="flex-1 bg-white border border-stone-200 rounded-2xl p-3.5 text-left active:scale-95 transition-transform">
          <p className="text-sm font-medium text-stone-900">Box Breathing</p>
          <p className="text-[10px] text-stone-500">4-4-4-4 · calming</p>
        </button>
        <button onClick={() => { setMode('478'); setRunning(true); setTotalTime(0); }}
          className="flex-1 bg-white border border-stone-200 rounded-2xl p-3.5 text-left active:scale-95 transition-transform">
          <p className="text-sm font-medium text-stone-900">4-7-8 Breathing</p>
          <p className="text-[10px] text-stone-500">deep relaxation</p>
        </button>
      </div>
      <div className="flex gap-2 px-1">
        <p className="mono text-[10px] text-stone-400 flex-1">Cycles:</p>
        {[3, 5, 10].map(n => (
          <button key={n} onClick={() => setCycles(n)}
            className={`mono text-[10px] px-2 py-0.5 rounded-full ${cycles === n ? 'bg-stone-900 text-stone-50' : 'text-stone-500'}`}>
            {n}
          </button>
        ))}
      </div>
    </div>
  );
}

// ============== MEDITATION TIMER ==============
function MeditationTimer({ onSave, meditationLog, mindfulStreak }) {
  const [active, setActive] = useState(false);
  const [duration, setDuration] = useState(5);
  const [remaining, setRemaining] = useState(0);
  const [note, setNote] = useState('');
  const medStartRef = useRef(null);
  const medDurationRef = useRef(0);

  useEffect(() => {
    if (!active) return;
    const targetSec = medDurationRef.current;
    const t = setInterval(() => {
      const elapsed = Math.floor((Date.now() - medStartRef.current) / 1000);
      const left = Math.max(0, targetSec - elapsed);
      setRemaining(left);
      if (left <= 0) {
        clearInterval(t);
        playChime();
        setActive(false);
      }
    }, 1000);
    return () => clearInterval(t);
  }, [active]);

  const start = () => {
    medStartRef.current = Date.now();
    medDurationRef.current = duration * 60;
    setRemaining(duration * 60);
    setActive(true);
  };

  const finish = () => {
    const elapsed = Math.floor((Date.now() - medStartRef.current) / 1000);
    onSave(elapsed, note || `${duration}-min meditation`);
    playChime();
    setActive(false);
    setRemaining(0);
    setNote('');
  };

  const fmt = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

  if (active) {
    return (
      <div className="bg-indigo-900 text-indigo-50 rounded-2xl p-4">
        <div className="flex items-center justify-between mb-2">
          <div>
            <p className="mono text-[10px] uppercase tracking-wider text-indigo-300 mb-0.5">Meditating</p>
            <p className="mono text-2xl font-semibold">{fmt(remaining)}</p>
          </div>
          <div className="flex gap-2">
            <button onClick={finish} className="bg-indigo-700/50 px-4 py-2 rounded-full text-sm">Done</button>
          </div>
        </div>
        <input type="text" value={note} onChange={e => setNote(e.target.value)} placeholder="Note (optional)"
          className="w-full mt-2 px-3 py-2 bg-indigo-800/50 border border-indigo-700 rounded-lg text-xs text-indigo-100 placeholder-indigo-400 focus:outline-none" />
      </div>
    );
  }

  return (
    <div className="bg-white rounded-2xl p-3.5 border border-stone-200">
      <div className="flex items-center justify-between mb-2">
        <p className="text-sm font-medium text-stone-900">Meditation</p>
      </div>
      <div className="flex gap-2 mb-2">
        {[5, 10, 15].map(n => (
          <button key={n} onClick={() => setDuration(n)}
            className={`flex-1 py-2 rounded-lg text-xs font-medium ${duration === n ? 'bg-stone-900 text-stone-50' : 'bg-stone-100 text-stone-600'}`}>
            {n} min
          </button>
        ))}
      </div>
      <button onClick={start} className="w-full bg-indigo-600 text-white rounded-lg py-2 text-xs font-medium">
        Start {duration}-min Meditation
      </button>
      {meditationLog.length > 0 && (
        <div className="mt-2 space-y-1">
          {meditationLog.slice().reverse().slice(0, 3).map((s, i) => (
            <div key={i} className="flex items-center gap-2 text-xs text-stone-600">
