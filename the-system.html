// ============== LAUNCH VIEW ==============
function LaunchView({ launchStarted, daysToLaunch, inAtlanta, examMode, nextExam, todayLaunchTasks, upcomingLaunchTask, launchDone, launchOverrides, onToggle, onReschedule, launchProgress, checkin, products, revenue, onAddRevenue, contentIdeas, onAddContentIdea, onRemoveContentIdea, engagement, onAddEngagement }) {
  const [showRevenueForm, setShowRevenueForm] = useState(false);
  const [revAmount, setRevAmount] = useState('');
  const [revNote, setRevNote] = useState('');
  const [ideaText, setIdeaText] = useState('');
  const [showEngagement, setShowEngagement] = useState(false);
  const [engPost, setEngPost] = useState('');
  const [engViews, setEngViews] = useState('');
  const [engLikes, setEngLikes] = useState('');
  const [engFollows, setEngFollows] = useState('');

  const phases = [...new Set(LAUNCH_TASKS.map(t => t.phase))];
  const tasksByPhase = phases.map(phase => ({ phase, tasks: LAUNCH_TASKS.filter(t => t.phase === phase) }));
  const totalRevenue = revenue.reduce((sum, r) => sum + r.amount, 0);

  // Next best action logic
  const getNextBestAction = () => {
    if (!checkin) return null;
    const energy = checkin.energy;
    const brain = checkin.brain;
    const queued = products.filter(p => p.stage === 'queued').length;
    const filmed = products.filter(p => p.stage === 'filmed').length;
    const edited = products.filter(p => p.stage === 'edited').length;
    const captioned = products.filter(p => p.stage === 'captioned').length;

    if (brain === 'hyper' && energy === 'high') {
      if (queued > 0) return { icon: '🎬', text: `Film ${queued} queued product${queued > 1 ? 's' : ''}. Peak energy = best content.`, action: 'Film' };
      return { icon: '✍️', text: 'Write 3 new video scripts while you\'re locked in.', action: 'Script' };
    }
    if (brain === 'normal' || energy === 'med') {
      if (filmed > 0) return { icon: '✂️', text: `Edit ${filmed} filmed video${filmed > 1 ? 's' : ''}. Medium energy = perfect for editing.`, action: 'Edit' };
      if (edited > 0) return { icon: '📝', text: `Add captions to ${edited} edited video${edited > 1 ? 's' : ''}.`, action: 'Caption' };
      return { icon: '🔍', text: 'Browse DHgate for trending products (15 min cap).', action: 'Browse' };
    }
    if (captioned > 0) return { icon: '📤', text: `Schedule ${captioned} captioned video${captioned > 1 ? 's' : ''}. Low effort, high impact.`, action: 'Schedule' };
    return { icon: '💡', text: 'Jot down content ideas. Low energy = planning mode.', action: 'Plan' };
  };

  const nextAction = launchStarted ? getNextBestAction() : null;

  if (!launchStarted) {
    return (
      <div className="space-y-4">
        <div className="bg-stone-900 text-stone-50 rounded-2xl p-5">
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-400 mb-2">🔒 Launch is locked</p>
          <p className="text-2xl font-light leading-tight">
            <span className="font-medium">Launch Day</span> in <span className="text-amber-300 font-semibold">{daysToLaunch} days</span>
          </p>
          <p className="text-xs text-stone-400 mt-2 leading-relaxed">Fri May 15 — the day after your exam. Setup tasks unlock then.</p>
        </div>
        {examMode && nextExam && (
          <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4">
            <p className="text-sm text-rose-900 leading-snug">
              <span className="font-medium">📚 Right now:</span> {nextExam.label} in {nextExam.daysAway} day{nextExam.daysAway===1?'':'s'}. This is the only thing.
            </p>
          </div>
        )}
        <div>
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-3 px-1">Preview · what's coming</p>
          <div className="space-y-3">
            {tasksByPhase.map(({ phase, tasks }) => (
              <div key={phase} className="bg-white rounded-2xl p-4 border border-stone-200 opacity-60">
                <p className="mono text-[9px] uppercase tracking-wider text-stone-500 mb-2">{phase} · {tasks.length} tasks</p>
                <div className="space-y-1">
                  {tasks.map(t => (
                    <p key={t.id} className="text-sm text-stone-700 flex items-center gap-2">
                      <span className="text-stone-300">○</span>
                      <span className="flex-1 truncate">{t.title}</span>
                      <span className="mono text-[10px] text-stone-400">{t.time}</span>
                    </p>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (inAtlanta) {
    return (
      <div className="bg-gradient-to-br from-purple-500 to-pink-500 text-white rounded-2xl p-5">
        <p className="mono text-[10px] uppercase tracking-[0.2em] opacity-80 mb-1">🌴 Atlanta Mode</p>
        <p className="text-2xl font-light leading-tight">Launch resumes <span className="font-medium">May 21</span></p>
        <p className="text-sm mt-2 opacity-90">Be present. Don Toliver awaits.</p>
      </div>
    );
  }

  return (
    <div className="space-y-4">
      {/* Next Best Action */}
      {nextAction && (
        <div className="bg-gradient-to-br from-amber-400 to-amber-600 text-amber-950 rounded-2xl p-4">
          <p className="mono text-[10px] uppercase tracking-[0.2em] mb-1">🎯 Next Best Action</p>
          <div className="flex items-start gap-3">
            <span className="text-2xl">{nextAction.icon}</span>
            <p className="text-sm font-medium leading-snug flex-1">{nextAction.text}</p>
          </div>
        </div>
      )}

      {/* Progress */}
      <div className="bg-white rounded-2xl p-4 border border-stone-200">
        <div className="flex items-center justify-between mb-2">
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500">Launch progress</p>
          <p className="mono text-xs font-semibold text-stone-900">{Math.round(launchProgress)}%</p>
        </div>
        <div className="h-2 bg-stone-100 rounded-full overflow-hidden">
          <div className="h-full bg-gradient-to-r from-amber-400 to-amber-600 rounded-full transition-all" style={{ width: `${launchProgress}%` }} />
        </div>
      </div>

      {/* Revenue tracker */}
      <div>
        <div className="flex items-center justify-between mb-2 px-1">
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500">Revenue</p>
          <div className="flex items-center gap-2">
            <span className="mono text-xs font-semibold text-emerald-700">${totalRevenue.toFixed(2)}</span>
            <button onClick={() => setShowRevenueForm(!showRevenueForm)} className="mono text-[10px] text-amber-700">+ Log</button>
          </div>
        </div>
        {showRevenueForm && (
          <div className="bg-white rounded-2xl p-3.5 border border-stone-200 mb-2">
            <div className="flex gap-2 mb-2">
              <input type="number" value={revAmount} onChange={e => setRevAmount(e.target.value)} placeholder="Amount ($)"
                className="flex-1 px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm text-stone-800 placeholder-stone-400 focus:outline-none" />
            </div>
            <input type="text" value={revNote} onChange={e => setRevNote(e.target.value)} placeholder="Source (e.g. DHgate commission)"
              className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm text-stone-800 placeholder-stone-400 focus:outline-none mb-2" />
            <button onClick={() => { if (revAmount) { onAddRevenue(revAmount, revNote); setRevAmount(''); setRevNote(''); setShowRevenueForm(false); } }}
              disabled={!revAmount} className="w-full bg-emerald-600 text-white rounded-lg py-2 text-xs font-medium disabled:opacity-40">
              Log Revenue
            </button>
          </div>
        )}
        {revenue.length > 0 && (
          <div className="space-y-1">
            {revenue.slice().reverse().slice(0, 5).map((r, i) => (
              <div key={i} className="bg-emerald-50 border border-emerald-100 rounded-xl p-2.5 flex items-center gap-2">
                <span className="mono text-xs font-bold text-emerald-700">${r.amount.toFixed(2)}</span>
                <span className="text-xs text-stone-600 flex-1 truncate">{r.note || 'Revenue'}</span>
                <span className="mono text-[9px] text-stone-400">{r.date}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Content Ideas */}
      <div>
        <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-2 px-1">Content Ideas</p>
        <div className="flex gap-2 mb-2">
          <input type="text" value={ideaText} onChange={e => setIdeaText(e.target.value)} placeholder="Quick idea..." onKeyDown={e => { if (e.key === 'Enter' && ideaText.trim()) { onAddContentIdea(ideaText); setIdeaText(''); } }}
            className="flex-1 px-3 py-2 bg-white border border-stone-200 rounded-lg text-sm text-stone-800 placeholder-stone-400 focus:outline-none" />
          <button onClick={() => { if (ideaText.trim()) { onAddContentIdea(ideaText); setIdeaText(''); } }}
            disabled={!ideaText.trim()} className="bg-stone-900 text-stone-50 rounded-lg px-3 py-2 text-xs font-medium disabled:opacity-40">+</button>
        </div>
        {contentIdeas.length > 0 && (
          <div className="space-y-1">
            {contentIdeas.slice(0, 8).map((idea, i) => (
              <div key={idea.id} className="bg-white rounded-xl p-2.5 border border-stone-200 flex items-center gap-2">
                <span className="text-amber-500">💡</span>
                <p className="text-xs text-stone-800 flex-1">{idea.text}</p>
                <button onClick={() => onRemoveContentIdea(idea.id)} className="text-stone-300 text-xs">✕</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Engagement Metrics */}
      <div>
        <div className="flex items-center justify-between mb-2 px-1">
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500">Engagement</p>
          <button onClick={() => setShowEngagement(!showEngagement)} className="mono text-[10px] text-amber-700">+ Log</button>
        </div>
        {showEngagement && (
          <div className="bg-white rounded-2xl p-3.5 border border-stone-200 mb-2">
            <input type="text" value={engPost} onChange={e => setEngPost(e.target.value)} placeholder="Post name"
              className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm text-stone-800 placeholder-stone-400 focus:outline-none mb-2" />
            <div className="grid grid-cols-3 gap-2 mb-2">
              <input type="number" value={engViews} onChange={e => setEngViews(e.target.value)} placeholder="Views"
                className="px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm text-stone-800 placeholder-stone-400 focus:outline-none" />
              <input type="number" value={engLikes} onChange={e => setEngLikes(e.target.value)} placeholder="Likes"
                className="px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm text-stone-800 placeholder-stone-400 focus:outline-none" />
              <input type="number" value={engFollows} onChange={e => setEngFollows(e.target.value)} placeholder="Follows"
                className="px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-sm text-stone-800 placeholder-stone-400 focus:outline-none" />
            </div>
            <button onClick={() => { if (engPost.trim()) { onAddEngagement(engPost, engViews, engLikes, engFollows); setEngPost(''); setEngViews(''); setEngLikes(''); setEngFollows(''); setShowEngagement(false); } }}
              disabled={!engPost.trim()} className="w-full bg-stone-900 text-stone-50 rounded-lg py-2 text-xs font-medium disabled:opacity-40">
              Log Engagement
            </button>
          </div>
        )}
        {engagement.length > 0 && (
          <div className="space-y-1">
            {engagement.slice().reverse().slice(0, 5).map((e, i) => (
              <div key={i} className="bg-white rounded-xl p-2.5 border border-stone-200">
                <p className="text-xs font-medium text-stone-800 mb-1">{e.postName}</p>
                <div className="flex gap-3 mono text-[10px] text-stone-500">
                  <span>👁️ {e.views}</span>
                  <span>❤️ {e.likes}</span>
                  <span>➕ {e.follows}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Today's launch tasks */}
      {todayLaunchTasks.length > 0 && (
        <div>
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-2 px-1">Today</p>
          <div className="space-y-2">
            {todayLaunchTasks.map(t => (
              <div key={t.id} className="rounded-2xl p-4 border-2 bg-amber-50 border-amber-300">
                <div className="flex items-start gap-3 mb-3">
                  <button onClick={() => onToggle(t.id)} className="mt-0.5 shrink-0 text-xl">⭕</button>
                  <div className="flex-1 min-w-0">
                    <p className="font-medium text-stone-900 leading-snug">{t.title}</p>
                    <p className="mono text-[10px] uppercase tracking-wider text-stone-500 mt-0.5">{t.time} · {t.load}{launchOverrides && launchOverrides[t.id] ? ' · rescheduled' : ''}</p>
                  </div>
                </div>
                {t.desc && <p className="text-sm text-stone-600 leading-snug mb-3 ml-9">{t.desc}</p>}
                <div className="flex items-center gap-2 ml-9">
                  {t.link && (
                    <a href={t.link} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1.5 bg-stone-900 text-stone-50 px-4 py-2 rounded-full text-xs font-medium">
                      {t.linkLabel} ↗
                    </a>
                  )}
                  <button onClick={() => onReschedule(t.id)} className="inline-flex items-center gap-1 bg-stone-200 text-stone-700 px-3 py-2 rounded-full text-xs font-medium">
                    → Tomorrow
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* All tasks */}
      <div>
        <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-2 px-1">All tasks</p>
        <div className="space-y-3">
          {tasksByPhase.map(({ phase, tasks }) => (
            <div key={phase} className="bg-white rounded-2xl p-4 border border-stone-200">
              <p className="mono text-[9px] uppercase tracking-wider text-stone-500 mb-2">{phase}</p>
              <div className="space-y-2">
                {tasks.map(t => (
                  <div key={t.id} className="flex items-center gap-2.5">
                    <button onClick={() => onToggle(t.id)} className="shrink-0 text-base">{launchDone[t.id] ? '✅' : '⭕'}</button>
                    <div className="flex-1 min-w-0">
                      <span className={`text-sm ${launchDone[t.id] ? 'line-through text-stone-400' : 'text-stone-800'}`}>{t.title}</span>
                    </div>
                    {t.link && !launchDone[t.id] && (
                      <a href={t.link} target="_blank" rel="noopener noreferrer" className="text-stone-400 shrink-0 text-xs">↗</a>
                    )}
                    <span className="mono text-[10px] text-stone-400 shrink-0">{t.time}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ============== ROAD VIEW ==============
function RoadView({ events, customEvents, onSaveEvent, onDeleteEvent }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const blank = { label: '', date: '', type: 'event', detail: '', icon: '' };
  const [form, setForm] = useState(blank);

  const openAdd = () => { setForm(blank); setEditing(null); setShowForm(true); };
  const openEdit = (e) => { setForm({ label: e.label, date: e.date, type: e.type, detail: e.detail || '', icon: e.icon || '' }); setEditing(e.id); setShowForm(true); };
  const closeForm = () => { setShowForm(false); setEditing(null); };
  const handleSave = () => {
    if (!form.label.trim() || !form.date) return;
    onSaveEvent(editing ? { ...form, id: editing, custom: true } : form);
    closeForm();
  };

  const grouped = useMemo(() => {
    const b = { thisWeek: [], next2Weeks: [], later: [] };
    events.forEach(e => {
      if (e.daysAway <= 7) b.thisWeek.push(e);
      else if (e.daysAway <= 21) b.next2Weeks.push(e);
      else b.later.push(e);
    });
    return b;
  }, [events]);

  const typeStyle = (t) => ({
    exam: { bg: 'bg-rose-50', border: 'border-rose-200', icon: '📚', label: 'EXAM' },
    final: { bg: 'bg-rose-100', border: 'border-rose-300', icon: '📚', label: 'FINAL' },
    quiz: { bg: 'bg-amber-50', border: 'border-amber-200', icon: '✏️', label: 'QUIZ' },
    milestone: { bg: 'bg-emerald-50', border: 'border-emerald-200', icon: '🎯', label: 'MILESTONE' },
    break: { bg: 'bg-blue-50', border: 'border-blue-200', icon: '🌴', label: 'BREAK' },
    travel: { bg: 'bg-purple-50', border: 'border-purple-200', icon: '✈️', label: 'TRAVEL' },
    concert: { bg: 'bg-pink-50', border: 'border-pink-200', icon: '🎤', label: 'CONCERT' },
    event: { bg: 'bg-indigo-50', border: 'border-indigo-200', icon: '🎉', label: 'EVENT' },
    holiday: { bg: 'bg-stone-100', border: 'border-stone-200', icon: '🇺🇸', label: 'HOLIDAY' },
    work: { bg: 'bg-sky-50', border: 'border-sky-200', icon: '💼', label: 'WORK' },
  }[t] || { bg: 'bg-stone-50', border: 'border-stone-200', icon: '📌', label: 'EVENT' });

  const isCustom = (e) => !!e.custom;

  const renderEvent = (e, i) => {
    const s = typeStyle(e.type);
    const dateOnly = e.date.includes('T') ? e.date.split('T')[0] : e.date;
    const d = new Date(dateOnly + 'T12:00:00');
    return (
      <div key={e.id || i} className={`${s.bg} ${s.border} border rounded-2xl p-3 flex items-start gap-3`}>
        <div className="text-xl shrink-0">{e.icon || s.icon}</div>
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 mb-0.5">
            <p className="mono text-[9px] uppercase tracking-wider text-stone-500">{s.label}</p>
            <span className="mono text-[9px] text-stone-400">·</span>
            <p className="mono text-[9px] text-stone-500">{d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</p>
            {isCustom(e) && <span className="mono text-[9px] bg-indigo-100 text-indigo-500 px-1.5 rounded-full">custom</span>}
          </div>
          <p className="font-medium text-stone-900 text-sm leading-snug">{e.label}</p>
          {e.detail && <p className="text-xs text-stone-600 mt-0.5">{e.detail}</p>}
        </div>
        <div className="flex flex-col items-end gap-1 shrink-0">
          <div className="text-right">
            <p className="mono text-[9px] uppercase text-stone-400">in</p>
            <p className="mono text-xs font-semibold text-stone-900">{e.daysAway === 0 ? 'today' : `${e.daysAway}d`}</p>
          </div>
          {isCustom(e) && (
            <div className="flex gap-1 mt-1">
              <button onClick={() => openEdit(e)} className="text-[10px] px-2 py-0.5 bg-stone-200 rounded-full text-stone-600">edit</button>
              <button onClick={() => onDeleteEvent(e.id)} className="text-[10px] px-2 py-0.5 bg-rose-100 rounded-full text-rose-500">del</button>
            </div>
          )}
        </div>
      </div>
    );
  };

  const TYPE_OPTIONS = ['event','exam','quiz','final','milestone','break','travel','concert','holiday','work'];

  return (
    <div className="space-y-4">
      <div className="bg-stone-900 text-stone-50 rounded-2xl p-4 flex items-center gap-3">
        <span className="text-amber-400 text-xl shrink-0">→</span>
        <div className="flex-1">
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-400">The road ahead</p>
          <p className="text-xs text-stone-300 mt-0.5">{grouped.thisWeek.length} this week · {grouped.next2Weeks.length} coming up</p>
        </div>
        <button onClick={openAdd} className="bg-amber-400 text-stone-900 rounded-xl px-3 py-1.5 text-xs font-semibold mono">+ Add</button>
      </div>

      {showForm && (
        <div className="bg-white border border-stone-200 rounded-2xl p-4 space-y-3">
          <p className="mono text-[10px] uppercase tracking-wider text-stone-500">{editing ? 'Edit event' : 'New event'}</p>
          <input
            className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-900 bg-stone-50"
            placeholder="Event name *"
            value={form.label}
            onChange={e => setForm(f => ({ ...f, label: e.target.value }))}
          />
          <input
            type="date"
            className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-900 bg-stone-50"
            value={form.date}
            onChange={e => setForm(f => ({ ...f, date: e.target.value }))}
          />
          <select
            className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-900 bg-stone-50"
            value={form.type}
            onChange={e => setForm(f => ({ ...f, type: e.target.value }))}
          >
            {TYPE_OPTIONS.map(t => <option key={t} value={t}>{t.charAt(0).toUpperCase() + t.slice(1)}</option>)}
          </select>
          <input
            className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-900 bg-stone-50"
            placeholder="Details (optional)"
            value={form.detail}
            onChange={e => setForm(f => ({ ...f, detail: e.target.value }))}
          />
          <input
            className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-900 bg-stone-50"
            placeholder="Emoji icon (optional, e.g. 🎂)"
            value={form.icon}
            onChange={e => setForm(f => ({ ...f, icon: e.target.value }))}
          />
          <div className="flex gap-2">
            <button onClick={handleSave} className="flex-1 bg-stone-900 text-white rounded-xl py-2 text-sm font-semibold">Save</button>
            <button onClick={closeForm} className="flex-1 bg-stone-100 text-stone-600 rounded-xl py-2 text-sm">Cancel</button>
          </div>
        </div>
      )}

      {grouped.thisWeek.length > 0 && (
        <div>
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-2 px-1">This week</p>
          <div className="space-y-2">{grouped.thisWeek.map(renderEvent)}</div>
        </div>
      )}
      {grouped.next2Weeks.length > 0 && (
        <div>
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-2 px-1">Next 2 weeks</p>
          <div className="space-y-2">{grouped.next2Weeks.map(renderEvent)}</div>
        </div>
      )}
      {grouped.later.length > 0 && (
        <div>
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-2 px-1">Coming up</p>
          <div className="space-y-2">{grouped.later.slice(0, 12).map(renderEvent)}</div>
        </div>
      )}
    </div>
  );
}

// ============== PIPELINE VIEW ==============
function PipelineView({ products, onAdd, onAdvance, onDelete, examMode, inAtlanta }) {
  const stages = [
    { id: 'queued', label: 'Queued', icon: '📦' },
    { id: 'filmed', label: 'Filmed', icon: '🎬' },
    { id: 'edited', label: 'Edited', icon: '✂️' },
    { id: 'captioned', label: 'Captioned', icon: '📝' },
    { id: 'scheduled', label: 'Scheduled', icon: '📤' },
    { id: 'posted', label: 'Posted', icon: '🚀' },
  ];
  const cc = { shoes: 'bg-orange-100 text-orange-800', tech: 'bg-blue-100 text-blue-800', fashion: 'bg-pink-100 text-pink-800', jewelry: 'bg-purple-100 text-purple-800' };
  return (
    <div className="space-y-3">
      {(examMode || inAtlanta) && (
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3.5">
          <p className="text-xs text-amber-900 leading-snug">
            <span className="font-medium">{inAtlanta ? '🌴 Atlanta mode:' : '📚 Exam mode:'}</span> {inAtlanta ? 'hustle paused.' : 'no filming until exam done.'}
          </p>
        </div>
      )}
      <button onClick={onAdd} className="w-full bg-stone-900 text-stone-50 rounded-2xl py-3.5 flex items-center justify-center gap-2 font-medium">+ Add product</button>
      {products.length === 0 && (
        <div className="text-center py-10 px-6">
          <p className="text-5xl mb-3">📦</p>
          <p className="text-stone-600 text-sm">Empty pipeline. Add when you order a sample.</p>
        </div>
      )}
      {stages.map(stage => {
        const items = products.filter(p => p.stage === stage.id);
        if (items.length === 0) return null;
        return (
          <div key={stage.id}>
            <div className="flex items-center justify-between mb-1.5 px-1">
              <div className="flex items-center gap-2">
                <span>{stage.icon}</span>
                <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500">{stage.label}</p>
              </div>
              <span className="mono text-[10px] text-stone-400">{items.length}</span>
            </div>
            <div className="space-y-2">
              {items.map(p => (
                <div key={p.id} className="bg-white rounded-2xl p-3 border border-stone-200">
                  <div className="flex items-start justify-between gap-3 mb-1">
                    <div className="flex-1">
                      <p className="font-medium text-stone-900 text-sm leading-snug">{p.name}</p>
                      <span className={`inline-block mono text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full mt-1 ${cc[p.category]}`}>{p.category}</span>
                    </div>
                    <button onClick={() => onDelete(p.id)} className="text-stone-300 p-1 text-xs">🗑</button>
                  </div>
                  {p.notes && <p className="text-xs text-stone-500 mb-2">{p.notes}</p>}
                  {p.stage !== 'posted' && (
                    <button onClick={() => onAdvance(p.id)} className="w-full bg-stone-100 rounded-xl py-2 flex items-center justify-center gap-1 text-xs font-medium text-stone-800">
                      → {stages[stages.findIndex(s => s.id === p.stage) + 1]?.label}
                    </button>
                  )}
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ============== STATS VIEW ==============
function StatsView({ history, products, streak, nextExam, allLogs, lastSync, onGenerateSync, showSyncImport, setShowSyncImport, syncCode, setSyncCode, onImportSync, allStudyLogs, revenue, mindfulStreak, ritualStreak, examHistory, quizLog }) {
  const totalPosts = products.filter(p => p.stage === 'posted').length;
  const totalRevenue = revenue.reduce((sum, r) => sum + r.amount, 0);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const logStats = useMemo(() => {
    let totalSuggestionsDone = 0;
    let totalAnki = 0;
    const recentLogs = [];
    Object.entries(allLogs || {}).forEach(([date, log]) => {
      const sCount = Object.values(log.suggestions || {}).filter(s => s.done).length;
      totalSuggestionsDone += sCount;
      const aCount = (log.anki || []).length;
      totalAnki += aCount;
      if (sCount > 0 || aCount > 0) {
        recentLogs.push({ date, suggestions: sCount, anki: aCount, anki_notes: log.anki || [], suggestion_notes: Object.values(log.suggestions || {}).filter(s => s.done && s.note) });
      }
    });
    return { totalSuggestionsDone, totalAnki, recentLogs: recentLogs.slice(-7).reverse() };
  }, [allLogs]);

  // Total study time
  const totalStudyMin = useMemo(() => {
    let total = 0;
    Object.values(allStudyLogs || {}).forEach(logs => {
      total += logs.reduce((sum, s) => sum + Math.round(s.duration / 60), 0);
    });
    return total;
  }, [allStudyLogs]);

  const dp = {};
  history.forEach(h => {
    const d = new Date(h.date).getDay();
    if (!dp[d]) dp[d] = { high:0, med:0, low:0, total:0 };
    dp[d][h.energy] = (dp[d][h.energy]||0)+1;
    dp[d].total += 1;
  });

  return (
    <div className="space-y-4">
      {/* Cumulative-only stats — no streaks. Every number here only goes UP. */}
      <div className="grid grid-cols-3 gap-2">
        <div className="bg-white rounded-2xl p-3 border border-stone-200">
          <div className="text-xl mb-1">🌱</div>
          <div className="text-xl font-medium text-stone-900">{computeDaysInSystem()}</div>
          <div className="mono text-[9px] uppercase tracking-wider text-stone-500">days in</div>
        </div>
        <div className="bg-white rounded-2xl p-3 border border-stone-200">
          <div className="text-xl mb-1">✅</div>
          <div className="text-xl font-medium text-stone-900">{logStats.totalSuggestionsDone}</div>
          <div className="mono text-[9px] uppercase tracking-wider text-stone-500">tasks done</div>
        </div>
        <div className="bg-white rounded-2xl p-3 border border-stone-200">
          <div className="text-xl mb-1">🃏</div>
          <div className="text-xl font-medium text-stone-900">{logStats.totalAnki}</div>
          <div className="mono text-[9px] uppercase tracking-wider text-stone-500">anki</div>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-2">
        <div className="bg-white rounded-2xl p-3 border border-stone-200">
          <div className="text-xl mb-1">📖</div>
          <div className="text-xl font-medium text-stone-900">{totalStudyMin}m</div>
          <div className="mono text-[9px] uppercase tracking-wider text-stone-500">study time</div>
        </div>
        <div className="bg-white rounded-2xl p-3 border border-stone-200">
          <div className="text-xl mb-1">📝</div>
          <div className="text-xl font-medium text-stone-900">{(examHistory || []).length}</div>
          <div className="mono text-[9px] uppercase tracking-wider text-stone-500">exams taken</div>
        </div>
        <div className="bg-white rounded-2xl p-3 border border-stone-200">
          <div className="text-xl mb-1">💰</div>
          <div className="text-xl font-medium text-stone-900">${totalRevenue.toFixed(0)}</div>
          <div className="mono text-[9px] uppercase tracking-wider text-stone-500">revenue</div>
        </div>
      </div>

      {/* Practice Exam Scores */}
      {examHistory && examHistory.length > 0 && (
        <div>
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-2 px-1">Practice Exam Scores</p>
          <div className="space-y-2">
            {[...examHistory].sort((a,b) => new Date(b.date) - new Date(a.date)).map((e, i) => {
              const color = e.score >= 90 ? 'text-emerald-600' : e.score >= 78 ? 'text-amber-600' : 'text-red-500';
              const bg = e.score >= 90 ? 'bg-emerald-50 border-emerald-200' : e.score >= 78 ? 'bg-amber-50 border-amber-200' : 'bg-red-50 border-red-200';
              return (
                <div key={i} className={`rounded-2xl p-3.5 border ${bg}`}>
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-sm font-medium text-stone-900">{e.examLabel}</p>
                    <span className={`mono text-sm font-bold ${color}`}>{e.score}%</span>
                  </div>
                  <p className="text-[10px] text-stone-400 mono mb-1.5">{new Date(e.date).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · {e.correct}/{e.total} correct</p>
                  {e.weakAreas && e.weakAreas.length > 0 && (
                    <div className="flex flex-wrap gap-1">
                      {e.weakAreas.map((w, j) => (
                        <span key={j} className="mono text-[9px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full">{w}</span>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Logged NotebookLM Quizzes */}
      {quizLog && quizLog.length > 0 && (
        <div>
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-2 px-1">Logged NotebookLM Quizzes</p>
          <div className="space-y-2">
            {[...quizLog].reverse().map((q, i) => {
              const color = q.score >= 90 ? 'text-emerald-600' : q.score >= 78 ? 'text-amber-600' : 'text-red-500';
              const bg = q.score >= 90 ? 'bg-emerald-50 border-emerald-200' : q.score >= 78 ? 'bg-amber-50 border-amber-200' : 'bg-red-50 border-red-200';
              return (
                <div key={i} className={`rounded-2xl p-3.5 border ${bg}`}>
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-sm font-medium text-stone-900">{q.name}</p>
                    <span className={`mono text-sm font-bold ${color}`}>{q.score}%</span>
                  </div>
                  <p className="text-[10px] text-stone-400 mono">{q.date}{q.notes ? ' · ' + q.notes : ''}</p>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Sync section */}
      <div className="bg-white rounded-2xl p-4 border border-stone-200">
        <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-3">Sync</p>
        {lastSync && (
          <p className="text-[10px] text-stone-400 mb-2">Last synced: {new Date(lastSync).toLocaleString()}</p>
        )}
        <div className="flex gap-2 mb-2">
          <button onClick={onGenerateSync} className="flex-1 bg-stone-900 text-stone-50 rounded-lg py-2.5 text-xs font-medium">
            Generate Sync Code
          </button>
          <button onClick={() => setShowSyncImport(!showSyncImport)} className="flex-1 bg-stone-100 text-stone-700 rounded-lg py-2.5 text-xs font-medium">
            Import Sync Code
          </button>
        </div>
        {showSyncImport && (
          <div>
            <textarea value={syncCode} onChange={e => setSyncCode(e.target.value)} placeholder="Paste sync code here..." rows={3}
              className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-lg text-xs text-stone-800 placeholder-stone-400 focus:outline-none resize-none mb-2 mono" />
            <button onClick={onImportSync} disabled={!syncCode.trim()} className="w-full bg-amber-600 text-white rounded-lg py-2 text-xs font-medium disabled:opacity-40">
              Import & Reload
            </button>
          </div>
        )}
      </div>

      {logStats.recentLogs.length > 0 && (
        <div>
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-2 px-1">Your wins · last 7 active days</p>
          <div className="space-y-2">
            {logStats.recentLogs.map((l, i) => {
              const d = new Date(l.date);
              return (
                <div key={i} className="bg-white rounded-2xl p-3.5 border border-stone-200">
                  <div className="flex items-baseline justify-between mb-2">
                    <p className="text-sm font-medium text-stone-900">{d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</p>
                    <div className="flex gap-2">
                      {l.suggestions > 0 && <span className="mono text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">{l.suggestions} tasks</span>}
                      {l.anki > 0 && <span className="mono text-[10px] bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full">{l.anki} anki</span>}
                    </div>
                  </div>
                  {l.suggestion_notes.length > 0 && (
                    <div className="space-y-1 mb-1.5">
                      {l.suggestion_notes.map((s, j) => <p key={j} className="text-xs text-stone-700 leading-snug">✓ {s.note}</p>)}
                    </div>
                  )}
                  {l.anki_notes.length > 0 && (
                    <div className="space-y-1">
                      {l.anki_notes.map((s, j) => <p key={j} className="text-xs text-purple-800 leading-snug">🃏 {s.note}</p>)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="bg-white rounded-2xl p-4 border border-stone-200">
        <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-500 mb-1">Patterns</p>
        <p className="text-base font-medium text-stone-900 mb-3">Energy by day</p>
        {history.length < 5 ? (
          <p className="text-xs text-stone-500 italic">Need 5+ check-ins for patterns.</p>
        ) : (
          <div className="space-y-2">
            {days.map((d, i) => {
              const p = dp[i];
              if (!p) return <div key={i} className="flex items-center gap-3"><span className="mono text-xs w-8 text-stone-400">{d}</span><span className="text-xs text-stone-300">no data</span></div>;
              return (
                <div key={i} className="flex items-center gap-3">
                  <span className="mono text-xs w-8 text-stone-700 font-medium">{d}</span>
                  <div className="flex-1 h-4 rounded-full overflow-hidden flex bg-stone-100">
                    {p.high > 0 && <div className="bg-emerald-400" style={{width:`${(p.high/p.total)*100}%`}} />}
                    {p.med > 0 && <div className="bg-amber-300" style={{width:`${(p.med/p.total)*100}%`}} />}
                    {p.low > 0 && <div className="bg-rose-300" style={{width:`${(p.low/p.total)*100}%`}} />}
                  </div>
                  <span className="mono text-[10px] text-stone-400 w-5 text-right">{p.total}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {nextExam && (
        <div className="bg-stone-900 text-stone-50 rounded-2xl p-4">
          <p className="mono text-[10px] uppercase tracking-[0.2em] text-stone-400 mb-1">🎓 Next target</p>
          <p className="text-lg font-medium leading-snug">{nextExam.label}</p>
          <p className="text-xs text-stone-400 mt-1">{nextExam.detail} · {formatETA(nextExam.date)}</p>
        </div>
      )}

      <div className="bg-pink-50 border border-pink-200 rounded-2xl p-3.5">
        <p className="text-sm text-stone-800 leading-snug">
          <span className="font-medium">💗 Reality check:</span> 81.94% avg. 88.89% completion. Extern. Building this. You're doing it.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
