<script>
const EXAM_ID='ms1-exam3-nlm-ch18-drill';
const EXAM_LABEL='Ch 18 NLM Drill — Cancer (20Q)';
const questions=[
{id:1,chapter:18,difficulty:'medium',sata:false,trap:true,
stem:'A nursing student states, "Carcinogenesis starts with initiation, but if we catch it early enough, we can reverse the DNA damage." How should the professor respond?',
options:[
{letter:'A',text:'"You are correct — initiation is reversible if the cell undergoes apoptosis before promotion begins."',correct:false,rationale:'Initiation is NOT reversible. This is the trap — apoptosis can destroy the cell, but the DNA damage itself cannot be "un-done."'},
{letter:'B',text:'"Initiation is irreversible. Once a cell\'s DNA is damaged by a carcinogen, that change is permanent."',correct:true,rationale:'The professor explicitly stated "make sure it\'s irreversible" regarding initiation. The DNA mutation from the carcinogen is permanent and cannot be reversed.'},
{letter:'C',text:'"Initiation can be reversed with chemoprevention drugs like tamoxifen."',correct:false,rationale:'Chemoprevention can prevent new cancers (primary prevention) but cannot reverse DNA damage that has already occurred during initiation.'},
{letter:'D',text:'"Only the metastasis stage is irreversible; all earlier stages can be treated."',correct:false,rationale:'Initiation is also irreversible. The entire carcinogenesis pathway from initiation onward involves permanent cellular changes.'}
],vocabTip:'What This Was Testing: Initiation = IRREVERSIBLE DNA damage. Test Clue: "Can we reverse," "early enough," "undo." Fast Rule: If you see [initiation] → think [irreversible DNA damage — cannot be undone].'},

{id:2,chapter:18,difficulty:'medium',sata:false,trap:false,
stem:'A patient is diagnosed with estrogen receptor-positive breast cancer. The oncologist explains that estrogen acts as a "promoter" in carcinogenesis. The nurse understands that promotion means:',
options:[
{letter:'A',text:'The hormone permanently changes the cell\'s DNA structure.',correct:false,rationale:'DNA damage occurs during INITIATION, not promotion. Promotion does not change DNA — it accelerates growth of already-initiated cells.'},
{letter:'B',text:'The hormone enhances growth and frequent division of an already-initiated cancer cell.',correct:true,rationale:'Promotion is the stage where substances like hormones (estrogen) or insulin act as fuel to speed up the growth and replication of cells that already have damaged DNA from initiation.'},
{letter:'C',text:'The cancer develops its own blood supply to sustain rapid growth.',correct:false,rationale:'Developing its own blood supply (tumor vascularization) occurs during PROGRESSION, not promotion.'},
{letter:'D',text:'The cancer cells break off and travel to distant organs via the bloodstream.',correct:false,rationale:'Breaking off and traveling to distant sites is METASTASIS, the fourth and final stage.'}
],vocabTip:'What This Was Testing: Promotion stage — hormones as fuel. Test Clue: "Estrogen," "insulin," "enhanced growth," "promoter." Fast Rule: If you see [hormones fueling cancer growth] → think [Promotion stage of carcinogenesis].'},

{id:3,chapter:18,difficulty:'hard',sata:false,trap:false,
stem:'A patient with colon cancer is found to have tumors in the liver. The surgeon explains these are "secondary tumors." The patient asks, "Do I now have liver cancer too?" What is the nurse\'s best response?',
options:[
{letter:'A',text:'"Yes, you now have two separate cancers that require different treatments."',correct:false,rationale:'Secondary tumors are NOT new separate cancers. They are the SAME cancer type that has metastasized.'},
{letter:'B',text:'"No — the tumors in your liver are still colon cancer cells that traveled there. We treat the parent tissue type, not the location."',correct:true,rationale:'The professor stressed that secondary (metastatic) tumors maintain the identity of the PRIMARY parent tissue. A colon cancer metastasis to the liver is still colon cancer and is treated as colon cancer — not as liver cancer.'},
{letter:'C',text:'"The liver tumors are benign — only the colon tumor is malignant."',correct:false,rationale:'Metastatic tumors are malignant by definition — they have broken off from the primary site and invaded a distant organ.'},
{letter:'D',text:'"We cannot determine the origin of secondary tumors without genetic testing."',correct:false,rationale:'Secondary tumors are identified by their histology matching the primary tumor. Biopsy confirms they are the same cell type as the parent tissue.'}
],vocabTip:'What This Was Testing: Primary vs. Secondary tumors — must know parent tissue to treat. Test Clue: "Tumors found in distant organ," "secondary." Fast Rule: If you see [secondary tumor] → think [same cancer as parent tissue; treat based on origin, not current location].'},

{id:4,chapter:18,difficulty:'medium',sata:false,trap:true,
stem:'A patient tests positive for the BRCA1 gene mutation. She tells the nurse, "I just found out I have cancer." What is the nurse\'s most appropriate response?',
options:[
{letter:'A',text:'"I\'m so sorry. Let me connect you with our oncology team to begin treatment."',correct:false,rationale:'The BRCA1 gene does NOT mean the patient HAS cancer. Initiating treatment is inappropriate and harmful.'},
{letter:'B',text:'"A positive genetic test provides risk information only — it does not diagnose cancer or guarantee you will develop it."',correct:true,rationale:'The professor emphasized that genetic testing only provides RISK information. Testing positive for BRCA1/2 increases risk significantly but is not a 100% guarantee of cancer development.'},
{letter:'C',text:'"You should immediately schedule a bilateral mastectomy to prevent cancer from developing."',correct:false,rationale:'While prophylactic surgery is an option for high-risk patients, it is a personal decision made with genetic counseling — not an immediate mandate from a positive test.'},
{letter:'D',text:'"Don\'t worry — genetic tests are often inaccurate and this is likely a false positive."',correct:false,rationale:'Dismissing the result is inappropriate. The test is valid and the patient needs education and referral to a genetic counselor.'}
],vocabTip:'What This Was Testing: Genetic testing = risk info ONLY, not a diagnosis. Test Clue: "Tested positive for gene," "BRCA," "does this mean I have cancer." Fast Rule: If you see [positive genetic test] → think [risk information only — NOT a cancer diagnosis].'},

{id:5,chapter:18,difficulty:'medium',sata:true,trap:false,
stem:'A nurse is teaching a community health class about primary cancer prevention. Which of the following are examples of PRIMARY prevention strategies?',
options:[
{letter:'A',text:'Annual mammograms beginning at age 40.',correct:false,rationale:'Mammograms are SECONDARY prevention (screening/early detection), not primary prevention.'},
{letter:'B',text:'Applying sunscreen daily and avoiding tanning beds.',correct:true,rationale:'Avoiding known carcinogens (UV radiation) is a primary prevention strategy — stopping cancer before it starts.'},
{letter:'C',text:'Receiving the HPV vaccine series.',correct:true,rationale:'Vaccination against cancer-causing viruses is primary prevention (chemoprevention/immunoprevention).'},
{letter:'D',text:'A patient with BRCA1 mutation electing prophylactic bilateral mastectomy.',correct:true,rationale:'Removal of "at-risk" tissue before cancer develops is a primary prevention strategy.'},
{letter:'E',text:'Annual fecal occult blood testing starting at age 45.',correct:false,rationale:'Fecal occult blood test is a SCREENING tool — secondary prevention, not primary.'}
],vocabTip:'What This Was Testing: Primary vs. Secondary cancer prevention. Test Clue: "Primary = stop it BEFORE it happens." Fast Rule: If you see [avoid carcinogens / vaccines / remove at-risk tissue] → think [Primary Prevention]; [screening tests] → think [Secondary Prevention].'},

{id:6,chapter:18,difficulty:'medium',sata:false,trap:false,
stem:'A surgeon explains to a patient, "We are going to reduce the size of your tumor before starting chemotherapy. This won\'t cure the cancer, but it will improve your response to chemo." This surgical intent is classified as:',
options:[
{letter:'A',text:'Curative surgery',correct:false,rationale:'Curative surgery removes the ENTIRE tumor with the intent to cure. The surgeon explicitly stated this won\'t cure the cancer.'},
{letter:'B',text:'Debulking surgery',correct:true,rationale:'Debulking decreases tumor size to alleviate symptoms or improve the effectiveness of other treatments (like chemo). The professor had a student read this definition aloud and stressed it is NOT curative.'},
{letter:'C',text:'Palliative surgery',correct:false,rationale:'Palliative surgery provides comfort and symptom relief but is not aimed at improving treatment response.'},
{letter:'D',text:'Diagnostic surgery',correct:false,rationale:'Diagnostic surgery involves taking a tissue sample (biopsy) to test, not reducing tumor size.'}
],vocabTip:'What This Was Testing: Surgical management categories — debulking. Test Clue: "Reduce size," "not curative," "improve other treatment." Fast Rule: If you see [shrink tumor but NOT cure] → think [Debulking surgery].'},

{id:7,chapter:18,difficulty:'hard',sata:false,trap:false,
stem:'A patient with cervical cancer has radioactive seeds implanted directly into the tumor (brachytherapy). The patient\'s spouse asks if they can sleep in the same bed tonight. What is the nurse\'s response?',
options:[
{letter:'A',text:'"Yes, brachytherapy does not make the patient radioactive."',correct:false,rationale:'This is WRONG. Brachytherapy uses internal radioactive seeds — the patient IS radioactive while the seeds are in place.'},
{letter:'B',text:'"No — while the radioactive seeds are in place, the patient is radioactive. You cannot share a bed or have prolonged close contact."',correct:true,rationale:'The professor stressed that brachytherapy patients ARE radioactive while internal seeds are present. Close contact must be limited to protect others from radiation exposure.'},
{letter:'C',text:'"Only if the door to the room remains open for ventilation."',correct:false,rationale:'Radiation from brachytherapy is not airborne — it is direct radiation from the implanted seeds. Ventilation does not make it safe.'},
{letter:'D',text:'"Yes, as long as the spouse wears a lead apron."',correct:false,rationale:'A lead apron is insufficient for prolonged close contact like sleeping in the same bed with a brachytherapy patient.'}
],vocabTip:'What This Was Testing: Brachytherapy = patient IS radioactive; External beam = patient is NOT radioactive. Test Clue: "Radioactive seeds," "implant," "internal radiation." Fast Rule: If you see [brachytherapy/internal seeds] → think [patient IS radioactive, limit close contact].'},

{id:8,chapter:18,difficulty:'easy',sata:false,trap:false,
stem:'A patient is scheduled for chemotherapy before surgery to shrink the tumor and make it operable. This sequencing of chemotherapy is called:',
options:[
{letter:'A',text:'Adjuvant chemotherapy',correct:false,rationale:'Adjuvant means AFTER surgery — it kills remaining cells after the tumor has been removed.'},
{letter:'B',text:'Neoadjuvant chemotherapy',correct:true,rationale:'The professor stressed knowing the difference: NEO = new/before. Neoadjuvant chemotherapy shrinks the tumor BEFORE surgery to make it operable or improve surgical outcomes.'},
{letter:'C',text:'Palliative chemotherapy',correct:false,rationale:'Palliative chemo is given for comfort when the cancer is not curable — not to prepare for surgery.'},
{letter:'D',text:'Maintenance chemotherapy',correct:false,rationale:'Maintenance chemo is given after initial treatment to prevent recurrence, not before surgery.'}
],vocabTip:'What This Was Testing: Neoadjuvant vs. Adjuvant chemo. Test Clue: "Neo = before." Fast Rule: If you see [chemo BEFORE surgery] → think [Neoadjuvant]; [chemo AFTER surgery] → think [Adjuvant].'},

{id:9,chapter:18,difficulty:'hard',sata:false,trap:false,
stem:'A patient receiving IV doxorubicin through a peripheral line suddenly reports severe burning pain at the IV site. The nurse notes swelling and redness around the insertion site. What has occurred and what is the priority action?',
options:[
{letter:'A',text:'A mild infiltration — slow the infusion rate and apply a warm compress.',correct:false,rationale:'This is NOT a mild infiltration. Doxorubicin is a vesicant — any leakage causes severe tissue destruction. Slowing the rate does NOT fix extravasation.'},
{letter:'B',text:'Extravasation of a vesicant drug — stop the infusion immediately, aspirate residual drug, and notify the provider.',correct:true,rationale:'Extravasation is the dangerous leakage of a vesicant IV drug into subcutaneous tissue. The professor said "you need to remember these things." Priority: stop infusion, aspirate residual drug if possible, notify provider, apply appropriate antidote per protocol.'},
{letter:'C',text:'An allergic reaction — administer epinephrine and call a rapid response.',correct:false,rationale:'The symptoms (localized burning, swelling at IV site) indicate local tissue damage from extravasation, not a systemic allergic reaction.'},
{letter:'D',text:'Expected side effect of chemotherapy — reassure the patient and continue the infusion.',correct:false,rationale:'Severe burning and swelling at the IV site is NEVER expected. Continuing the infusion would cause catastrophic tissue necrosis.'}
],vocabTip:'What This Was Testing: Extravasation of vesicant drugs. Test Clue: "Burning at IV site," "swelling around insertion," "vesicant." Fast Rule: If you see [burning/swelling at chemo IV site] → think [Extravasation — STOP immediately, aspirate, notify provider].'},

{id:10,chapter:18,difficulty:'medium',sata:false,trap:false,
stem:'A nurse is educating a patient who will be taking oral capecitabine (Xeloda) at home. Which statement by the patient indicates a need for further teaching?',
options:[
{letter:'A',text:'"I will wash my hands before and after handling the medication."',correct:false,rationale:'This is correct — oral chemo requires careful handling including hand hygiene.'},
{letter:'B',text:'"Since it\'s just a pill, it\'s much safer than the IV chemo I had before."',correct:true,rationale:'The professor emphasized that oral anticancer drugs are JUST AS TOXIC as IV chemotherapy — to both the patient taking the drug and anyone handling it. This misconception needs correction.'},
{letter:'C',text:'"I will store it away from children and pets."',correct:false,rationale:'This is correct — oral chemo must be kept away from others due to its toxicity.'},
{letter:'D',text:'"I should not crush or split the tablets."',correct:false,rationale:'This is correct — crushing releases toxic particles that can be inhaled or absorbed through skin.'}
],vocabTip:'What This Was Testing: Oral chemo is just as toxic as IV chemo. Test Clue: "Oral anticancer drug," "at home," "safety." Fast Rule: If you see [oral chemo] → think [just as toxic as IV, requires same handling precautions, cannot flush down toilet].'},

{id:11,chapter:18,difficulty:'medium',sata:false,trap:false,
stem:'A patient receiving cyclophosphamide has a WBC count that drops to its lowest level on day 10 post-treatment. The oncology nurse documents this as the:',
options:[
{letter:'A',text:'Therapeutic peak',correct:false,rationale:'A therapeutic peak refers to medication blood levels, not WBC suppression.'},
{letter:'B',text:'Nadir',correct:true,rationale:'The nadir is the period after chemotherapy when bone marrow suppression is the greatest and WBC/platelet counts are at their lowest levels — typically 7-10 days after administration. This is when infection risk is highest.'},
{letter:'C',text:'Rebound phase',correct:false,rationale:'There is no standard "rebound phase" term in oncology for this phenomenon.'},
{letter:'D',text:'Immune reconstitution',correct:false,rationale:'Immune reconstitution refers to the recovery of immune function, not the lowest point of suppression.'}
],vocabTip:'What This Was Testing: Nadir — lowest point of bone marrow suppression. Test Clue: "Lowest WBC count," "7-10 days post-chemo." Fast Rule: If you see [lowest blood counts after chemo] → think [Nadir — highest infection and bleeding risk].'},

{id:12,chapter:18,difficulty:'medium',sata:false,trap:false,
stem:'A neutropenic cancer patient develops oral sores (mucositis). The nurse prepares to provide mouth care. Which intervention should the nurse AVOID?',
options:[
{letter:'A',text:'Offering ice chips to soothe the oral mucosa.',correct:false,rationale:'Ice chips are appropriate — they soothe inflammation and provide comfort.'},
{letter:'B',text:'Using a soft-bristle toothbrush for gentle cleaning.',correct:false,rationale:'A soft toothbrush is appropriate to prevent further mucosal damage.'},
{letter:'C',text:'Providing an alcohol-based commercial mouthwash.',correct:true,rationale:'The professor asked the class "what do you definitely not want to give them?" — alcohol-based mouthwash BURNS and DRIES the already-damaged oral mucosa, worsening mucositis significantly.'},
{letter:'D',text:'Rinsing with a baking soda and water solution.',correct:false,rationale:'Baking soda rinses are gentle and appropriate for mucositis care.'}
],vocabTip:'What This Was Testing: Mucositis care — what to AVOID. Test Clue: "Oral sores," "mouth care," "what to avoid." Fast Rule: If you see [mucositis care] → think [NO alcohol mouthwash, NO acidic foods; YES to ice chips, soft brush, baking soda rinse].'},

{id:13,chapter:18,difficulty:'easy',sata:false,trap:false,
stem:'A patient who completed 6 cycles of chemotherapy notices their hair beginning to grow back. They are surprised that the new hair is a different color and texture. The nurse explains:',
options:[
{letter:'A',text:'"This indicates your cancer may be returning — report this to your oncologist immediately."',correct:false,rationale:'Hair regrowth changes are a normal phenomenon after chemotherapy, not a sign of cancer recurrence.'},
{letter:'B',text:'"Chemotherapy damages the hair follicle cells. When hair regrows, it commonly differs from the original in color, texture, or thickness."',correct:true,rationale:'The professor emphasized through a class question that hair typically grows back about a month after chemo completion, but it may be a different color, texture, or thickness than the original.'},
{letter:'C',text:'"Your hair should return to its exact original appearance within 6 months."',correct:false,rationale:'The professor specifically stated hair "may be different" — there is no guarantee it returns to its original appearance.'},
{letter:'D',text:'"This only happens with alkylating agents — you should not have this with your regimen."',correct:false,rationale:'Alopecia and regrowth changes can occur with multiple chemotherapy drug classes, not only alkylating agents.'}
],vocabTip:'What This Was Testing: Alopecia and hair regrowth after chemo. Test Clue: "Hair growing back different." Fast Rule: If you see [hair regrowth post-chemo] → think [may differ in color, texture, or thickness — this is normal].'},

{id:14,chapter:18,difficulty:'medium',sata:false,trap:false,
stem:'A cancer patient receiving filgrastim (Neupogen) to stimulate bone marrow recovery reports severe aching in their bones. What is the nurse\'s best response?',
options:[
{letter:'A',text:'"This is a serious allergic reaction — I will discontinue the medication immediately."',correct:false,rationale:'Bone pain is the EXPECTED most common side effect of colony-stimulating factors, not an allergic reaction.'},
{letter:'B',text:'"Bone pain is the most common side effect of colony-stimulating factors because your bone marrow is being stimulated to produce more cells rapidly."',correct:true,rationale:'The professor repeated multiple times: the most common side effect of colony-stimulating factors (like filgrastim) is BONE PAIN — because the drug is forcing the bone marrow to rapidly increase cell production.'},
{letter:'C',text:'"This means the medication is not working and we need to try a different drug."',correct:false,rationale:'Bone pain actually indicates the drug IS working — the marrow is responding by increasing production.'},
{letter:'D',text:'"You should not be experiencing pain — I will notify the provider of this unexpected finding."',correct:false,rationale:'Bone pain is a well-known, expected side effect and is not unexpected.'}
],vocabTip:'What This Was Testing: Colony-stimulating factors — most common side effect is BONE PAIN. Test Clue: "Filgrastim," "Neupogen," "bone aching." Fast Rule: If you see [colony-stimulating factor + bone pain] → think [expected #1 side effect — marrow working hard].'},

{id:15,chapter:18,difficulty:'hard',sata:false,trap:false,
stem:'A patient is receiving their first infusion of rituximab (a monoclonal antibody). Thirty minutes into the infusion, the patient develops fever, chills, rigors, and hypotension. What is the nurse\'s priority action?',
options:[
{letter:'A',text:'Continue the infusion — these symptoms are expected with all monoclonal antibodies.',correct:false,rationale:'These symptoms indicate a serious hypersensitivity/infusion reaction. NEVER continue an infusion during an active reaction.'},
{letter:'B',text:'Stop the infusion immediately and initiate emergency protocol for a severe hypersensitivity reaction.',correct:true,rationale:'The professor stressed assessing patients closely during the first 30 minutes to 2 hours of monoclonal antibody infusion for hypersensitivity reactions. Fever, chills, rigors, dyspnea, and hypotension indicate a severe reaction requiring immediate intervention.'},
{letter:'C',text:'Slow the infusion rate by 50% and monitor for improvement.',correct:false,rationale:'A severe reaction (hypotension, rigors) requires STOPPING the infusion entirely, not merely slowing it.'},
{letter:'D',text:'Administer the prescribed pre-medication and restart the infusion.',correct:false,rationale:'Pre-medications should be given BEFORE the infusion begins to prevent reactions, not during an active severe reaction.'}
],vocabTip:'What This Was Testing: Monoclonal antibody infusion reactions — first 30 min to 2 hours. Test Clue: "First infusion," "30 minutes in," "fever/chills/hypotension." Fast Rule: If you see [monoclonal antibody + symptoms in first 30 min-2 hrs] → think [hypersensitivity reaction — STOP infusion immediately].'},

{id:16,chapter:18,difficulty:'hard',sata:false,trap:false,
stem:'A patient with metastatic bone cancer suddenly becomes weak, confused, and has an irregular heartbeat. Labs reveal a serum calcium of 13.2 mg/dL. The nurse understands this oncologic emergency is caused by:',
options:[
{letter:'A',text:'The tumor is secreting excess ADH, causing fluid retention.',correct:false,rationale:'Excess ADH secretion causes SIADH (water retention and hyponatremia), not hypercalcemia.'},
{letter:'B',text:'Bone metastasis is stimulating osteoclast activity, which breaks down bone and dumps calcium into the bloodstream.',correct:true,rationale:'Hypercalcemia in cancer occurs when bone metastasis stimulates osteoclasts (bone-destroying cells) to break down bone tissue, releasing large amounts of calcium into the blood. Normal calcium upper limit is 10.5 mg/dL.'},
{letter:'C',text:'Chemotherapy has destroyed tumor cells too rapidly, releasing intracellular potassium.',correct:false,rationale:'Rapid tumor cell destruction releasing potassium and uric acid is Tumor Lysis Syndrome (TLS), not hypercalcemia.'},
{letter:'D',text:'A blood clot is blocking the superior vena cava.',correct:false,rationale:'SVC blockage causes Superior Vena Cava Syndrome (facial edema, engorged vessels), not hypercalcemia.'}
],vocabTip:'What This Was Testing: Hypercalcemia as oncologic emergency — bone metastasis mechanism. Test Clue: "Bone cancer," "calcium >10.5," "osteoclasts." Fast Rule: If you see [bone metastasis + high calcium] → think [osteoclast activity breaking down bone → calcium dumped into blood].'},

{id:17,chapter:18,difficulty:'hard',sata:true,trap:false,
stem:'A patient with leukemia is receiving aggressive chemotherapy. On day 3 of treatment, labs show: potassium 6.8 mEq/L, uric acid 12 mg/dL, and creatinine rising. The nurse recognizes tumor lysis syndrome (TLS). Which statements about TLS are correct?',
options:[
{letter:'A',text:'TLS occurs when chemotherapy/radiation destroys large numbers of tumor cells too rapidly.',correct:true,rationale:'The bulky tumor cells are destroyed so quickly that their intracellular contents are dumped into the bloodstream faster than the kidneys can eliminate them.'},
{letter:'B',text:'The released intracellular contents include potassium and uric acid that overwhelm the kidneys.',correct:true,rationale:'Destroyed cancer cells release massive amounts of potassium (hyperkalemia) and uric acid (which crystallizes in kidneys), causing acute kidney injury.'},
{letter:'C',text:'TLS most commonly occurs BEFORE treatment begins due to spontaneous tumor death.',correct:false,rationale:'TLS most commonly occurs DURING active radiation and chemotherapy treatments, not before treatment begins.'},
{letter:'D',text:'Aggressive IV hydration is a key preventive and treatment measure.',correct:true,rationale:'Aggressive hydration helps the kidneys flush the excess uric acid and potassium before they cause damage.'},
{letter:'E',text:'TLS is treated by immediately stopping all cancer treatment permanently.',correct:false,rationale:'While treatment may be temporarily paused, TLS does not necessarily mean permanent cessation of all cancer therapy.'}
],vocabTip:'What This Was Testing: Tumor Lysis Syndrome — mechanism and timing. Test Clue: "High K+, high uric acid, rising creatinine DURING treatment." Fast Rule: If you see [hyperkalemia + high uric acid + during chemo] → think [TLS — rapid cell destruction overwhelming kidneys; needs aggressive hydration].'},

{id:18,chapter:18,difficulty:'hard',sata:false,trap:false,
stem:'A nurse observes a cancer patient with facial edema, distended neck veins, and difficulty breathing. The patient\'s face appears flushed and swollen compared to their lower body. The nurse suspects which oncologic emergency?',
options:[
{letter:'A',text:'Disseminated Intravascular Coagulation (DIC)',correct:false,rationale:'DIC presents with simultaneous bleeding and clotting signs, not isolated facial/upper body edema.'},
{letter:'B',text:'Superior Vena Cava (SVC) Syndrome',correct:true,rationale:'SVC Syndrome occurs when a tumor or clot blocks blood return from the head, neck, and upper trunk through the superior vena cava. This causes facial edema, engorged/distended neck veins, and respiratory distress.'},
{letter:'C',text:'Spinal cord compression',correct:false,rationale:'Spinal cord compression presents with back pain, weakness, and potential paralysis — not facial edema.'},
{letter:'D',text:'Syndrome of Inappropriate ADH (SIADH)',correct:false,rationale:'SIADH causes generalized water retention and dilutional hyponatremia, not isolated upper body edema with distended neck veins.'}
],vocabTip:'What This Was Testing: SVC Syndrome recognition. Test Clue: "Facial edema," "distended neck veins," "upper body swelling," "difficulty breathing." Fast Rule: If you see [facial swelling + distended neck veins + upper body edema] → think [SVC Syndrome — tumor blocking venous return from head].'},

{id:19,chapter:18,difficulty:'hard',sata:true,trap:false,
stem:'A nurse is caring for a patient whose oncologist says, "The patient has DIC secondary to their cancer." Which statements correctly describe Disseminated Intravascular Coagulation?',
options:[
{letter:'A',text:'The body forms excessive micro-clots that use up all available clotting factors and platelets.',correct:true,rationale:'DIC involves widespread, excessive clotting that depletes (uses up) the clotting factors and platelets needed for normal hemostasis.'},
{letter:'B',text:'Once clotting factors are depleted, the patient bleeds uncontrollably from multiple sites.',correct:true,rationale:'With no clotting factors remaining, nothing can stop bleeding. The professor summarized: "clotting and bleeding at the same time — wasting your resources."'},
{letter:'C',text:'DIC only causes bleeding — there is no clotting component.',correct:false,rationale:'DIC involves BOTH clotting AND bleeding simultaneously. The clotting occurs first (depleting factors), then bleeding follows.'},
{letter:'D',text:'DIC is considered a potentially fatal complication.',correct:true,rationale:'The professor explicitly stated DIC is a "fatal complication" if not managed rapidly.'},
{letter:'E',text:'DIC is treated by administering high-dose aspirin to prevent further clotting.',correct:false,rationale:'Aspirin (an antiplatelet) would worsen the bleeding component. DIC treatment involves replacing clotting factors (FFP, cryoprecipitate) and treating the underlying cause.'}
],vocabTip:'What This Was Testing: DIC — "clotting and bleeding at the same time." Test Clue: "Excessive clotting," "depleted factors," "uncontrollable bleeding." Fast Rule: If you see [DIC] → think [clots form → use up all factors → then can\'t stop bleeding = clotting AND bleeding simultaneously].'},

{id:20,chapter:18,difficulty:'medium',sata:false,trap:false,
stem:'A patient with small cell lung cancer develops sudden weight gain, weakness, and confusion. Labs show a serum sodium of 118 mEq/L (critically low). The nurse suspects the tumor is secreting its own:',
options:[
{letter:'A',text:'Parathyroid hormone (PTH), causing hypercalcemia.',correct:false,rationale:'Ectopic PTH would cause HIGH calcium, not low sodium. The labs show hyponatremia.'},
{letter:'B',text:'Antidiuretic hormone (ADH), causing SIADH with severe water retention and dilutional hyponatremia.',correct:true,rationale:'SIADH occurs when tumors secrete their own ADH or stimulate the brain to over-secrete it. Excess ADH causes the kidneys to retain too much water, diluting the sodium to dangerously low levels (dilutional hyponatremia).'},
{letter:'C',text:'Insulin, causing severe hypoglycemia.',correct:false,rationale:'The symptoms and labs (low sodium with weight gain) point to water retention from excess ADH, not insulin-related hypoglycemia.'},
{letter:'D',text:'Erythropoietin (EPO), causing polycythemia.',correct:false,rationale:'Ectopic EPO would cause elevated red blood cell counts, not hyponatremia and weight gain.'}
],vocabTip:'What This Was Testing: SIADH as oncologic emergency — tumor secreting ADH. Test Clue: "Weight gain," "low sodium," "water retention," "small cell lung cancer." Fast Rule: If you see [tumor + water retention + critical hyponatremia] → think [SIADH — tumor secreting its own ADH].'}
];

let answered={};
let selections={};

function buildQuiz(){
const area=document.getElementById('quizArea');
area.innerHTML='';
let currentChapter=0;
const chapterNames={18:'Ch 18 Cancer'};
questions.forEach((q,idx)=>{
if(q.chapter!==currentChapter){
currentChapter=q.chapter;
const div=document.createElement('div');
div.className='chapter-divider';
div.innerHTML=`<span>Chapter ${currentChapter}: ${chapterNames[currentChapter]}</span>`;
area.appendChild(div);
}
const card=document.createElement('div');
card.className='q-card';
card.id=`qcard-${q.id}`;
const isSata=q.sata===true;
const trapBadge=q.trap?'<span class="badge badge-trap">TRAP</span>':'';
const sataBadge=isSata?'<span class="badge badge-sata">SATA</span>':'';
card.innerHTML=`
<div class="q-top">
<span class="q-num">Q${idx+1}</span>
<span class="badge badge-ch${q.chapter}">Ch ${q.chapter}</span>
${trapBadge}${sataBadge}
</div>
<div class="q-stem">${q.stem}${isSata?'<em>(Select all that apply)</em>':''}</div>
<div class="opts" id="opts-${q.id}">
${q.options.map(o=>`
<div class="opt" id="opt-${q.id}-${o.letter}" onclick="toggleOpt(${q.id},'${o.letter}',${isSata})">
<span class="opt-letter">${o.letter}.</span>
<div><span class="opt-text">${o.text}</span><div class="opt-rationale" id="rat-${q.id}-${o.letter}">${o.rationale}</div></div>
</div>`).join('')}
</div>
<button class="btn-submit" id="btn-${q.id}" onclick="submitQ(${q.id})">Submit Answer</button>
<div class="vocab-tip" id="tip-${q.id}"><strong>Vocab Tip:</strong> ${q.vocabTip}</div>
${q.trap?`<div class="trap-callout" id="trap-${q.id}">&#9888; TRAP QUESTION: This question tests a common misconception. Read the rationale carefully!</div>`:''}
`;
area.appendChild(card);
});
loadState();
}

function toggleOpt(qId,letter,isSata){
if(answered[qId])return;
if(!selections[qId])selections[qId]=[];
if(isSata){
const idx=selections[qId].indexOf(letter);
if(idx>-1)selections[qId].splice(idx,1);
else selections[qId].push(letter);
}else{
selections[qId]=[letter];
}
const q=questions.find(x=>x.id===qId);
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.classList.toggle('selected',selections[qId].includes(o.letter));
});
}

function submitQ(qId){
if(answered[qId])return;
if(!selections[qId]||selections[qId].length===0)return;
answered[qId]=true;
const q=questions.find(x=>x.id===qId);
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const isCorrect=correctLetters.length===selections[qId].length&&correctLetters.every(l=>selections[qId].includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.style.cursor='default';
if(o.correct)el.classList.add('correct-show');
else if(selections[qId].includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
document.getElementById(`btn-${qId}`).disabled=true;
document.getElementById(`btn-${qId}`).textContent=isCorrect?'Correct!':'Incorrect';
updateProgress();
saveState();
if(Object.keys(answered).length===questions.length)showScore();
}

function updateProgress(){
const pct=(Object.keys(answered).length/questions.length)*100;
document.getElementById('progressBar').style.width=pct+'%';
}

function showScore(){
const chScores={18:0};
const chTotals={18:0};
const chNames={18:'Ch 18 Cancer'};
const chColors={18:'#f472b6'};
questions.forEach(q=>{
chTotals[q.chapter]++;
if(answered[q.id]){
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[q.id]||[];
if(correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l)))chScores[q.chapter]++;
}
});
let totalCorrect=0,totalQ=0;
[18].forEach(ch=>{totalCorrect+=chScores[ch];totalQ+=chTotals[ch];});
const pct=Math.round((totalCorrect/totalQ)*100);
document.getElementById('finalScore').textContent=pct+'%';
document.getElementById('finalText').textContent=`${totalCorrect} of ${totalQ} correct`;
const bd=document.getElementById('chapterBreakdown');
bd.innerHTML='';
[18].forEach(ch=>{
const box=document.createElement('div');
box.className='ch-box';
box.innerHTML=`<div class="ch-label">${chNames[ch]}</div><div class="ch-score" style="color:${chColors[ch]}">${chScores[ch]}/${chTotals[ch]}</div>`;
bd.appendChild(box);
});
document.getElementById('scoreCard').style.display='block';
document.getElementById('scoreCard').scrollIntoView({behavior:'smooth'});
const record={score:pct,correct:totalCorrect,total:totalQ,date:new Date().toLocaleDateString(),chapters:{18:{correct:chScores[18],total:chTotals[18]}}};
localStorage.setItem(EXAM_ID+'-last',JSON.stringify(record));
localStorage.setItem(EXAM_ID+'-label',EXAM_LABEL);
const hist=JSON.parse(localStorage.getItem('examHistory')||'[]');
hist.push({examId:EXAM_ID,examLabel:EXAM_LABEL,date:new Date().toISOString(),score:pct,correct:totalCorrect,total:totalQ,topicBreakdown:{18:{correct:chScores[18],total:chTotals[18]}}});
localStorage.setItem('examHistory',JSON.stringify(hist.slice(-20)));
}

function restartQuiz(){
answered={};
selections={};
localStorage.removeItem(EXAM_ID+'-state');
document.getElementById('scoreCard').style.display='none';
buildQuiz();
}

function saveState(){
localStorage.setItem(EXAM_ID+'-state',JSON.stringify({answered,selections}));
}

function loadState(){
const saved=localStorage.getItem(EXAM_ID+'-state');
if(saved){
const state=JSON.parse(saved);
answered=state.answered||{};
selections=state.selections||{};
Object.keys(answered).forEach(qId=>{
const q=questions.find(x=>x.id==qId);
if(!q)return;
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[qId]||[];
const isCorrect=correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
if(sel.includes(o.letter))el.classList.add('selected');
if(o.correct)el.classList.add('correct-show');
else if(sel.includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
el.style.cursor='default';
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
const btn=document.getElementById(`btn-${qId}`);
btn.disabled=true;
btn.textContent=isCorrect?'Correct!':'Incorrect';
});
updateProgress();
if(Object.keys(answered).length===questions.length)showScore();
}
const last=localStorage.getItem(EXAM_ID+'-last');
if(last){
const r=JSON.parse(last);
document.getElementById('lastAttempt').style.display='block';
document.getElementById('lastScore').textContent=r.score+'%';
document.getElementById('lastDate').textContent=r.date;
}
}

buildQuiz();
</script>
<script src="encourage.js"></script>
</body>
</html>
