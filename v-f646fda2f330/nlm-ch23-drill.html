var KEY='studyToolsPassphrase';
function b2a(b){var s='';var u=new Uint8Array(b);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return s;}
function a2b(a){var s=atob(a);var u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function unlock(pass,quiet){
  try{
    var salt=a2b(DATA.salt),iv=a2b(DATA.iv),blob=a2b(DATA.blob);
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:DATA.iters,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,blob);
    var html=new TextDecoder().decode(plain);
    try{localStorage.setItem(KEY,pass);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    if(!quiet){document.getElementById('err').textContent='Wrong passphrase. Try again.';
      document.getElementById('go').disabled=false;}
    try{if(quiet)localStorage.removeItem(KEY);}catch(e2){}
  }
}
document.getElementById('go').addEventListener('click',function(){
  document.getElementById('err').textContent='';this.disabled=true;
  unlock(document.getElementById('pw').value,false);
});
document.getElementById('pw').addEventListener('keydown',function(e){
  if(e.key==='Enter')document.getElementById('go').click();
});
(function(){var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved)unlock(saved,true);})();
</script>
