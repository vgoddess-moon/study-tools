<style>
*{margin:0;padding:0;box-sizing:border-box}

<script>
const QUESTIONS = [
  {
    id:1, topic:'electro', badge:'Electrolytes', sata:true, trap:false,
    stem:'A patient has a serum potassium of 2.9 mEq/L. Which findings does the nurse expect? (Select all that apply.)',
    options:[
      {text:'Peaked T waves on ECG', correct:false, rationale:'Peaked T waves indicate HYPERkalemia (too much K+), not hypokalemia.'},
      {text:'Skeletal muscle weakness', correct:true, rationale:'Low K+ impairs muscle cell depolarization, causing weakness and fatigue.'},
      {text:'Hypoactive bowel sounds', correct:true, rationale:'Smooth muscle of the GI tract also weakens with low K+, slowing peristalsis.'},
      {text:'Flat or inverted T waves', correct:true, rationale:'Classic ECG finding of hypokalemia: flattened T waves, possible U waves.'},
      {text:'Tall, tented T waves', correct:false, rationale:'Tall tented T waves = hyperkalemia. This is the opposite finding.'}
    ],
    vocabTip:'Think of potassium like the battery for your heart and muscles. Too little K+ means muscles get lazy (weak, slow bowels) and the ECG shows flat T waves. Too MUCH K+ makes the heart act up with tall peaked T waves. If the level is below 3.5, its hypokalemia.'
  },
  {
    id:2, topic:'electro', badge:'Electrolytes', sata:false, trap:false,
    stem:'A patient with hypernatremia (Na+ 158 mEq/L) is most likely to exhibit which symptom?',
    options:[
      {text:'Muscle cramps and twitching', correct:false, rationale:'Muscle cramps are more associated with hyponatremia or hypocalcemia, not hypernatremia.'},
      {text:'Dry sticky mucous membranes and thirst', correct:true, rationale:'High sodium pulls water out of cells causing dehydration, dry mouth, and extreme thirst.'},
      {text:'Peripheral edema', correct:false, rationale:'Edema can occur with fluid overload but hypernatremia typically shows dehydration signs.'},
      {text:'Bradycardia', correct:false, rationale:'Hypernatremia does not typically cause bradycardia. Tachycardia is more likely due to hypovolemia.'}
    ],
    vocabTip:'Sodium is like a salt sponge. Too much sodium (hyper = over 145) sucks water out of your cells, making everything dry: dry mouth, sticky lips, super thirsty, confused brain. The body is basically dehydrated on the inside even if it looks ok outside.'
  },
  {
    id:3, topic:'electro', badge:'Electrolytes', sata:true, trap:false,
    stem:'The nurse is caring for a patient with hypocalcemia (Ca2+ 7.2 mg/dL). Which assessment findings are expected? (Select all that apply.)',
    options:[
      {text:'Positive Trousseau sign', correct:true, rationale:'BP cuff inflation causes carpopedal spasm in hypocalcemia (hand cramps when cuff inflated).'},
      {text:'Positive Chvostek sign', correct:true, rationale:'Tapping facial nerve causes twitching of the lip/cheek. Classic hypocalcemia sign.'},
      {text:'Numbness and tingling around mouth', correct:true, rationale:'Neuromuscular irritability from low calcium causes perioral tingling.'},
      {text:'Shortened QT interval on ECG', correct:false, rationale:'Hypocalcemia causes a PROLONGED QT interval. Shortened QT = hypercalcemia.'},
      {text:'Constipation and lethargy', correct:false, rationale:'These are signs of HYPERcalcemia. Think: "stones, bones, groans, moans."'}
    ],
    vocabTip:'Calcium keeps your nerves calm. Too little calcium (below 8.5) makes nerves super excitable, like a fire alarm going off for no reason. Muscles twitch (Trousseau/Chvostek signs), lips tingle. Too MUCH calcium does the opposite: everything slows down (constipation, confusion, sleepy).'
  },
  {
    id:4, topic:'electro', badge:'Electrolytes', sata:true, trap:true,
    stem:'A patient has a magnesium level of 1.0 mEq/L. Which nursing interventions are appropriate? (Select all that apply.)',
    options:[
      {text:'Initiate seizure precautions', correct:true, rationale:'Severe hypomagnesemia increases neuromuscular excitability and seizure risk.'},
      {text:'Administer IV magnesium sulfate as ordered', correct:true, rationale:'IV replacement is indicated for severe hypomagnesemia (< 1.2 mEq/L).'},
      {text:'Place on cardiac monitor', correct:true, rationale:'Low Mg can cause dysrhythmias including torsades de pointes. Monitoring is essential.'},
      {text:'Encourage high-calcium diet', correct:false, rationale:'While Mg and Ca are related, the priority is replacing magnesium. A high-Mg diet (nuts, greens) is more appropriate.'},
      {text:'Administer the IV Mg bolus rapidly over 5 minutes', correct:false, rationale:'NEVER push IV Mg rapidly. It must be given slowly (over 1+ hours) to prevent cardiac arrest. Rapid infusion = dangerous.'}
    ],
    vocabTip:'Magnesium is calciums little helper. Low Mg (below 1.3) makes everything twitchy and excitable just like low calcium does. The heart can start doing weird rhythms. We fix it with IV magnesium but we give it SLOWLY or the heart could stop. Normal is 1.3-2.1.'
  },
  {
    id:5, topic:'electro', badge:'Electrolytes', sata:false, trap:false,
    stem:'Which food should the nurse recommend to a patient being treated for hypokalemia?',
    options:[
      {text:'White bread and pasta', correct:false, rationale:'Refined grains are very low in potassium. Not a good source.'},
      {text:'Baked potato with skin', correct:true, rationale:'One medium baked potato has about 900 mg of potassium, one of the richest food sources.'},
      {text:'Canned peaches in syrup', correct:false, rationale:'Processing removes much of the potassium. Fresh fruits are better sources.'},
      {text:'Cottage cheese', correct:false, rationale:'Dairy has some K+ but cottage cheese is not a concentrated source compared to potatoes or bananas.'}
    ],
    vocabTip:'Foods high in potassium: bananas (everyone knows this one), but also potatoes, oranges, spinach, avocados, and tomatoes. An easy trick: if it grew in the ground or on a tree and is unprocessed, it probably has good potassium. Processed/canned food = potassium removed.'
  },
  {
    id:6, topic:'electro', badge:'Electrolytes', sata:true, trap:false,
    stem:'A patient with hyperkalemia (K+ 6.8 mEq/L) has tall peaked T waves on the monitor. Which orders does the nurse anticipate? (Select all that apply.)',
    options:[
      {text:'IV calcium gluconate', correct:true, rationale:'Calcium gluconate stabilizes the cardiac membrane. It does NOT lower K+ but protects the heart while other treatments work.'},
      {text:'Regular insulin with dextrose IV', correct:true, rationale:'Insulin drives K+ into cells, temporarily lowering serum levels. Dextrose prevents hypoglycemia.'},
      {text:'Oral potassium supplement', correct:false, rationale:'The patient already has dangerously HIGH potassium. Adding more could be fatal.'},
      {text:'Sodium polystyrene sulfonate (Kayexalate)', correct:true, rationale:'This binds K+ in the GI tract and eliminates it through stool. Slower but actually removes K+ from body.'},
      {text:'IV normal saline bolus 2L', correct:false, rationale:'NS bolus is not a standard treatment for hyperkalemia. Dilution alone wont adequately address the dangerous level.'}
    ],
    vocabTip:'When K+ is dangerously high (over 6.0), we panic-protect the heart first with calcium gluconate (like a shield), then shove K+ back into cells with insulin+sugar, then get rid of it for real with Kayexalate (through poop) or dialysis. Never give MORE potassium to someone whos already too high.'
  },
  {
    id:7, topic:'electro', badge:'Electrolytes', sata:false, trap:false,
    stem:'The nurse knows that which condition most commonly causes hyponatremia?',
    options:[
      {text:'Excessive water intake (water intoxication)', correct:true, rationale:'Drinking too much water dilutes sodium. SIADH also causes water retention, diluting Na+.'},
      {text:'Excessive sodium intake', correct:false, rationale:'Too much sodium intake would cause HYPERnatremia, not hypo.'},
      {text:'Dehydration from vomiting', correct:false, rationale:'While vomiting can cause electrolyte loss, it more commonly leads to dehydration and hypernatremia or variable sodium levels.'},
      {text:'High-protein diet', correct:false, rationale:'Diet protein does not directly impact sodium levels significantly.'}
    ],
    vocabTip:'Hyponatremia (Na below 136) usually means too much WATER, not too little salt. The water dilutes the sodium thats there. Think of adding too much water to lemonade, it tastes weak. The brain hates diluted sodium and swells up causing confusion, headaches, and seizures.'
  },
  {
    id:8, topic:'electro', badge:'Electrolytes', sata:false, trap:false,
    stem:'A patient with hypercalcemia (Ca2+ 12.8 mg/dL) is admitted. Which finding does the nurse expect?',
    options:[
      {text:'Hyperactive reflexes and tetany', correct:false, rationale:'Hyperactive reflexes occur in HYPOcalcemia due to neuromuscular irritability. Hypercalcemia causes the opposite.'},
      {text:'Constipation and decreased muscle tone', correct:true, rationale:'High calcium slows everything down: sluggish bowels (constipation), weak muscles, drowsiness. Remember "stones, bones, groans, moans."'},
      {text:'Diarrhea and abdominal cramping', correct:false, rationale:'Diarrhea is not typical of hypercalcemia. Constipation is the GI finding.'},
      {text:'Positive Chvostek sign', correct:false, rationale:'Chvostek sign indicates HYPOcalcemia (neuromuscular excitability), not hypercalcemia.'}
    ],
    vocabTip:'Hypercalcemia (above 10.5) slows everything down. Remember "stones, bones, groans, moans": kidney stones, bone pain, constipation (groans), and confusion/depression (moans). The body is basically too relaxed. Treatment: hydrate with NS, give calcitonin or bisphosphonates.'
  },
  {
    id:9, topic:'infusion', badge:'Infusion Therapy', sata:true, trap:false,
    stem:'The nurse is selecting a peripheral IV site. Which are appropriate nursing considerations? (Select all that apply.)',
    options:[
      {text:'Start distally and move proximally with subsequent attempts', correct:true, rationale:'Starting distally preserves proximal veins for future access if the distal site fails.'},
      {text:'Use the dominant arm for better blood flow', correct:false, rationale:'The NONdominant arm is preferred to allow the patient to continue activities of daily living.'},
      {text:'Avoid areas of flexion (antecubital fossa) for continuous infusions', correct:true, rationale:'Flexion areas increase risk of infiltration and restrict patient mobility.'},
      {text:'Avoid the arm on the side of a mastectomy', correct:true, rationale:'Lymph node removal impairs drainage. IV on that side increases infection and lymphedema risk.'},
      {text:'A 14-gauge catheter is standard for all adult patients', correct:false, rationale:'Gauge is selected based on purpose: 14-16G for trauma/blood, 18-20G for most infusions, 22-24G for fragile veins.'}
    ],
    vocabTip:'When picking an IV spot: start at the hand/forearm (far from heart) and work up. Avoid the arm where lymph nodes were removed (mastectomy side). Dont put it where the arm bends (itll kink). Use the non-dominant hand so the patient can still eat and write.'
  },
  {
    id:10, topic:'infusion', badge:'Infusion Therapy', sata:false, trap:false,
    stem:'A patient receiving IV fluids develops coolness, pallor, and swelling at the insertion site with no blood return. The nurse suspects:',
    options:[
      {text:'Phlebitis', correct:false, rationale:'Phlebitis presents with warmth, redness, and pain along the vein, not coolness and pallor.'},
      {text:'Infiltration', correct:true, rationale:'Fluid leaking into tissue causes coolness, swelling, pallor, and decreased flow. No blood return confirms the catheter is out of the vein.'},
      {text:'Thrombosis', correct:false, rationale:'Thrombosis would show as a firm, cord-like vein. The cool/pale swelling pattern points to infiltration.'},
      {text:'Air embolism', correct:false, rationale:'Air embolism causes respiratory distress, chest pain, and hypotension, not local swelling.'}
    ],
    vocabTip:'Infiltration = the IV slipped out of the vein and fluid is leaking into the tissue around it. The spot gets puffy, cool, and pale because its just saline sitting in tissue, not blood flowing. Fix: stop the IV, remove it, put a new one somewhere else, elevate the arm.'
  },
  {
    id:11, topic:'infusion', badge:'Infusion Therapy', sata:true, trap:false,
    stem:'Which are characteristics of a PICC line? (Select all that apply.)',
    options:[
      {text:'Inserted into a peripheral vein and advanced to the superior vena cava', correct:true, rationale:'PICC is inserted in the basilic or cephalic vein of the upper arm and threaded to the SVC.'},
      {text:'Can remain in place for weeks to months', correct:true, rationale:'PICCs can stay for extended therapy (weeks to months), unlike short peripheral IVs (72-96 hours).'},
      {text:'Requires surgical insertion in the operating room', correct:false, rationale:'PICCs are inserted at bedside by trained nurses or interventional radiology. No OR needed.'},
      {text:'Appropriate for vesicant chemotherapy and TPN', correct:true, rationale:'Central line tip position allows irritating solutions that would damage peripheral veins.'},
      {text:'Does not require chest X-ray confirmation of tip placement', correct:false, rationale:'A chest X-ray MUST confirm the tip is in the SVC before use. Malposition is dangerous.'}
    ],
    vocabTip:'A PICC line is like a really long IV that goes in your upper arm but the tip sits near your heart (in the SVC). Because its in a big vessel, you can give strong meds that would burn small veins. It stays in for weeks/months, but you MUST get an X-ray to make sure the tip is in the right spot.'
  },
  {
    id:12, topic:'infusion', badge:'Infusion Therapy', sata:false, trap:false,
    stem:'Which IV gauge is MOST appropriate for administering a blood transfusion to a stable adult patient?',
    options:[
      {text:'24-gauge', correct:false, rationale:'Too small for blood. Red blood cells can lyse (break apart) through a 24G catheter due to the small diameter.'},
      {text:'22-gauge', correct:false, rationale:'22G can be used for blood in emergencies for pediatric/elderly patients, but 18-20G is preferred for adults.'},
      {text:'18-gauge', correct:true, rationale:'18-20G is standard for blood transfusions in adults. Large enough to prevent hemolysis of red blood cells.'},
      {text:'14-gauge', correct:false, rationale:'14G is reserved for rapid fluid resuscitation in trauma. Unnecessarily large for a routine transfusion.'}
    ],
    vocabTip:'Blood cells are big and fragile. If you push them through a tiny straw (24G), they pop (hemolysis). An 18-gauge needle is the sweet spot for blood transfusions. Think of it like: 14G = fire hose (trauma only), 18G = garden hose (blood/most things), 22G = drinking straw (small veins), 24G = coffee stirrer (kids/elderly).'
  },
  {
    id:13, topic:'infusion', badge:'Infusion Therapy', sata:true, trap:true,
    stem:'A patient is receiving a blood transfusion and develops fever, chills, back pain, and dark urine 15 minutes into the infusion. Which are priority nursing actions? (Select all that apply.)',
    options:[
      {text:'Stop the transfusion immediately', correct:true, rationale:'Acute hemolytic reaction is life-threatening. Stop blood immediately to limit the reaction.'},
      {text:'Disconnect the blood tubing and infuse NS through a new line', correct:true, rationale:'Do not flush existing blood in the tubing into the patient. Use new tubing with NS to keep the vein open.'},
      {text:'Slow the transfusion rate and monitor', correct:false, rationale:'NEVER slow and continue during a suspected hemolytic reaction. This is not a minor febrile reaction. STOP immediately.'},
      {text:'Send the blood bag and tubing to the blood bank', correct:true, rationale:'The blood bank must investigate the reaction. Save the bag, tubing, and obtain new blood/urine samples.'},
      {text:'Administer diphenhydramine and resume infusion', correct:false, rationale:'Benadryl is for mild allergic reactions (hives). Hemolytic reaction symptoms (back pain, dark urine) require STOPPING permanently, not medicating and continuing.'}
    ],
    vocabTip:'Dark urine + back pain + fever during a blood transfusion = the patients body is DESTROYING the blood you gave them (hemolytic reaction). This is an emergency. STOP the blood NOW, dont even flush whats left in the tube. Get new saline going with new tubing. Save everything for the lab.'
  },
  {
    id:14, topic:'infusion', badge:'Infusion Therapy', sata:false, trap:false,
    stem:'The nurse is caring for a patient with a central venous catheter. Which finding indicates a potential catheter-related bloodstream infection (CRBSI)?',
    options:[
      {text:'Temperature 101.4F with no other identifiable source', correct:true, rationale:'Fever with a central line and no other infection source is a classic sign of CRBSI. Blood cultures should be drawn.'},
      {text:'Blood return from all lumens', correct:false, rationale:'Good blood return is a NORMAL finding indicating the catheter is patent and functioning properly.'},
      {text:'Slight redness at insertion site on day 1', correct:false, rationale:'Mild redness immediately after insertion can be normal tissue response. Concerning if it worsens or has drainage.'},
      {text:'Infusion running at ordered rate', correct:false, rationale:'This is a normal finding indicating proper catheter function.'}
    ],
    vocabTip:'Central lines sit in big veins near the heart. If bacteria get on the line, they go straight into the bloodstream causing a serious infection (sepsis). A fever with no other explanation in a patient with a central line = assume the line is infected until proven otherwise. We draw blood cultures from the line AND from a peripheral stick.'
  },
  {
    id:15, topic:'infusion', badge:'Infusion Therapy', sata:true, trap:false,
    stem:'Which are appropriate nursing actions to prevent catheter-related infections for central lines? (Select all that apply.)',
    options:[
      {text:'Use sterile technique for dressing changes', correct:true, rationale:'Central line dressings require strict sterile technique to prevent introducing bacteria.'},
      {text:'Scrub the hub for at least 15 seconds before access', correct:true, rationale:'Scrub the hub with alcohol for 15+ seconds and allow to dry. This is a key bundle element.'},
      {text:'Change transparent dressings every 7 days', correct:true, rationale:'Transparent dressings are changed every 5-7 days (or sooner if soiled/loose). Gauze dressings every 2 days.'},
      {text:'Routinely replace the central line every 7 days', correct:false, rationale:'Central lines are NOT routinely replaced on a schedule. They are removed when no longer needed or if infection is suspected.'},
      {text:'Flush with heparin after each use for non-valved catheters', correct:true, rationale:'Non-valved catheters require heparin flush to maintain patency. Valved catheters (Groshong) use saline only.'}
    ],
    vocabTip:'Preventing central line infections is all about keeping germs OUT. The big rules: scrub the hub every time you touch it (15 seconds minimum), use sterile technique for dressing changes, change the transparent dressing weekly. We do NOT just swap out lines on a schedule because each new insertion = new infection risk.'
  },
  {
    id:16, topic:'infusion', badge:'Infusion Therapy', sata:false, trap:false,
    stem:'A patient with a central line suddenly develops dyspnea, tachycardia, and a churning murmur heard over the precordium during a tubing change. The nurse suspects:',
    options:[
      {text:'Pneumothorax', correct:false, rationale:'Pneumothorax presents with absent breath sounds on the affected side and chest pain, typically during insertion, not tubing changes.'},
      {text:'Air embolism', correct:true, rationale:'Air enters during tubing disconnection. Classic signs: sudden dyspnea, tachycardia, churning (mill-wheel) murmur. Position patient left side, head down (Trendelenburg).'},
      {text:'Pulmonary embolism', correct:false, rationale:'PE causes similar symptoms but is not associated with tubing changes and does not cause a churning murmur.'},
      {text:'Cardiac tamponade', correct:false, rationale:'Tamponade causes muffled heart sounds, JVD, and hypotension (Becks triad), not a churning murmur.'}
    ],
    vocabTip:'Air embolism = air bubble gets into the blood through the central line opening. It happens during tubing changes if you forget to clamp or the patient inhales at the wrong time. The churning sound is air swishing in the heart. Emergency: put patient on LEFT side with head DOWN so the air bubble gets trapped and cant travel to the lungs.'
  },
  {
    id:17, topic:'abg', badge:'ABG Interpretation', sata:false, trap:false,
    stem:'A patient has the following ABG results: pH 7.30, PaCO2 55 mmHg, HCO3 24 mEq/L. The nurse interprets this as:',
    options:[
      {text:'Respiratory acidosis, uncompensated', correct:true, rationale:'pH is low (acidotic), CO2 is high (respiratory cause), HCO3 is normal (kidneys have not compensated yet). ROME: Respiratory = Opposite (pH down, CO2 up).'},
      {text:'Metabolic acidosis, uncompensated', correct:false, rationale:'In metabolic acidosis, the HCO3 would be low. Here HCO3 is normal and CO2 is the abnormal value.'},

const state = {
  answers: {},
  submitted: {},
  score: 0
};

function init() {
  loadLastAttempt();
  renderQuiz();
}

function loadLastAttempt() {
  try {
    const hist = JSON.parse(localStorage.getItem('examHistory') || '[]');
    const last = hist.find(e => e.examId === 'ms1-exam2-weak-areas-1');
    if (last) {
      document.getElementById('lastAttempt').style.display = 'block';
      document.getElementById('laScore').textContent = last.score + '%';
      document.getElementById('laDate').textContent = new Date(last.date).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});
    }
  } catch(e) {}
}

function renderQuiz() {
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'q-' + q.id;

    const badgeClass = q.topic === 'electro' ? 'badge-electro' : q.topic === 'infusion' ? 'badge-infusion' : q.topic === 'abg' ? 'badge-abg' : 'badge-mixed';

    let headerHTML = `<div class="q-header">
      <span class="q-num">Q${idx+1}</span>
      <span class="badge ${badgeClass}">${q.badge}</span>
      ${q.sata ? '<span class="sata-tag">SATA</span>' : ''}
    </div>`;

    let optionsHTML = '<div class="options">';
    q.options.forEach((opt, oi) => {
      optionsHTML += `<div class="option" id="opt-${q.id}-${oi}" onclick="toggleOpt(${q.id},${oi},${q.sata})">
        <span>${opt.text}</span>
        <div class="rationale">${opt.rationale}</div>
      </div>`;
    });
    optionsHTML += '</div>';

    let trapHTML = q.trap ? `<div class="trap-callout" id="trap-${q.id}">This question is designed to trick you. Read each option carefully and think about whether you are confusing hypo/hyper or confusing "stop" vs "slow down" actions.</div>` : '';

    let vocabHTML = `<div class="vocab-tip" id="vocab-${q.id}">
      <div class="vt-label">Vocab Tip</div>
      ${q.vocabTip}
    </div>`;

    card.innerHTML = headerHTML + `<div class="q-stem">${q.stem}</div>` + optionsHTML + `<button class="submit-btn" id="btn-${q.id}" onclick="submitQ(${q.id})" disabled>Submit Answer</button>` + trapHTML + vocabHTML;
    area.appendChild(card);
  });
}

function toggleOpt(qId, optIdx, isSata) {
  if (state.submitted[qId]) return;

  if (!isSata) {
    // single select: deselect all others
    QUESTIONS.find(q=>q.id===qId).options.forEach((_, i) => {
      document.getElementById('opt-'+qId+'-'+i).classList.remove('selected');
    });
    state.answers[qId] = [optIdx];
    document.getElementById('opt-'+qId+'-'+optIdx).classList.add('selected');
  } else {
    // multi select: toggle
    if (!state.answers[qId]) state.answers[qId] = [];
    const el = document.getElementById('opt-'+qId+'-'+optIdx);
    if (el.classList.contains('selected')) {
      el.classList.remove('selected');
      state.answers[qId] = state.answers[qId].filter(i => i !== optIdx);
    } else {
      el.classList.add('selected');
      state.answers[qId].push(optIdx);
    }
  }

  document.getElementById('btn-'+qId).disabled = !state.answers[qId] || state.answers[qId].length === 0;
}

function submitQ(qId) {
  if (state.submitted[qId]) return;
  state.submitted[qId] = true;

  const q = QUESTIONS.find(qu => qu.id === qId);
  const selected = state.answers[qId] || [];
  const correctIndices = q.options.map((o,i) => o.correct ? i : -1).filter(i => i !== -1);

  // Check if answer is correct
  const isCorrect = selected.length === correctIndices.length && selected.every(s => correctIndices.includes(s));
  if (isCorrect) state.score++;

  // Show rationales and color code
  q.options.forEach((opt, i) => {
    const el = document.getElementById('opt-'+qId+'-'+i);
    el.classList.add('show-rationale');
    if (opt.correct) {
      el.classList.add('correct-show');
    } else if (selected.includes(i)) {
      el.classList.add('incorrect-show');
    }
  });

  // Show vocab tip
  document.getElementById('vocab-'+qId).style.display = 'block';

  // Show trap callout if applicable
  if (q.trap) {
    document.getElementById('trap-'+qId).style.display = 'block';
  }

  // Disable button
  document.getElementById('btn-'+qId).disabled = true;
  document.getElementById('btn-'+qId).textContent = isCorrect ? 'Correct!' : 'Incorrect';

  // Update progress
  const answered = Object.keys(state.submitted).length;
  document.getElementById('progressText').textContent = answered + ' / ' + QUESTIONS.length;
  document.getElementById('progressBar').style.width = (answered / QUESTIONS.length * 100) + '%';

  // Check if all done
  if (answered === QUESTIONS.length) {
    setTimeout(showScore, 600);
  }
}

function showScore() {
  const pct = Math.round((state.score / QUESTIONS.length) * 100);

  // Topic breakdown
  const topics = {electro:'Electrolytes', infusion:'Infusion Therapy', abg:'ABG Interpretation', mixed:'Mixed'};
  const topicBreakdown = {};
  const weakAreas = [];

  Object.keys(topics).forEach(t => {
    const qs = QUESTIONS.filter(q => q.topic === t);
    let correct = 0;
    qs.forEach(q => {
      const selected = state.answers[q.id] || [];
      const correctIndices = q.options.map((o,i) => o.correct ? i : -1).filter(i => i !== -1);
      if (selected.length === correctIndices.length && selected.every(s => correctIndices.includes(s))) correct++;
    });
    topicBreakdown[topics[t]] = {correct, total: qs.length, pct: Math.round(correct/qs.length*100)};
    if (correct/qs.length < 0.7) weakAreas.push(topics[t]);
  });

  // Save to localStorage
  const entry = {
    examId: 'ms1-exam2-weak-areas-1',
    examLabel: 'MS1 Exam 2 — Weak Areas v1',
    date: new Date().toISOString(),
    score: pct,
    correct: state.score,
    total: QUESTIONS.length,
    topicBreakdown: topicBreakdown,
    weakAreas: weakAreas
  };
  const hist = JSON.parse(localStorage.getItem('examHistory') || '[]');
  hist.unshift(entry);
  localStorage.setItem('examHistory', JSON.stringify(hist.slice(0, 20)));
  localStorage.setItem('lastExamStats', JSON.stringify(entry));

  // Render score card
  document.getElementById('scorePct').textContent = pct + '%';
  document.getElementById('scoreDetail').textContent = state.score + ' correct out of ' + QUESTIONS.length + ' questions';

  let breakdownHTML = '';
  Object.keys(topicBreakdown).forEach(t => {
    const d = topicBreakdown[t];
    breakdownHTML += `<div class="topic-row"><span class="topic-name">${t}</span><span class="topic-score">${d.correct}/${d.total} (${d.pct}%)</span></div>`;
  });
  document.getElementById('topicBreakdown').innerHTML = breakdownHTML;

  let weakHTML = '';
  if (weakAreas.length === 0) {
    weakHTML = '<li style="color:#6ee7b7">No weak areas detected. Great job!</li>';
  } else {
    weakAreas.forEach(w => { weakHTML += `<li>${w} (below 70%)</li>`; });
  }
  document.getElementById('weakList').innerHTML = weakHTML;

  document.getElementById('scoreCard').style.display = 'block';
  document.getElementById('scoreCard').scrollIntoView({behavior:'smooth'});
}

function restartQuiz() {
  state.answers = {};
  state.submitted = {};
  state.score = 0;
  document.getElementById('scoreCard').style.display = 'none';
  document.getElementById('progressText').textContent = '0 / ' + QUESTIONS.length;
  document.getElementById('progressBar').style.width = '0%';
  renderQuiz();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.addEventListener('DOMContentLoaded', init);
</script>
