<script>
const EXAM_ID='ms1-exam3-nlm-ch21-drill';
const EXAM_LABEL='Ch 21 NLM Drill — Skin/Hair/Nail Conditions (20Q)';
const questions=[
{id:1,chapter:21,sata:false,trap:true,
stem:'A nurse assesses a non-blanchable red area over the sacrum of a 78-year-old. The skin is intact. Which finding confirms this as a Stage 1 Pressure Injury rather than just a transient red mark?',
options:[
{letter:'A',text:'When pressed, the redness turns white (blanches).',correct:false,rationale:'TRAP. If the redness blanches with pressure, it is NOT a Stage 1 PI. Stage 1 is strictly NON-blanchable.'},
{letter:'B',text:'The redness remains red and does NOT blanch when pressed.',correct:true,rationale:'The defining feature of a Stage 1 PI is non-blanchable erythema over intact skin. If pressing turns it white and it stays red after, it is a Stage 1 PI.'},
{letter:'C',text:'There is an open blister.',correct:false,rationale:'A blister (intact or ruptured) defines a Stage 2 PI.'},
{letter:'D',text:'Exposed subcutaneous fat is visible.',correct:false,rationale:'Exposed fat would be a Stage 3 PI.'}
],vocabTip:'<strong>TRAP:</strong> Stage 1 PI = <strong>non-blanchable</strong> redness on INTACT skin. If it blanches, it is NOT a PI.'},

{id:2,chapter:21,sata:false,trap:false,
stem:'A nurse documents partial-thickness skin loss with an exposed, pink, moist wound bed and an intact serum-filled blister. No slough or fat is visible. This is a:',
options:[
{letter:'A',text:'Stage 1 Pressure Injury',correct:false,rationale:'Stage 1 has intact skin with non-blanchable redness — no blister or open wound.'},
{letter:'B',text:'Stage 2 Pressure Injury',correct:true,rationale:'Stage 2 = partial-thickness skin loss with exposed dermis (pink/red, moist), with or without an intact/ruptured serum-filled blister. Slough, eschar, and fat are NOT visible at Stage 2.'},
{letter:'C',text:'Stage 3 Pressure Injury',correct:false,rationale:'Stage 3 shows visible subcutaneous fat — not the case here.'},
{letter:'D',text:'Unstageable Pressure Injury',correct:false,rationale:'Unstageable means slough or eschar obscures the depth. This wound bed is visible.'}
],vocabTip:'<strong>Stage 2:</strong> partial-thickness, pink/moist dermis, ± intact or ruptured serum blister. NO slough, eschar, or fat visible.'},

{id:3,chapter:21,sata:false,trap:false,
stem:'A nurse assesses a wound on the heel showing full-thickness skin loss with visible subcutaneous fat. There is some slough and rolled wound edges, but no exposed bone or tendon. This is a:',
options:[
{letter:'A',text:'Stage 2 Pressure Injury',correct:false,rationale:'Stage 2 has no exposed fat.'},
{letter:'B',text:'Stage 3 Pressure Injury',correct:true,rationale:'Stage 3 = full-thickness skin loss with exposed subcutaneous fat (adipose) visible. Slough/eschar, rolled edges, undermining, and tunneling MAY be present, but bone/tendon/muscle are NOT exposed.'},
{letter:'C',text:'Stage 4 Pressure Injury',correct:false,rationale:'Stage 4 has exposed/palpable fascia, muscle, tendon, ligament, cartilage, or bone — not the case here.'},
{letter:'D',text:'Deep Tissue Pressure Injury (DTPI)',correct:false,rationale:'DTPI has intact or non-intact skin with persistent deep red, maroon, or purple discoloration.'}
],vocabTip:'<strong>Stage 3:</strong> full-thickness loss + visible FAT. No bone/tendon/muscle. May have slough, eschar, tunneling.'},

{id:4,chapter:21,sata:false,trap:false,
stem:'A pressure injury shows a wound bed with visible muscle and a small area of palpable bone. This is a:',
options:[
{letter:'A',text:'Stage 3 Pressure Injury',correct:false,rationale:'Stage 3 stops at fat — muscle/bone exposure escalates the stage.'},
{letter:'B',text:'Stage 4 Pressure Injury',correct:true,rationale:'Stage 4 = full-thickness skin and tissue loss with exposed or directly palpable fascia, muscle, tendon, ligament, cartilage, or BONE.'},
{letter:'C',text:'Unstageable Pressure Injury',correct:false,rationale:'Unstageable means slough/eschar obscures the depth. Here the depth is clearly visible.'},
{letter:'D',text:'Stage 2 Pressure Injury',correct:false,rationale:'Stage 2 is partial thickness with no fat, muscle, or bone exposure.'}
],vocabTip:'<strong>Stage 4:</strong> full-thickness + FASCIA/MUSCLE/TENDON/BONE visible or palpable.'},

{id:5,chapter:21,sata:false,trap:false,
stem:'A wound on the sacrum is covered by a thick, dry, leathery black eschar that obscures the wound base. The nurse should document this as:',
options:[
{letter:'A',text:'Stage 4 Pressure Injury',correct:false,rationale:'Stage 4 requires VISIBLE exposed muscle/bone. The eschar prevents you from seeing depth.'},
{letter:'B',text:'Unstageable Pressure Injury',correct:true,rationale:'When slough or eschar obscures the wound base, the true depth cannot be determined. Document as UNSTAGEABLE until the necrotic tissue is removed.'},
{letter:'C',text:'Deep Tissue Pressure Injury',correct:false,rationale:'DTPI is intact or non-intact skin with deep red/maroon/purple discoloration — not eschar covering an open wound.'},
{letter:'D',text:'Stage 1 Pressure Injury',correct:false,rationale:'Stage 1 has intact skin with non-blanchable redness — no eschar.'}
],vocabTip:'<strong>Fast rule:</strong> If slough or eschar HIDES the depth → UNSTAGEABLE.'},

{id:6,chapter:21,sata:false,trap:false,
stem:'A nurse boosts a patient up in bed and later notes a deep tissue injury developing over the sacrum. The mechanism that most likely caused this injury is:',
options:[
{letter:'A',text:'Friction — surfaces rubbing parallel to the skin',correct:false,rationale:'Friction causes superficial epithelial damage. It is NOT the deep-tissue mechanism the professor emphasized.'},
{letter:'B',text:'Shear — skin stays put while underlying tissues shift, kinking blood vessels',correct:true,rationale:'The professor specifically used the boosting-in-bed example: the skin sticks to the sheet while the underlying fat/muscle slides, kinking blood vessels and causing deep tissue hypoxia and necrosis. This is shear, and it produces deeper injuries than friction.'},
{letter:'C',text:'Pressure alone with no movement',correct:false,rationale:'The mechanism described (boosting/sliding) is movement-induced — that\'s shear, not isolated pressure.'},
{letter:'D',text:'Maceration from moisture',correct:false,rationale:'Maceration is moisture-related skin breakdown, not a mechanism caused by movement.'}
],vocabTip:'<strong>Fast rule (professor):</strong> Boosting/sliding patient in bed = SHEAR → deep tissue damage. Surface rubbing = friction. Shear is worse.'},

{id:7,chapter:21,sata:true,trap:false,
stem:'Which interventions does the nurse implement to PREVENT pressure injuries? (Select all that apply.)',
options:[
{letter:'A',text:'Reposition the patient at least every 2 hours',correct:true,rationale:'Frequent repositioning is the foundational PI prevention measure.'},
{letter:'B',text:'Keep the head of the bed at or below 30 degrees and use a 30-degree side-lying tilt',correct:true,rationale:'Limiting HOB elevation reduces shearing; the 30-degree tilt avoids putting pressure directly over the trochanter.'},
{letter:'C',text:'Vigorously massage any reddened areas to improve circulation',correct:false,rationale:'TRAP. The professor explicitly warned: massaging reddened skin damages fragile capillary beds and worsens necrosis. NEVER massage.'},
{letter:'D',text:'Use a donut-shaped pillow under bony prominences',correct:false,rationale:'TRAP. Donut pillows damage capillary beds and are contraindicated — they concentrate pressure around the rim.'},
{letter:'E',text:'Consult a registered dietitian for adequate protein, calories, and fluids (2000–3000 mL/day)',correct:true,rationale:'Adequate nutrition is essential to prevent and heal PIs.'}
],vocabTip:'<strong>NEVER:</strong> massage red skin, use donut pillows. <strong>ALWAYS:</strong> reposition q2h, HOB ≤ 30°, RDN consult.'},

{id:8,chapter:21,sata:false,trap:false,
stem:'A 70-kg patient has burns covering 30% of total body surface area (TBSA). Using the Parkland Formula, what is the TOTAL fluid volume to administer in the first 24 hours, and how is it divided?',
options:[
{letter:'A',text:'4200 mL total; half (2100 mL) in the first 8 hours, the rest over the next 16 hours',correct:false,rationale:'Calculation is wrong. 4 × 70 × 30 = 8400 mL, not 4200.'},
{letter:'B',text:'8400 mL total; half (4200 mL) in the first 8 hours, the remaining half over the next 16 hours',correct:true,rationale:'Parkland Formula = 4 mL × kg × %TBSA → 4 × 70 × 30 = 8400 mL total in 24 hours. HALF (4200 mL) is given in the first 8 hours post-burn; the other HALF over the next 16 hours.'},
{letter:'C',text:'12,000 mL total over 24 hours equally',correct:false,rationale:'Equal distribution is wrong — Parkland front-loads with half in the first 8 hours.'},
{letter:'D',text:'2100 mL total over 8 hours',correct:false,rationale:'That\'s only one quarter of the correct total and ignores the second 16 hours.'}
],vocabTip:'<strong>Parkland Formula (memorize):</strong> 4 mL × kg × %TBSA = total in 24 hrs. HALF in first 8 hrs (from time of burn), other half over next 16 hrs. Goal urine output: 30–50 mL/hr.'},

{id:9,chapter:21,sata:false,trap:false,
stem:'An adult sustained burns to the entire anterior trunk and the entire right arm. Using the Rule of Nines, what is the total body surface area (TBSA) burned?',
options:[
{letter:'A',text:'18% (anterior trunk only)',correct:false,rationale:'Missing the right arm.'},
{letter:'B',text:'9% (right arm only)',correct:false,rationale:'Missing the anterior trunk.'},
{letter:'C',text:'27%',correct:true,rationale:'Rule of Nines for an adult: anterior trunk = 18%, entire arm (one) = 9%. 18 + 9 = 27% TBSA.'},
{letter:'D',text:'36%',correct:false,rationale:'That would include both arms, but the question specifies only the right arm.'}
],vocabTip:'<strong>Rule of Nines (adult):</strong> head 9 · each arm 9 · anterior trunk 18 · posterior trunk 18 · each leg 18 · perineum 1 = 100%.'},

{id:10,chapter:21,sata:false,trap:true,
stem:'A patient is brought to the ED with a small (8%) thermal burn from a house fire. The nurse notes singed nasal hair, hoarseness, and carbon-streaked sputum. What is the PRIORITY action?',
options:[
{letter:'A',text:'Apply moist sterile dressings to the burn area first',correct:false,rationale:'TRAP. The burn area is small, but the AIRWAY is the priority. Don\'t be lulled by burn size.'},
{letter:'B',text:'Anticipate early intubation and notify the provider — the airway is at high risk of obstruction',correct:true,rationale:'Singed nasal hair + hoarseness + carbonaceous sputum signal inhalation injury. Airway edema will progress and obstruct rapidly. Early intubation BEFORE the obstruction is complete is the priority. If wheezing disappears, the airway is closing.'},
{letter:'C',text:'Begin oral rehydration immediately',correct:false,rationale:'Oral fluids are inappropriate with airway compromise; IV resuscitation per Parkland.'},
{letter:'D',text:'Reassure the patient that the burn is small and will heal',correct:false,rationale:'Dismissing the airway risk is unsafe.'}
],vocabTip:'<strong>TRAP:</strong> Small burn ≠ safe. Inhalation injury (singed hair, hoarseness, carbon sputum) → AIRWAY FIRST. Intubate EARLY.'},

{id:11,chapter:21,sata:false,trap:false,
stem:'During the emergent phase of burn care, the nurse should expect the goal urine output (per the professor) to be:',
options:[
{letter:'A',text:'10–15 mL/hr',correct:false,rationale:'Too low — indicates inadequate fluid resuscitation.'},
{letter:'B',text:'30–50 mL/hr',correct:true,rationale:'Standard burn fluid resuscitation target: 30–50 mL/hr in an adult. Below 30 suggests under-resuscitation; above 50 risks overload.'},
{letter:'C',text:'60–80 mL/hr',correct:false,rationale:'Too high — risks fluid overload and pulmonary edema.'},
{letter:'D',text:'100 mL/hr',correct:false,rationale:'Way too high — would indicate massive over-resuscitation.'}
],vocabTip:'<strong>Burn UO goal:</strong> 30–50 mL/hr. Use it to titrate Parkland fluids.'},

{id:12,chapter:21,sata:false,trap:false,
stem:'A patient pulled from a burning building has cherry-red skin and altered mental status. The nurse suspects:',
options:[
{letter:'A',text:'Carbon monoxide poisoning',correct:true,rationale:'Cherry-red skin tone with altered mental status after fire exposure is the classic presentation of CO poisoning. CO binds hemoglobin tightly, displacing oxygen. Treat with 100% O2 (and hyperbaric O2 if severe).'},
{letter:'B',text:'Hypothermia',correct:false,rationale:'Hypothermia causes pale/cyanotic, cool skin — not cherry red.'},
{letter:'C',text:'Anaphylaxis',correct:false,rationale:'Anaphylaxis presents with urticaria, hypotension, and airway swelling — not cherry-red skin.'},
{letter:'D',text:'Septic shock',correct:false,rationale:'Sepsis causes warm but typically flushed/mottled skin and fever, not the specific cherry-red CO pattern.'}
],vocabTip:'<strong>Fast rule:</strong> Cherry-red skin + altered mental status after fire = CO poisoning. Treatment: 100% O₂.'},

{id:13,chapter:21,sata:false,trap:false,
stem:'A patient with psoriasis has silvery-white scaly plaques on the elbows and knees. The nurse explains the underlying mechanism is:',
options:[
{letter:'A',text:'A bacterial skin infection requiring antibiotics',correct:false,rationale:'Psoriasis is autoimmune, not bacterial. Antibiotics do not treat it.'},
{letter:'B',text:'A chronic autoimmune disorder causing rapid epidermal cell turnover',correct:true,rationale:'Psoriasis is a chronic autoimmune disorder with exacerbations and remissions. Rapid keratinocyte turnover produces the characteristic thick, silvery-white scaly plaques. Plaque psoriasis is the most common type.'},
{letter:'C',text:'An allergic reaction to a food trigger',correct:false,rationale:'Psoriasis is autoimmune, not an acute allergic process.'},
{letter:'D',text:'A normal age-related skin change',correct:false,rationale:'Psoriasis is a pathologic chronic disease, not normal aging.'}
],vocabTip:'<strong>Psoriasis = autoimmune</strong>, chronic, with silvery scales. Plaque type is most common. Triggers: stress, infection, certain meds.'},

{id:14,chapter:21,sata:false,trap:true,
stem:'A patient on adalimumab (a biologic for psoriasis) calls the clinic reporting a low-grade fever, cough, and night sweats. The nurse\'s PRIORITY response is:',
options:[
{letter:'A',text:'Reassure the patient — biologics rarely cause systemic effects.',correct:false,rationale:'TRAP. Biologics carry Black Box warnings for immunosuppression and serious opportunistic infection (including TB, sepsis, fungal infections).'},
{letter:'B',text:'Recommend over-the-counter cold medication.',correct:false,rationale:'These symptoms could be TB or another serious infection — never dismiss them on a biologic.'},
{letter:'C',text:'Tell the patient to come in immediately — biologics suppress immunity and these symptoms could be TB, sepsis, or another serious infection.',correct:true,rationale:'The professor emphasized: biologics like adalimumab, etanercept, infliximab, and secukinumab are powerful immunosuppressants with Black Box warnings. Low-grade fever + cough + night sweats can be reactivation TB or another serious infection. The patient cannot wait. They also CANNOT receive live vaccines while on these drugs.'},
{letter:'D',text:'Ask the patient to double the next biologic dose to fight the infection.',correct:false,rationale:'Doubling an immunosuppressant during a possible infection is dangerous and not how dosing works.'}
],vocabTip:'<strong>TRAP — Biologic Black Box:</strong> immunosuppressed = TB/sepsis/fungal risk. Any fever/cough/fatigue = evaluate NOW. NO live vaccines.'},

{id:15,chapter:21,sata:false,trap:true,
stem:'A nurse is teaching a 28-year-old woman about a new prescription for tazarotene (a topical retinoid) for psoriasis. Which teaching point is the PRIORITY?',
options:[
{letter:'A',text:'"Apply it generously to all skin once daily for best effect."',correct:false,rationale:'Retinoids are applied sparingly to affected areas only — not generously.'},
{letter:'B',text:'"This drug is highly teratogenic — you must use reliable birth control while using it and avoid pregnancy."',correct:true,rationale:'TRAP. Tazarotene is highly teratogenic (causes birth defects). The professor emphasized that women of childbearing age must be on strict birth control while using it. This is the priority teaching.'},
{letter:'C',text:'"You can use this safely during pregnancy."',correct:false,rationale:'DANGEROUS — directly contraindicated in pregnancy.'},
{letter:'D',text:'"This medication will cure your psoriasis permanently."',correct:false,rationale:'Psoriasis is chronic with exacerbations and remissions; no topical cures it.'}
],vocabTip:'<strong>TRAP:</strong> Topical does NOT mean safe. <strong>Tazarotene is teratogenic</strong> — strict birth control in women of childbearing age.'},

{id:16,chapter:21,sata:false,trap:false,
stem:'A patient on allopurinol develops widespread blistering and skin sloughing involving about 35% of total body surface area. The nurse recognizes this as Toxic Epidermal Necrolysis (TEN). The PRIORITY intervention is:',
options:[
{letter:'A',text:'Apply moisturizing lotion to the lesions',correct:false,rationale:'Doesn\'t address the cause; supportive care follows AFTER stopping the trigger.'},
{letter:'B',text:'Withdraw the suspected offending drug (allopurinol) immediately',correct:true,rationale:'SJS/TEN is most often drug-triggered (allopurinol, anticonvulsants, NSAIDs, antibiotics). The single most important first action is STOP THE OFFENDING DRUG. Then provide burn-unit level supportive care (fluids, temperature control, infection prevention).'},
{letter:'C',text:'Administer a steroid taper at home',correct:false,rationale:'Outpatient steroid taper is not appropriate; this is a life-threatening emergency requiring inpatient/burn-unit care.'},
{letter:'D',text:'Continue the medication and observe for improvement',correct:false,rationale:'Continuing the trigger is dangerous — TEN can be fatal.'}
],vocabTip:'<strong>SJS / TEN:</strong> usually drug-induced (allopurinol, anticonvulsants, NSAIDs, abx). PRIORITY = stop the drug. SJS < 10% BSA, TEN > 30%.'},

{id:17,chapter:21,sata:false,trap:true,
stem:'A patient with widespread urticaria (hives) from a histamine reaction asks the nurse for advice. Which teaching is CORRECT?',
options:[
{letter:'A',text:'"Take a hot shower or sit in a hot tub to soothe the itching."',correct:false,rationale:'TRAP. Heat causes vasodilation and worsens histamine-driven hives/itching. AVOID warm environments.'},
{letter:'B',text:'"Use cool or tepid baths with colloidal oatmeal and cool compresses for the itching."',correct:true,rationale:'For urticaria, cool/tepid temperatures and colloidal oatmeal baths reduce histamine effects and soothe itching. Keep fingernails short and consider mittens at night to prevent the itch-scratch-itch cycle.'},
{letter:'C',text:'"Wear tight clothing to suppress the rash."',correct:false,rationale:'Tight clothing irritates and worsens hives.'},
{letter:'D',text:'"Skip your antihistamine if you feel a little better."',correct:false,rationale:'Continuing the antihistamine schedule helps prevent rebound.'}
],vocabTip:'<strong>TRAP:</strong> Hives + heat = WORSE. Use COOL, oatmeal baths, mittens at night. Break the itch-scratch-itch cycle.'},

{id:18,chapter:21,sata:false,trap:false,
stem:'A patient develops a painful, unilateral vesicular rash that follows a single dermatome along the rib cage. The nurse recognizes this as:',
options:[
{letter:'A',text:'Herpes Simplex (HSV-1)',correct:false,rationale:'HSV-1 typically causes cold sores around the lips/mouth — not a dermatomal trunk rash.'},
{letter:'B',text:'Herpes Zoster (shingles)',correct:true,rationale:'Herpes zoster (shingles) is a reactivation of varicella-zoster virus along a single dermatome — characteristically UNILATERAL with grouped vesicles following a nerve pathway. Treat with antivirals (acyclovir/valacyclovir).'},
{letter:'C',text:'Tinea corporis (ringworm)',correct:false,rationale:'Tinea causes ring-shaped scaly patches — not vesicular dermatomal rash.'},
{letter:'D',text:'Scabies',correct:false,rationale:'Scabies causes intense night itching with linear burrows in the skin, often between fingers — not a dermatomal rash.'}
],vocabTip:'<strong>Shingles (Herpes Zoster):</strong> UNILATERAL dermatomal vesicles, painful. Treat with antivirals. Live vaccine available — but NOT for patients on biologics.'},

{id:19,chapter:21,sata:false,trap:false,
stem:'Which skin cancer is described as a pearly/waxy papule with a central crater and rolled borders, is the MOST COMMON skin cancer, but rarely metastasizes?',
options:[
{letter:'A',text:'Melanoma',correct:false,rationale:'Melanoma is irregularly shaped, variegated pigmentation, and highly metastatic — opposite features.'},

let answered={};
let selections={};

function _seedHash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function _shuffleAllOptions(){if(window.__optsShuffled)return;window.__optsShuffled=true;questions.forEach(function(q){if(!q.options||q.options.length<2)return;var a=q.options.slice();var rnd=mulberry32(_seedHash((typeof EXAM_ID!=='undefined'&&EXAM_ID?EXAM_ID:'q')+'#'+q.id));for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}var L=['A','B','C','D','E','F','G','H'];for(var k=0;k<a.length;k++){a[k].letter=L[k];}q.options=a;});}
function buildQuiz(){_shuffleAllOptions();
const area=document.getElementById('quizArea');
area.innerHTML='';
questions.forEach((q,idx)=>{
const card=document.createElement('div');
card.className='q-card';
card.id=`qcard-${q.id}`;
const isSata=q.sata===true;
const trapBadge=q.trap?'<span class="badge badge-trap">TRAP</span>':'';
const sataBadge=isSata?'<span class="badge badge-sata">SATA</span>':'';
card.innerHTML=`
<div class="q-top">
<span class="q-num">Q${idx+1}</span>
<span class="badge badge-ch${q.chapter}">Ch ${q.chapter}</span>
${trapBadge}${sataBadge}
</div>
<div class="q-stem">${q.stem}${isSata?'<em>(Select all that apply)</em>':''}</div>
<div class="opts" id="opts-${q.id}">
${q.options.map(o=>`
<div class="opt" id="opt-${q.id}-${o.letter}" onclick="toggleOpt(${q.id},'${o.letter}',${isSata})">
<span class="opt-letter">${o.letter}.</span>
<div><span class="opt-text">${o.text}</span><div class="opt-rationale" id="rat-${q.id}-${o.letter}">${o.rationale}</div></div>
</div>`).join('')}
</div>
<button class="btn-submit" id="btn-${q.id}" onclick="submitQ(${q.id})">Submit Answer</button>
<div class="vocab-tip" id="tip-${q.id}">${q.vocabTip}</div>
${q.trap?`<div class="trap-callout" id="trap-${q.id}">&#9888; TRAP QUESTION: tests a common misconception. Read the rationale carefully!</div>`:''}
`;
area.appendChild(card);
});
loadState();
}

function toggleOpt(qId,letter,isSata){
if(answered[qId])return;
if(!selections[qId])selections[qId]=[];
if(isSata){
const idx=selections[qId].indexOf(letter);
if(idx>-1)selections[qId].splice(idx,1);
else selections[qId].push(letter);
}else{
selections[qId]=[letter];
}
const q=questions.find(x=>x.id===qId);
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.classList.toggle('selected',selections[qId].includes(o.letter));
});
}

function submitQ(qId){
if(answered[qId])return;
if(!selections[qId]||selections[qId].length===0)return;
answered[qId]=true;
const q=questions.find(x=>x.id===qId);
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const isCorrect=correctLetters.length===selections[qId].length&&correctLetters.every(l=>selections[qId].includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
el.style.cursor='default';
if(o.correct)el.classList.add('correct-show');
else if(selections[qId].includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
document.getElementById(`btn-${qId}`).disabled=true;
document.getElementById(`btn-${qId}`).textContent=isCorrect?'Correct!':'Incorrect';
updateProgress();
saveState();
if(Object.keys(answered).length===questions.length)showScore();
}

function updateProgress(){
const pct=(Object.keys(answered).length/questions.length)*100;
document.getElementById('progressBar').style.width=pct+'%';
}

function showScore(doSave){
let correct=0;
questions.forEach(q=>{
if(answered[q.id]){
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[q.id]||[];
if(correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l)))correct++;
}
});
const pct=Math.round((correct/questions.length)*100);
document.getElementById('finalScore').textContent=pct+'%';
document.getElementById('finalText').textContent=`${correct} of ${questions.length} correct`;
document.getElementById('scoreCard').style.display='block';
document.getElementById('scoreCard').scrollIntoView({behavior:'smooth'});
const record={score:pct,correct:correct,total:questions.length,date:new Date().toLocaleDateString(),chapters:{21:{correct:correct,total:questions.length}}};
if(doSave===false)return;
localStorage.setItem(EXAM_ID+'-last',JSON.stringify(record));
localStorage.setItem(EXAM_ID+'-label',EXAM_LABEL);
const hist=JSON.parse(localStorage.getItem('examHistory')||'[]').filter(function(e){return e.examId!==EXAM_ID;});
hist.push({examId:EXAM_ID,examLabel:EXAM_LABEL,date:new Date().toISOString(),score:pct,correct:correct,total:questions.length,topicBreakdown:{21:{correct:correct,total:questions.length}}});
localStorage.setItem('examHistory',JSON.stringify(hist.slice(-100)));
}

function restartQuiz(){
answered={};
selections={};
localStorage.removeItem(EXAM_ID+'-state');
document.getElementById('scoreCard').style.display='none';
buildQuiz();
}

function saveState(){
localStorage.setItem(EXAM_ID+'-state',JSON.stringify({answered,selections}));
}

function loadState(){
const saved=localStorage.getItem(EXAM_ID+'-state');
if(saved){
const state=JSON.parse(saved);
answered=state.answered||{};
selections=state.selections||{};
Object.keys(answered).forEach(qId=>{
const q=questions.find(x=>x.id==qId);
if(!q)return;
const correctLetters=q.options.filter(o=>o.correct).map(o=>o.letter);
const sel=selections[qId]||[];
const isCorrect=correctLetters.length===sel.length&&correctLetters.every(l=>sel.includes(l));
q.options.forEach(o=>{
const el=document.getElementById(`opt-${qId}-${o.letter}`);
if(sel.includes(o.letter))el.classList.add('selected');
if(o.correct)el.classList.add('correct-show');
else if(sel.includes(o.letter)&&!o.correct)el.classList.add('wrong-show');
el.style.cursor='default';
document.getElementById(`rat-${qId}-${o.letter}`).style.display='block';
});
document.getElementById(`tip-${qId}`).style.display='block';
if(q.trap)document.getElementById(`trap-${qId}`).style.display='block';
const card=document.getElementById(`qcard-${qId}`);
card.classList.add(isCorrect?'answered-correct':'answered-wrong');
const btn=document.getElementById(`btn-${qId}`);
btn.disabled=true;
btn.textContent=isCorrect?'Correct!':'Incorrect';
});
updateProgress();
if(Object.keys(answered).length===questions.length)showScore(false);
}
const last=localStorage.getItem(EXAM_ID+'-last');
if(last){
const r=JSON.parse(last);
document.getElementById('lastAttempt').style.display='block';
document.getElementById('lastScore').textContent=r.score+'%';
document.getElementById('lastDate').textContent=r.date;
}
}

buildQuiz();
</script>
<script src="encourage.js"></script>
